[project]
name = "dinkster-nodes-std"
version = "0.0.1"
description = "Dinkster standard first-party node pack suite"
requires-python = ">=3.12"
dependencies = [
    "dinkster-nodes-foundation==0.0.1",
    "dinkster-nodes-media-io==0.0.1",
    "dinkster-nodes-image==0.0.1",
    "dinkster-nodes-remote==0.0.1",
    "dinkster-nodes-vision==0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"dinkster.lock" = "dinkster_nodes_std_suite/dinkster.lock"

[tool.uv.sources]
dinkster-nodes-foundation = { workspace = true }
dinkster-nodes-media-io = { workspace = true }
dinkster-nodes-image = { workspace = true }
dinkster-nodes-remote = { workspace = true }
dinkster-nodes-vision = { workspace = true }
