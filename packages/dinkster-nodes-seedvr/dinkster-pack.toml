[pack]
name = "dinkster-seedvr"
version = "0.0.2"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.seedvr"]
requires = ["torch", "dinkster-inference==0.1.1", "numpy"]

[pack.inference]
imports = ["ldm.seedvr.color_fix", "ldm.seedvr.constants", "model_management"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_seedvr:NODES"
types = "dinkster_seedvr:register_types"
