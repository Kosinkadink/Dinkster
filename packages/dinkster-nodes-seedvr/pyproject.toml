[project]
name = "dinkster-seedvr"
version = "0.0.3"
description = "Dinkster seedvr model nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference==0.1.1",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_seedvr"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_seedvr/dinkster-pack.toml"
"locales" = "dinkster_seedvr/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
