[project]
name = "dinkster-nodes-seedvr"
version = "0.0.2"
description = "Dinkster seedvr model nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_seedvr"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_seedvr_pack/dinkster-pack.toml"
"src/dinkster_nodes_seedvr" = "dinkster_seedvr_pack/dinkster_nodes_seedvr"
"locales" = "dinkster_seedvr_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
