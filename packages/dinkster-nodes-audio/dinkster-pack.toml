[pack]
name = "dinkster-audio"
version = "0.0.3"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.audio"]
type-namespaces = []
requires = ["av>=14", "numpy>=1.26", "torch", "dinkster-inference==0.1.1"]

[pack.sandbox]

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_audio:NODES"
types = "dinkster_audio:register_types"
