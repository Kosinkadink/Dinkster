[project]
name = "dinkster-nodes-comfy"
version = "0.0.1"
description = "Native Dinkster implementations of ComfyUI core nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "simpleeval==1.0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_comfy"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_nodes_comfy_pack/dinkster-pack.toml"
"src/dinkster_nodes_comfy" = "dinkster_nodes_comfy_pack/dinkster_nodes_comfy"

[tool.uv.sources]
dinkster-api = { workspace = true }
