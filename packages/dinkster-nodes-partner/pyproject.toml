[project]
name = "dinkster-nodes-partner"
version = "0.0.1"
description = "Dinkster partner API node pack"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "pillow==12.0.0",
    "av==16.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_partner"]

[tool.uv.sources]
dinkster-api = { workspace = true }
