[project]
name = "dinkster-workers"
version = "0.0.3"
description = "Dinkster Worker implementations (in-process now; isolated venv and remote later)"
requires-python = ">=3.12"
dependencies = ["dinkster-schema", "dinkster-values", "dinkster-protocol", "dinkster-memory", "dinkster-assets", "dinkster-caches", "dinkster-image-document", "dinkster-inference-wire", "packaging>=23"]

[project.scripts]
dinkster-doctor = "dinkster_workers.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_workers"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "../../hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"../dinkster-supervisor/shared/dinkster_store" = "dinkster_store"

[tool.uv.sources]
dinkster-schema = { workspace = true }
dinkster-values = { workspace = true }
dinkster-protocol = { workspace = true }
dinkster-caches = { workspace = true }
dinkster-image-document = { workspace = true }
dinkster-inference-wire = { workspace = true }
