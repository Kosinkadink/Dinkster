[project]
name = "dinkster-acceptance"
version = "0.0.1"
description = "Installable remote-worker acceptance nodes and controllers"
requires-python = ">=3.12"
dependencies = [
    "dinkster-caches",
    "dinkster-compat-comfy",
    "dinkster-engine",
    "dinkster-graph",
    "dinkster-inference",
    "dinkster-inference-torch",
    "dinkster-schema",
    "dinkster-values",
    "dinkster-workers",
]

[project.optional-dependencies]
cloud = ["dinkster-inference-torch[torch]"]

[project.scripts]
dinkster-acceptance-controller = "dinkster_acceptance.controller:main"
dinkster-acceptance-import-check = "dinkster_acceptance.import_check:main"
dinkster-acceptance-manifest = "dinkster_acceptance:print_manifest_path"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_acceptance"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_acceptance_pack/dinkster-pack.toml"
"src/dinkster_acceptance" = "dinkster_acceptance_pack/dinkster_acceptance"

[tool.uv.sources]
dinkster-caches = { workspace = true }
dinkster-compat-comfy = { workspace = true }
dinkster-engine = { workspace = true }
dinkster-graph = { workspace = true }
dinkster-inference = { workspace = true }
dinkster-inference-torch = { workspace = true }
dinkster-schema = { workspace = true }
dinkster-values = { workspace = true }
dinkster-workers = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv-torch"
include = ["src", "tests"]
extraPaths = [
    "src",
    "../dinkster-inference/src",
    "../dinkster-inference-torch/src",
]
typeCheckingMode = "standard"
