[project]
name = "dinkster-graph"
version = "0.0.1"
description = "Dinkster graph model, structural validation, and execution planning (pure)"
requires-python = ">=3.12"
dependencies = ["dinkster-schema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_graph"]

[tool.uv.sources]
dinkster-schema = { workspace = true }
