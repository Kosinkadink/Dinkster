[pack]
name = "dinkster-vision-depth-anything-v3"
namespaces = []
executes = ["dinkster.preprocess.model_depth"]
requires = [
    "numpy==2.5.1",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.0.0",
    "safetensors==0.8.0",
    "torch==2.13.0",
    "transformers==5.16.1",
]

[pack.sandbox]
gpu = false
network = false
writable-mounts = false

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-nodes-image = ">=0.0.1,<1"

[[pack.vision-providers]]
choice = "dinkster.preprocess.model_depth.providers"
node = "dinkster.preprocess.model_depth"
model = "depth-anything-v3"
devices = ["cpu"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["depth-anything-3-mono-large"]

[[pack.assets]]
id = "depth-anything-3-mono-large"
name = "Depth Anything 3 Mono Large relative-depth model (Apache-2.0)"
digest = "blake3:c7c3ae1883d3ad41d64aa9ce2988f265fa3c437105fadc32ff2949b7e8f18323"
kind = "model/preprocessor"
size = 1336748056
media_type = "application/octet-stream"
urls = [
    "https://huggingface.co/Comfy-Org/Depth-Anything-3/resolve/913d1a7ab58ddbfbf94a33bf536c4fc2ff25465d/geometry_estimation/depth_anything_3_mono_large.safetensors",
]

[pack.entry]
nodes = "dinkster_nodes_vision.depth_anything_v3:DEPTH_ANYTHING_V3_PROVIDER_NODES"
types = "dinkster_nodes_vision.depth_anything_v3:register_types"
