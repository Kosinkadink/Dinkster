[pack]
name = "dinkster-vision-hed"
namespaces = []
executes = [
    "dinkster.preprocess.model_edges",
    "dinkster.preprocess.lineart_realistic",
    "dinkster.preprocess.lineart_anime",
    "dinkster.preprocess.lineart_manga",
    "dinkster.preprocess.anyline",
    "dinkster.preprocess.teed",
    "dinkster.preprocess.mlsd",
]
requires = [
    "numpy==2.5.1",
    "opencv-python-headless==5.0.0.93",
    "torch==2.13.0",
]

[pack.sandbox]
gpu = true
network = false
writable-mounts = false

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-nodes-image = ">=0.0.1,<1"

[[pack.vision-providers]]
choice = "dinkster.preprocess.model_edges.providers"
node = "dinkster.preprocess.model_edges"
devices = ["cpu", "cuda"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["hed-model"]

[[pack.vision-providers]]
choice = "dinkster.preprocess.lineart_realistic.providers"
node = "dinkster.preprocess.lineart_realistic"
devices = ["cpu", "cuda"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["lineart-realistic-model", "lineart-realistic-coarse-model"]

[[pack.vision-providers]]
choice = "dinkster.preprocess.lineart_anime.providers"
node = "dinkster.preprocess.lineart_anime"
devices = ["cpu", "cuda"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["lineart-anime-model"]

[[pack.vision-providers]]
choice = "dinkster.preprocess.lineart_manga.providers"
node = "dinkster.preprocess.lineart_manga"
devices = ["cpu", "cuda"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["lineart-manga-model"]

[[pack.vision-providers]]
choice = "dinkster.preprocess.anyline.providers"
node = "dinkster.preprocess.anyline"
devices = ["cpu", "cuda"]
dtypes = ["float32"]
batching = "per-image"
artifacts = [
    "mteed-model",
    "lineart-realistic-model",
    "lineart-anime-model",
    "lineart-manga-model",
]

[[pack.vision-providers]]
choice = "dinkster.preprocess.teed.providers"
node = "dinkster.preprocess.teed"
devices = ["cpu", "cuda"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["teed-model"]

[[pack.vision-providers]]
choice = "dinkster.preprocess.mlsd.providers"
node = "dinkster.preprocess.mlsd"
devices = ["cpu", "cuda"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["mlsd-model"]

