[pack]
name = "dinkster-vision-sam31"
namespaces = []
executes = [
    "dinkster.detection.detect",
    "dinkster.detection.segment",
    "dinkster.detection.segment_text",
    "dinkster.detection.track",
]
requires = [
    "numpy==2.5.1",
    "opencv-python-headless==5.0.0.93",
    "safetensors==0.8.0",
    "torch==2.13.0",
]

[pack.sandbox]
gpu = false
network = false
writable-mounts = false

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-nodes-image = ">=0.0.1,<1"

[[pack.vision-providers]]
choice = "dinkster.detection.detect.providers"
node = "dinkster.detection.detect"
model = "sam-3.1"
devices = ["cpu"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["sam31-multiplex-fp16"]

[[pack.vision-providers]]
choice = "dinkster.detection.segment.providers"
node = "dinkster.detection.segment"
model = "sam-3.1"
devices = ["cpu"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["sam31-multiplex-fp16"]

[[pack.vision-providers]]
choice = "dinkster.detection.segment_text.providers"
node = "dinkster.detection.segment_text"
devices = ["cpu"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["sam31-multiplex-fp16"]

[[pack.vision-providers]]
choice = "dinkster.detection.track.providers"
node = "dinkster.detection.track"
devices = ["cpu"]
dtypes = ["float32"]
batching = "batch"
artifacts = ["sam31-multiplex-fp16"]

[[pack.assets]]
id = "sam31-multiplex-fp16"
name = "SAM 3.1 Multiplex detector, segmenter, and tracker (SAM License)"
digest = "blake3:1c8d5762dbaf238bc9a2f10de07e0c476d1b68e75453566feb8dc9bcf2cb41c5"
kind = "model/segmenter"
size = 1745546848
media_type = "application/octet-stream"
urls = [
    "https://huggingface.co/Comfy-Org/sam3.1/resolve/f38cd62b71494b53ac2b56ca36e24f3c8d565581/checkpoints/sam3.1_multiplex_fp16.safetensors",
]

[pack.entry]
nodes = "dinkster_nodes_vision.sam31:SAM31_PROVIDER_NODES"
types = "dinkster_nodes_vision.sam31:register_types"
