[project]
name = "dinkster-nodes-void"
version = "0.0.2"
description = "Dinkster void model nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-nodes-conditioning", "dinkster-inference-wire"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_void"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_void_pack/dinkster-pack.toml"
"src/dinkster_nodes_void" = "dinkster_void_pack/dinkster_nodes_void"
"locales" = "dinkster_void_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-nodes-conditioning = { workspace = true }
dinkster-inference-wire = { workspace = true }
