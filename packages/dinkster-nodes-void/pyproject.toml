[project]
name = "dinkster-void"
version = "0.0.5"
description = "Dinkster void model nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference",
    "numpy",
    "dinkster-video>=0.0.1",
    "dinkster-pack-helpers>=0.0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_void"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_void/dinkster-pack.toml"
"locales" = "dinkster_void/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-video = { workspace = true }
dinkster-pack-helpers = { workspace = true }
