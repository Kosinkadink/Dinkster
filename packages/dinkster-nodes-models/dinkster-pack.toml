[pack]
name = "dinkster-models"
version = "0.0.4"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.models", "devices"]
requires = ["torch", "comfy-kitchen", "dinkster-inference==0.1.1", "dinkster-pack-helpers>=0.0.2,<1"]

[pack.inference]
imports = ["cli_args", "clip_vision", "context_windows", "controlnet", "diffusers_load", "hooks", "latent_formats", "ldm.anima.lllite", "ldm.common_dit", "ldm.hunyuan_video.upsampler", "ldm.lightricks.duration_head", "ldm.lightricks.latent_upsampler", "ldm.lumina.controlnet", "ldm.minimax.controlnet", "ldm.minimax.model", "ldm.modules.attention", "ldm.qwen_image21.model", "ldm.supir.supir_modules", "ldm.wan.model_multitalk", "ldm.wan.uni3c", "model_base", "model_management", "model_patcher", "model_prefetch", "model_sampling", "multigpu", "ops", "patcher_extension", "sd", "storage", "utils"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_models:NODES"
types = "dinkster_models.types:register_types"
choices = "dinkster_models.device_routing:device_choices"
