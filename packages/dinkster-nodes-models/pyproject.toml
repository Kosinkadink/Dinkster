[project]
name = "dinkster-nodes-models"
version = "0.0.2"
description = "First-party Dinkster models nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-inference-wire"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_models"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_models_pack/dinkster-pack.toml"
"src/dinkster_nodes_models" = "dinkster_models_pack/dinkster_nodes_models"
"locales" = "dinkster_models_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-inference-wire = { workspace = true }
