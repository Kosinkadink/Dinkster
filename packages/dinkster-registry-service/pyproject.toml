[project]
name = "dinkster-registry-service"
version = "0.0.1"
description = "Dinkster registry service: durable storage and operations over the pure registry model"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10", "dinkster-registry", "dinkster-schema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_registry_service"]

[tool.uv.sources]
dinkster-registry = { workspace = true }
dinkster-schema = { workspace = true }
