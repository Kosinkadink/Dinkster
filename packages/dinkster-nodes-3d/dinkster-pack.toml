[pack]
name = "dinkster-3d"
version = "0.0.4"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.3d"]
type-namespaces = []
requires = ["torch", "dinkster-inference", "numpy>=1.26", "scipy>=1.11", "tqdm>=4", "pillow>=10"]

[pack.sandbox]
gpu = true
writable-mounts = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-image = ">=0.0.1,<1"

[pack.entry]
nodes = "dinkster_3d:NODES"
types = "dinkster_3d:register_types"
