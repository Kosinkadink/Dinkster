[project]
name = "dinkster-nodes-3d"
version = "0.0.2"
description = "ComfyUI-origin 3d nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-nodes-image", "numpy>=1.26", "scipy>=1.11", "tqdm>=4", "numba>=0.67"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_3d"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_3d_pack/dinkster-pack.toml"
"src/dinkster_nodes_3d" = "dinkster_3d_pack/dinkster_nodes_3d"
"locales" = "dinkster_3d_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-nodes-image = { workspace = true }
