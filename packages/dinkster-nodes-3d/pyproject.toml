[project]
name = "dinkster-3d"
version = "0.0.2"
description = "ComfyUI-origin 3d nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference==0.1.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm>=4",
    "pillow>=10",
    "dinkster-image>=0.0.1,<1",
]

[project.optional-dependencies]
numba = ["numba>=0.67"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_3d"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_3d/dinkster-pack.toml"
"locales" = "dinkster_3d/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-image = { workspace = true }
