[project]
name = "dinkster-nodes-3d"
version = "0.0.2"
description = "Dinkster three-dimensional geometry nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "numpy>=1.26", "scipy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_3d"]

[tool.uv.sources]
dinkster-api = { workspace = true }
