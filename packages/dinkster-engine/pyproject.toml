[project]
name = "dinkster-engine"
version = "0.0.2"
description = "Dinkster execution engine: the scheduler behind the dinkster-protocol boundary (hazard H3)"
requires-python = ">=3.12"
dependencies = ["dinkster-api==0.0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_engine"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "../../hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"../dinkster-graph/src/dinkster_graph" = "dinkster_graph"

[tool.uv.sources]
dinkster-api = { workspace = true }
