[project]
name = "dinkster-engine"
version = "0.0.1"
description = "Dinkster execution engine: the scheduler behind the dinkster-protocol boundary (hazard H3)"
requires-python = ">=3.12"
dependencies = ["dinkster-schema", "dinkster-values", "dinkster-graph", "dinkster-protocol"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_engine"]

[tool.uv.sources]
dinkster-schema = { workspace = true }
dinkster-values = { workspace = true }
dinkster-graph = { workspace = true }
dinkster-protocol = { workspace = true }
