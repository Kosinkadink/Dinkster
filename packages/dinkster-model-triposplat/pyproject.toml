[project]
name = "dinkster-model-triposplat"
version = "0.0.1"
description = "Dinkster first-party TripoSplat model node pack"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-inference",
    "dinkster-inference-torch",
    "numpy>=1.26",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_model_triposplat"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_model_triposplat_pack/dinkster-pack.toml"
"src/dinkster_model_triposplat" = "dinkster_model_triposplat_pack/dinkster_model_triposplat"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-inference = { workspace = true }
dinkster-inference-torch = { workspace = true }
