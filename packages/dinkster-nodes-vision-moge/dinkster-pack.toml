[pack]
name = "dinkster-vision-moge"
version = "0.0.2"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.vision.moge"]
requires = ["torch", "dinkster-inference==0.1.1"]

[pack.inference]
imports = ["ldm.colormap", "ldm.moge.geometry", "ldm.moge.model", "ldm.moge.panorama", "model_management", "utils"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_vision_moge:NODES"
types = "dinkster_vision_moge:register_types"
