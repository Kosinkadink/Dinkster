[project]
name = "dinkster-vision-moge"
version = "0.0.3"
description = "ComfyUI-origin vision-moge nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_moge"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_moge/dinkster-pack.toml"
"locales" = "dinkster_vision_moge/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
