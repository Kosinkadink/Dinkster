[project]
name = "dinkster-nodes-vision-moge"
version = "0.0.2"
description = "Dinkster monocular geometry estimation nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_vision_moge"]

[tool.uv.sources]
dinkster-api = { workspace = true }
