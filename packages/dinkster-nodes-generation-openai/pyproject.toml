[project]
name = "dinkster-nodes-generation-openai"
version = "0.0.1"
description = "Dinkster OpenAI-compatible generation execution pack"
requires-python = ">=3.12"
dependencies = [
    "dinkster-inference",
    "dinkster-nodes-generation",
    "dinkster-workers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_generation_openai"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_nodes_generation_openai_pack/dinkster-pack.toml"
"src/dinkster_nodes_generation_openai" = "dinkster_nodes_generation_openai_pack/dinkster_nodes_generation_openai"

[tool.uv.sources]
dinkster-inference = { workspace = true }
dinkster-nodes-generation = { workspace = true }
dinkster-workers = { workspace = true }
