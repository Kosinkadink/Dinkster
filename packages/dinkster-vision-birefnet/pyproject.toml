[project]
name = "dinkster-vision-birefnet"
version = "0.0.1"
description = "Dinkster BiRefNet model-backed foreground matting provider"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-inference-torch",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_birefnet"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_birefnet_pack/dinkster-pack.toml"
"src/dinkster_vision_birefnet" = "dinkster_vision_birefnet_pack/dinkster_vision_birefnet"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-inference-torch = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv-torch"
include = ["src", "tests"]
typeCheckingMode = "standard"
