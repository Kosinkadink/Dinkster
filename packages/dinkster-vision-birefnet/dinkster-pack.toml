[pack]
name = "dinkster-vision-birefnet"
namespaces = []
executes = ["dinkster.image.matte"]
requires = [
    "dinkster-inference-torch==0.0.1",
    "numpy==2.5.1",
    "safetensors==0.8.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[pack.sandbox]
gpu = false
network = false
writable-mounts = false

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-nodes-image = ">=0.0.1,<1"

[[pack.vision-providers]]
choice = "dinkster.image.matte.providers"
node = "dinkster.image.matte"
devices = ["cpu"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["birefnet-general"]

[[pack.assets]]
id = "birefnet-general"
name = "BiRefNet general-use foreground matting model"
digest = "blake3:03f8793ff101fb10981ee700fe276a6f481af00cb607dfafcfee46aeb8e638db"
kind = "model/matting"
size = 444473596
media_type = "application/octet-stream"
urls = [
    "https://huggingface.co/Comfy-Org/BiRefNet/resolve/35767b272f2846752a3aee1259abdd4586f735c8/background_removal/birefnet.safetensors",
]

[pack.entry]
nodes = "dinkster_vision_birefnet:BIREFNET_PROVIDER_NODES"
types = "dinkster_vision_birefnet:register_types"
