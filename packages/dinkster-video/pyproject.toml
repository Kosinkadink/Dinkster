[project]
name = "dinkster-video"
version = "0.0.1"
description = "Bounded VIDEO materialization shared by native and compatibility nodes"
requires-python = ">=3.12"
dependencies = [
    "av==16.0.1",
    "numpy>=1.26",
    "dinkster-values",
    "pillow>=10",
    "opentimelineio==0.18.1",
    "dinkster-image-document",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_video"]

[tool.uv.sources]
dinkster-values = { workspace = true }
dinkster-image-document = { workspace = true }
