[project]
name = "dinkster-video"
version = "0.0.1"
description = "Bounded VIDEO materialization shared by native and compatibility nodes"
requires-python = ">=3.12"
dependencies = [
    "av==18.1.0",
    "numpy>=1.26",
    "dinkster-values",
    "pillow>=10",
    "opentimelineio==0.19.0.dev1 ; python_version == '3.14' and implementation_name == 'cpython' and ((sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
    "opentimelineio==0.18.1 ; python_version != '3.14' or implementation_name != 'cpython' or (sys_platform == 'linux' and platform_machine != 'x86_64') or (sys_platform == 'win32' and platform_machine != 'AMD64') or (sys_platform != 'linux' and sys_platform != 'win32')",
    "dinkster-image-document",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_video", "preview/src/dinkster_video_preview"]

[tool.hatch.build.targets.wheel.force-include]
"preview" = "dinkster_video/preview"

[tool.uv.sources]
dinkster-values = { workspace = true }
dinkster-image-document = { workspace = true }
opentimelineio = [
    { url = "https://github.com/Kosinkadink/Dinkster/releases/download/opentimelineio-wheels-0.19.0.dev1-4524367491df/opentimelineio-0.19.0.dev1-cp314-cp314-manylinux2014_x86_64.manylinux_2_17_x86_64.whl", marker = "python_version == '3.14' and implementation_name == 'cpython' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/Kosinkadink/Dinkster/releases/download/opentimelineio-wheels-0.19.0.dev1-4524367491df/opentimelineio-0.19.0.dev1-cp314-cp314-win_amd64.whl", marker = "python_version == '3.14' and implementation_name == 'cpython' and sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
