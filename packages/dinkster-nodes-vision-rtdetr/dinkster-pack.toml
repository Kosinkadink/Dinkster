[pack]
name = "dinkster-vision-rtdetr"
version = "0.0.7"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.vision.rtdetr"]
requires = ["torch", "dinkster-inference", "torchvision", "pillow>=10"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_vision_rtdetr:NODES"
types = "dinkster_vision_rtdetr:register_types"
