[project]
name = "dinkster-nodes-vision-rtdetr"
version = "0.0.2"
description = "ComfyUI-origin vision-rtdetr nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_vision_rtdetr"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_rtdetr_pack/dinkster-pack.toml"
"src/dinkster_nodes_vision_rtdetr" = "dinkster_vision_rtdetr_pack/dinkster_nodes_vision_rtdetr"
"locales" = "dinkster_vision_rtdetr_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
