[project]
name = "dinkster-vision-rtdetr"
version = "0.0.4"
description = "ComfyUI-origin vision-rtdetr nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference==0.1.1",
    "torchvision",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_rtdetr"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_rtdetr/dinkster-pack.toml"
"locales" = "dinkster_vision_rtdetr/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
