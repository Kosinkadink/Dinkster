[project]
name = "dinkster-registry"
version = "0.0.2"
description = "Dinkster registry client, artifact, lockfile, and install models"
requires-python = ">=3.12"
dependencies = ["blake3>=0.4", "dinkster-schema", "dinkster-workers", "packaging>=25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_registry"]

[tool.uv.sources]
dinkster-schema = { workspace = true }
dinkster-workers = { workspace = true }
