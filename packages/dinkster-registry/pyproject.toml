[project]
name = "dinkster-registry"
version = "0.0.1"
description = "Dinkster registry model: identities, grants, releases, admission (pure, no server)"
requires-python = ">=3.12"
dependencies = ["dinkster-schema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_registry"]

[tool.uv.sources]
dinkster-schema = { workspace = true }
