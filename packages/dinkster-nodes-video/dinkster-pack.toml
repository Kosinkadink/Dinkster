[pack]
name = "dinkster-video"
version = "0.0.3"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.video"]
type-namespaces = ["INTERP_MODEL", "OPTICAL_FLOW"]
requires = ["av>=14", "numpy>=1.26", "torch", "torchvision", "dinkster-inference==0.1.1"]

[pack.inference]
imports = ["ldm.common_dit", "model_management", "model_patcher", "ops", "storage", "utils"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_video:NODES"
types = "dinkster_video:register_types"
