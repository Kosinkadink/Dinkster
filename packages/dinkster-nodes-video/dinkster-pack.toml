[pack]
name = "dinkster-video"
version = "0.0.5"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.video"]
type-namespaces = ["INTERP_MODEL", "OPTICAL_FLOW"]
requires = ["av>=14", "numpy>=1.26", "torch", "torchvision", "dinkster-inference"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_video:NODES"
types = "dinkster_video:register_types"
