[project]
name = "dinkster-vision-depth-anything-v2"
version = "0.0.1"
description = "Dinkster Depth Anything V2 model-backed vision provider"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_depth_anything_v2"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_depth_anything_v2_pack/dinkster-pack.toml"
"comfy-aliases.inactive.json" = "dinkster_vision_depth_anything_v2_pack/comfy-aliases.inactive.json"
"src/dinkster_vision_depth_anything_v2" = "dinkster_vision_depth_anything_v2_pack/dinkster_vision_depth_anything_v2"

[tool.uv.sources]
dinkster-api = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv-torch"
include = ["src", "tests"]
typeCheckingMode = "standard"
