[pack]
name = "dinkster-cosmos"
version = "0.0.5"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.cosmos"]
requires = ["torch", "dinkster-inference==0.1.1", "dinkster-pack-helpers>=0.0.2,<1"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_cosmos:NODES"
types = "dinkster_cosmos:register_types"
