[project]
name = "dinkster-nodes-cosmos"
version = "0.0.2"
description = "Dinkster cosmos model nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-nodes-video"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_cosmos"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_cosmos_pack/dinkster-pack.toml"
"src/dinkster_nodes_cosmos" = "dinkster_cosmos_pack/dinkster_nodes_cosmos"
"locales" = "dinkster_cosmos_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-nodes-video = { workspace = true }
