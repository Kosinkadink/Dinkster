[project]
name = "dinkster-vision-sam3"
version = "0.0.3"
description = "ComfyUI-origin vision-sam3 nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference==0.1.1",
    "av>=14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_sam3"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_sam3/dinkster-pack.toml"
"locales" = "dinkster_vision_sam3/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
