[project]
name = "dinkster-nodes-vision-sam3"
version = "0.0.2"
description = "ComfyUI-origin vision-sam3 nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "av>=14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_vision_sam3"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_sam3_pack/dinkster-pack.toml"
"src/dinkster_nodes_vision_sam3" = "dinkster_vision_sam3_pack/dinkster_nodes_vision_sam3"
"locales" = "dinkster_vision_sam3_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
