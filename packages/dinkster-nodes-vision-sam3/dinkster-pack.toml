[pack]
name = "dinkster-vision-sam3"
version = "0.0.4"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.vision.sam3"]
type-namespaces = ["SAM3_TRACK_DATA"]
requires = ["torch", "dinkster-inference", "av>=14"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_vision_sam3:NODES"
types = "dinkster_vision_sam3:register_types"
