[pack]
name = "dinkster-hidream"
version = "0.0.3"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.hidream"]
requires = ["dinkster-inference==0.1.1", "torch", "dinkster-pack-helpers>=0.0.1,<1"]

[pack.inference]
imports = ["model_management", "patcher_extension"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_hidream:NODES"
types = "dinkster_hidream:register_types"
