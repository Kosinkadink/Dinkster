[pack]
name = "dinkster-hidream"
version = "0.0.6"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.hidream"]
requires = ["dinkster-inference", "torch", "dinkster-pack-helpers>=0.0.2,<1"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_hidream:NODES"
types = "dinkster_hidream:register_types"
