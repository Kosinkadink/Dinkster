[project]
name = "dinkster-nodes-vision-depth-anything-3"
version = "0.0.2"
description = "ComfyUI-origin vision-depth-anything-3 nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_vision_depth_anything_3"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_depth_anything_3_pack/dinkster-pack.toml"
"src/dinkster_nodes_vision_depth_anything_3" = "dinkster_vision_depth_anything_3_pack/dinkster_nodes_vision_depth_anything_3"
"locales" = "dinkster_vision_depth_anything_3_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
