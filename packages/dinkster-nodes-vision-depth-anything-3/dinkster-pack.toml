[pack]
name = "dinkster-vision-depth-anything-3"
version = "0.0.3"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.vision.depth.anything.3"]
type-namespaces = ["DA3_MODEL", "DA3_GEOMETRY"]
requires = ["torch", "dinkster-inference==0.1.1"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_vision_depth_anything_3:NODES"
types = "dinkster_vision_depth_anything_3:register_types"
