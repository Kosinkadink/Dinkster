[project]
name = "dinkster-vision-marigold"
version = "0.0.3"
description = "ComfyUI-origin vision-marigold nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference==0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_marigold"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_marigold/dinkster-pack.toml"
"locales" = "dinkster_vision_marigold/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
