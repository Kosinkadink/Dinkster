[project]
name = "dinkster-native"
version = "0.0.1"
description = "Dinkster native execution provider"
requires-python = ">=3.12"
dependencies = [
    "dinkster-assets",
    "dinkster-image-document",
    "dinkster-graph",
    "dinkster-inference",
    "dinkster-inference-torch",
    "dinkster-memory",
    "dinkster-model-triposplat",
    "dinkster-nodes-generation",
    "dinkster-nodes-media-io",
    "dinkster-protocol",
    "dinkster-schema",
    "dinkster-values",
    "dinkster-video",
    "dinkster-workers",
    "numba>=0.67",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_native"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_native_pack/dinkster-pack.toml"
"src/dinkster_native" = "dinkster_native_pack/dinkster_native"

[tool.uv.sources]
dinkster-assets = { workspace = true }
dinkster-graph = { workspace = true }
dinkster-image-document = { workspace = true }
dinkster-inference = { workspace = true }
dinkster-inference-torch = { workspace = true }
dinkster-memory = { workspace = true }
dinkster-model-triposplat = { workspace = true }
dinkster-nodes-generation = { workspace = true }
dinkster-nodes-media-io = { workspace = true }
dinkster-protocol = { workspace = true }
dinkster-schema = { workspace = true }
dinkster-values = { workspace = true }
dinkster-video = { workspace = true }
dinkster-workers = { workspace = true }
