[project]
name = "dinkster-native"
version = "0.0.3"
description = "Dinkster native execution provider"
requires-python = ">=3.12"
dependencies = [
    "dinkster-assets",
    "dinkster-image-document",
    "dinkster-graph",
    "dinkster-inference==0.1.1",
    "dinkster-inference-wire",
    "dinkster-memory",
    "dinkster-protocol",
    "dinkster-schema",
    "dinkster-values",
    "dinkster-video-runtime",
    "dinkster-workers",
    "numba>=0.67",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_native"]

[tool.uv.sources]
dinkster-assets = { workspace = true }
dinkster-graph = { workspace = true }
dinkster-image-document = { workspace = true }
dinkster-inference-wire = { workspace = true }
dinkster-memory = { workspace = true }
dinkster-protocol = { workspace = true }
dinkster-schema = { workspace = true }
dinkster-values = { workspace = true }
dinkster-video-runtime = { workspace = true }
dinkster-workers = { workspace = true }
