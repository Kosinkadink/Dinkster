[pack]
name = "dinkster-native"
namespaces = ["dinkster"]
executes = [
    "dinkster.load_checkpoint",
    "dinkster.load_diffusion_model",
    "dinkster.clip_text_encode",
    "dinkster.empty_latent_image",
    "dinkster.ksampler",
    "dinkster.vae_decode",
    "dinkster.image_crop_to_mask",
    "dinkster.preview_mask",
    "dinkster.voxel_to_mesh",
    "dinkster.get_mesh_info",
    "dinkster.remesh_mesh",
    "dinkster.decimate_mesh",
    "dinkster.smooth_mesh_normals",
    "dinkster.unwrap_mesh",
    "dinkster.paint_mesh",
    "dinkster.bake_texture_from_voxel",
    "dinkster.bake_normal_map_from_mesh",
    "dinkster.bake_ambient_occlusion",
    "dinkster.render_uv_atlas",
    "dinkster.apply_texture_to_mesh",
    "dinkster.mesh_to_model3d",
]
requires = [
    "dinkster-comfy @ git+https://github.com/Kosinkadink/dinkster-comfy.git@831cf8c8a1b05df0178596e10fa88fb9f2d458b5",
]

[pack.sandbox]
gpu = true
writable-mounts = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-nodes-generation = ">=0.0.1,<1"

[pack.requirements.capabilities]
"dinkster.generation.schemas" = ">=1.0.0,<2"

[pack.arms]
native = [
    "dinkster.load_checkpoint",
    "dinkster.load_diffusion_model",
    "dinkster.clip_text_encode",
    "dinkster.empty_latent_image",
    "dinkster.ksampler",
    "dinkster.vae_decode",
    "dinkster.image_crop_to_mask",
    "dinkster.preview_mask",
    "dinkster.voxel_to_mesh",
    "dinkster.get_mesh_info",
    "dinkster.remesh_mesh",
    "dinkster.decimate_mesh",
    "dinkster.smooth_mesh_normals",
    "dinkster.unwrap_mesh",
    "dinkster.paint_mesh",
    "dinkster.bake_texture_from_voxel",
    "dinkster.bake_normal_map_from_mesh",
    "dinkster.bake_ambient_occlusion",
    "dinkster.render_uv_atlas",
    "dinkster.apply_texture_to_mesh",
    "dinkster.mesh_to_model3d",
]

[pack.entry]
nodes = "dinkster_native.entry:NATIVE_NODES"
arm_nodes = "dinkster_native.entry:ARM_NODES"
types = "dinkster_native.entry:register_types"
reservations = "dinkster_native.memory:plan_reservations"
consumers = "dinkster_native.pool:memory_consumers"
telemetry = "dinkster_native.devices:vram_telemetry_snapshot"
