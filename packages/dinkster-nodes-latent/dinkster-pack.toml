[pack]
name = "dinkster-latent"
version = "0.0.3"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.latent"]
requires = ["torch", "safetensors", "dinkster-inference==0.1.1"]

[pack.inference]
imports = ["audio", "cli_args", "model_management", "utils"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_latent:NODES"
types = "dinkster_latent.types:register_types"
