[project]
name = "dinkster-latent"
version = "0.0.5"
description = "First-party Dinkster latent nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "safetensors",
    "dinkster-inference",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_latent"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_latent/dinkster-pack.toml"
"locales" = "dinkster_latent/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
