[project]
name = "dinkster-nodes-latent"
version = "0.0.2"
description = "First-party Dinkster latent nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_latent"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_latent_pack/dinkster-pack.toml"
"src/dinkster_nodes_latent" = "dinkster_latent_pack/dinkster_nodes_latent"
"locales" = "dinkster_latent_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
