[pack]
name = "dinkster-misc-models"
version = "0.0.7"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.misc.models"]
requires = ["dinkster-inference", "torch", "dinkster-pack-helpers>=0.0.2,<1"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-qwen = ">=0.0.1,<1"

[pack.entry]
nodes = "dinkster_misc_models:NODES"
types = "dinkster_misc_models:register_types"
