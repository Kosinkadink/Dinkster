[project]
name = "dinkster-misc-models"
version = "0.0.1"
description = "Dinkster misc-models nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-inference==0.1.1",
    "torch",
    "dinkster-conditioning>=0.0.1,<1",
    "dinkster-qwen>=0.0.1,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_misc_models"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_misc_models/dinkster-pack.toml"
"locales" = "dinkster_misc_models/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-conditioning = { workspace = true }
dinkster-qwen = { workspace = true }
