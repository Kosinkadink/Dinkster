[project]
name = "dinkster-nodes-generation"
version = "0.0.1"
description = "Dinkster first-party generation node schema pack"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_generation"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_nodes_generation_pack/dinkster-pack.toml"
"comfy-aliases.json" = "dinkster_nodes_generation_pack/comfy-aliases.json"
"comfy-groups.json" = "dinkster_nodes_generation_pack/comfy-groups.json"
"src/dinkster_nodes_generation" = "dinkster_nodes_generation_pack/dinkster_nodes_generation"

[tool.uv.sources]
dinkster-api = { workspace = true }
