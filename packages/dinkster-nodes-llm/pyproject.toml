[project]
name = "dinkster-llm"
version = "0.0.2"
description = "Dinkster llm nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_llm"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_llm/dinkster-pack.toml"
"locales" = "dinkster_llm/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
