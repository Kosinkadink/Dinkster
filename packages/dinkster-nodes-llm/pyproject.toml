[project]
name = "dinkster-nodes-llm"
version = "0.0.2"
description = "Dinkster llm nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_llm"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_llm_pack/dinkster-pack.toml"
"src/dinkster_nodes_llm" = "dinkster_llm_pack/dinkster_nodes_llm"
"locales" = "dinkster_llm_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
