[pack]
name = "dinkster-llm"
version = "0.0.4"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.llm"]
requires = ["torch"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_llm:NODES"
types = "dinkster_llm:register_types"
