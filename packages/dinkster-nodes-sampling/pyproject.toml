[project]
name = "dinkster-sampling"
version = "0.0.5"
description = "First-party Dinkster sampling nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "numpy",
    "tqdm",
    "dinkster-inference",
    "dinkster-pack-helpers>=0.0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_sampling"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_sampling/dinkster-pack.toml"
"locales" = "dinkster_sampling/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-pack-helpers = { workspace = true }
