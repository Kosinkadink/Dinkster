[project]
name = "dinkster-sampling"
version = "0.0.2"
description = "First-party Dinkster sampling nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "numpy",
    "tqdm",
    "dinkster-inference==0.1.1",
    "dinkster-latent>=0.0.1,<1",
    "dinkster-conditioning>=0.0.1,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_sampling"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_sampling/dinkster-pack.toml"
"locales" = "dinkster_sampling/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-latent = { workspace = true }
dinkster-conditioning = { workspace = true }
