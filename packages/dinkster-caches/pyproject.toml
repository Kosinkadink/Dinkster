[project]
name = "dinkster-caches"
version = "0.0.1"
description = "Dinkster CacheStore implementations"
requires-python = ">=3.12"
dependencies = ["dinkster-values", "dinkster-protocol", "dinkster-memory", "dinkster-assets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_caches"]

[tool.uv.sources]
dinkster-values = { workspace = true }
dinkster-protocol = { workspace = true }
dinkster-memory = { workspace = true }
