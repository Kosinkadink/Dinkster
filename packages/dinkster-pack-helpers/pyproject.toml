[project]
name = "dinkster-pack-helpers"
version = "0.0.4"
description = "Shared conditioning, model asset and latent helpers for node packs"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api>=0.0.2.dev0,<0.1",
    "dinkster-inference",
    "numpy>=1.26",
    "pillow>=10",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_pack_helpers"]

[tool.dinkster]
official-library = true
engine = ">=0.0.2.dev0,<0.1"

[tool.uv.sources]
dinkster-api = { workspace = true }
