[pack]
name = "dinkster-audio-models"
version = "0.0.8"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.audio.models"]
requires = ["dinkster-inference", "torch", "dinkster-pack-helpers>=0.0.2,<1"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_audio_models:NODES"
types = "dinkster_audio_models:register_types"
