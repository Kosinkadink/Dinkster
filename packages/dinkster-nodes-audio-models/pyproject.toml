[project]
name = "dinkster-audio-models"
version = "0.0.6"
description = "Dinkster audio-models nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-inference",
    "torch",
    "dinkster-pack-helpers>=0.0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_audio_models"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_audio_models/dinkster-pack.toml"
"locales" = "dinkster_audio_models/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-pack-helpers = { workspace = true }
