[project]
name = "dinkster-nodes-audio-models"
version = "0.0.2"
description = "Dinkster audio-models nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-inference==0.1.1", "torch", "dinkster-nodes-conditioning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_audio_models"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_audio_models_pack/dinkster-pack.toml"
"src/dinkster_nodes_audio_models" = "dinkster_audio_models_pack/dinkster_nodes_audio_models"
"locales" = "dinkster_audio_models_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-nodes-conditioning = { workspace = true }
