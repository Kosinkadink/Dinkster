[project]
name = "dinkster-nodes-flux"
version = "0.0.2"
description = "Dinkster flux nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-inference==0.1.1", "torch", "dinkster-nodes-conditioning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_flux"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_flux_pack/dinkster-pack.toml"
"src/dinkster_nodes_flux" = "dinkster_flux_pack/dinkster_nodes_flux"
"locales" = "dinkster_flux_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-nodes-conditioning = { workspace = true }
