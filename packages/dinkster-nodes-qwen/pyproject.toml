[project]
name = "dinkster-qwen"
version = "0.0.2"
description = "Dinkster qwen nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-inference==0.1.1",
    "torch",
    "dinkster-conditioning>=0.0.1,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_qwen"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_qwen/dinkster-pack.toml"
"locales" = "dinkster_qwen/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-conditioning = { workspace = true }
