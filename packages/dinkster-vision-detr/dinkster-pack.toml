[pack]
name = "dinkster-vision-detr"
namespaces = []
executes = ["dinkster.detection.detect"]
requires = [
    "numpy==2.5.1",
    "torch==2.13.0",
]

[pack.sandbox]
gpu = false
network = false
writable-mounts = false

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-nodes-image = ">=0.0.1,<1"

[[pack.vision-providers]]
choice = "dinkster.detection.detect.providers"
node = "dinkster.detection.detect"
model = "detr-resnet-50"
devices = ["cpu"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["detr-r50"]

[[pack.assets]]
id = "detr-r50"
name = "DETR ResNet-50 COCO object detector"
digest = "blake3:2bb221c9ab83ea68d6a66bdc4cfe7bce4c49a1784287f5923521d34d23d150a2"
kind = "model/detector"
size = 166618694
media_type = "application/octet-stream"
urls = [
    "https://dl.fbaipublicfiles.com/detr/detr-r50-e632da11.pth",
]

[pack.entry]
nodes = "dinkster_vision_detr:DETR_PROVIDER_NODES"
types = "dinkster_vision_detr:register_types"
