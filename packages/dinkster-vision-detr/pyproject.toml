[project]
name = "dinkster-vision-detr"
version = "0.0.1"
description = "Dinkster DETR model-backed object detection provider"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_detr"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_detr_pack/dinkster-pack.toml"
"src/dinkster_vision_detr" = "dinkster_vision_detr_pack/dinkster_vision_detr"

[tool.uv.sources]
dinkster-api = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv-torch"
include = ["src", "tests"]
typeCheckingMode = "standard"
