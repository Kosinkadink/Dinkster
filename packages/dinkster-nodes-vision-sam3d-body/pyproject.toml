[project]
name = "dinkster-vision-sam3d-body"
version = "0.0.3"
description = "ComfyUI-origin vision-sam3d-body nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference==0.1.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10",
    "dinkster-vision-sam3>=0.0.1,<1",
    "dinkster-pack-helpers>=0.0.1,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_sam3d_body"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_sam3d_body/dinkster-pack.toml"
"locales" = "dinkster_vision_sam3d_body/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-vision-sam3 = { workspace = true }
dinkster-pack-helpers = { workspace = true }
