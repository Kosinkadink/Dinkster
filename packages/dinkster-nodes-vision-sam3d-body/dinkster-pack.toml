[pack]
name = "dinkster-vision-sam3d-body"
version = "0.0.5"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.vision.sam3d.body"]
type-namespaces = ["SAM3D_BODY_MODEL", "MHR_POSE_DATA"]
requires = ["torch", "dinkster-inference==0.1.1", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "dinkster-pack-helpers>=0.0.2,<1"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-vision-sam3 = ">=0.0.1,<1"

[pack.entry]
nodes = "dinkster_vision_sam3d_body:NODES"
types = "dinkster_vision_sam3d_body:register_types"
