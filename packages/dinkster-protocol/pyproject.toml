[project]
name = "dinkster-protocol"
version = "0.0.1"
description = "Dinkster execution-boundary contracts: Worker/CacheStore protocols + Invocation data (hazard H3)"
requires-python = ">=3.12"
dependencies = ["dinkster-schema", "dinkster-values"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_protocol"]

[tool.uv.sources]
dinkster-schema = { workspace = true }
dinkster-values = { workspace = true }
