[project]
name = "dinkster-nodes-hunyuan"
version = "0.0.2"
description = "Dinkster hunyuan model nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-nodes-conditioning", "dinkster-nodes-latent", "dinkster-nodes-video"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_hunyuan"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_hunyuan_pack/dinkster-pack.toml"
"src/dinkster_nodes_hunyuan" = "dinkster_hunyuan_pack/dinkster_nodes_hunyuan"
"locales" = "dinkster_hunyuan_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-nodes-conditioning = { workspace = true }
dinkster-nodes-latent = { workspace = true }
dinkster-nodes-video = { workspace = true }
