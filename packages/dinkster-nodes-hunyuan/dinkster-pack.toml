[pack]
name = "dinkster-hunyuan"
version = "0.0.1"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.hunyuan"]
requires = ["torch", "dinkster-inference==0.1.1"]

[pack.inference]
imports = ["ldm.modules.diffusionmodules.mmdit", "model_management", "utils"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
"dinkster-conditioning" = ">=0.0.1"
"dinkster-latent" = ">=0.0.1"
"dinkster-video" = ">=0.0.1"

[pack.entry]
nodes = "dinkster_nodes_hunyuan:NODES"
