[project]
name = "dinkster-nodes-media-io"
version = "0.0.1"
description = "Dinkster first-party asset-backed media I/O node pack"
requires-python = ">=3.12"
dependencies = [
    "av==16.0.1",
    "dinkster-api",
    "dinkster-image-document",
    "dinkster-video",
    "numpy>=1.26",
    "pillow>=10",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_media_io"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_nodes_media_io_pack/dinkster-pack.toml"
"comfy-aliases.json" = "dinkster_nodes_media_io_pack/comfy-aliases.json"
"src/dinkster_nodes_media_io" = "dinkster_nodes_media_io_pack/src/dinkster_nodes_media_io"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-image-document = { workspace = true }
dinkster-video = { workspace = true }
