[project]
name = "dinkster-nodes-3d-models"
version = "0.0.2"
description = "ComfyUI-origin 3d-models nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_3d_models"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_3d_models_pack/dinkster-pack.toml"
"src/dinkster_nodes_3d_models" = "dinkster_3d_models_pack/dinkster_nodes_3d_models"
"locales" = "dinkster_3d_models_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
