[project]
name = "dinkster-3d-models"
version = "0.0.3"
description = "ComfyUI-origin 3d-models nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_3d_models"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_3d_models/dinkster-pack.toml"
"locales" = "dinkster_3d_models/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
