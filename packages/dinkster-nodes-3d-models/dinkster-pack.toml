[pack]
name = "dinkster-3d-models"
version = "0.0.2"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.3d.models"]
requires = ["torch", "dinkster-inference==0.1.1", "pillow>=10"]

[pack.inference]
imports = ["latent_formats", "ldm.trellis2.model", "ldm.trellis2.vae", "ldm.triposplat.preview", "model_management", "patcher_extension", "utils"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_3d_models:NODES"
types = "dinkster_3d_models:register_types"
