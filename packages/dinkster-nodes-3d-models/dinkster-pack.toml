[pack]
name = "dinkster-3d-models"
version = "0.0.3"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.3d.models"]
requires = ["torch", "dinkster-inference", "pillow>=10"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_3d_models:NODES"
types = "dinkster_3d_models:register_types"
