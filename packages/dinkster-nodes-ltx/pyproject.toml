[project]
name = "dinkster-ltx"
version = "0.0.3"
description = "Dinkster ltx model nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference==0.1.1",
    "dinkster-latent>=0.0.1",
    "dinkster-llm>=0.0.1",
    "dinkster-models>=0.0.1",
    "dinkster-pack-helpers>=0.0.1,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_ltx"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_ltx/dinkster-pack.toml"
"locales" = "dinkster_ltx/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-latent = { workspace = true }
dinkster-llm = { workspace = true }
dinkster-models = { workspace = true }
dinkster-pack-helpers = { workspace = true }
