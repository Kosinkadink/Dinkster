[project]
name = "dinkster-nodes-ltx"
version = "0.0.2"
description = "Dinkster ltx model nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-nodes-audio", "dinkster-nodes-conditioning", "dinkster-nodes-llm", "dinkster-nodes-models", "dinkster-nodes-sampling", "dinkster-nodes-video", "dinkster-inference-wire"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_ltx"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_ltx_pack/dinkster-pack.toml"
"src/dinkster_nodes_ltx" = "dinkster_ltx_pack/dinkster_nodes_ltx"
"locales" = "dinkster_ltx_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-nodes-audio = { workspace = true }
dinkster-nodes-conditioning = { workspace = true }
dinkster-nodes-llm = { workspace = true }
dinkster-nodes-models = { workspace = true }
dinkster-nodes-sampling = { workspace = true }
dinkster-nodes-video = { workspace = true }
dinkster-inference-wire = { workspace = true }
