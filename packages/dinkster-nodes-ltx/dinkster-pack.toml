[pack]
name = "dinkster-ltx"
version = "0.0.8"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.ltx"]
requires = ["torch", "dinkster-inference", "dinkster-pack-helpers>=0.0.2,<1"]
type-namespaces = ["IC_LORA_PARAMETERS"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
"dinkster-latent" = ">=0.0.1"
"dinkster-llm" = ">=0.0.1"
"dinkster-models" = ">=0.0.1"

[pack.entry]
nodes = "dinkster_ltx:NODES"
types = "dinkster_ltx:register_types"
