[project]
name = "dinkster-nodes-image"
version = "0.0.2"
description = "Dinkster first-party image and mask operation nodes"
requires-python = ">=3.12"
dependencies = [
    "comfy-angle==0.1.1; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "dinkster-api",
    "numpy>=1.26",
    "opencv-contrib-python-headless>=5.0,<5.1",
    "pillow>=10",
    "PyOpenGL>=3.1.8,<4",
    "av==18.1.0",
    "torch",
    "torchvision",
    "scipy",
    "kornia",
    "dinkster-inference==0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_image"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_image_pack/dinkster-pack.toml"
"src/dinkster_nodes_image" = "dinkster_image_pack/dinkster_nodes_image"
"locales" = "dinkster_image_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
