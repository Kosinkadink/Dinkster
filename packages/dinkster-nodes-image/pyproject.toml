[project]
name = "dinkster-nodes-image"
version = "0.0.1"
description = "Dinkster first-party image and mask operation nodes"
requires-python = ">=3.12"
dependencies = [
    "comfy-angle==0.1.1; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "dinkster-api",
    "dinkster-image-document",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "PyOpenGL>=3.1.8,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_image"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_nodes_image_pack/dinkster-pack.toml"
"comfy-aliases.json" = "dinkster_nodes_image_pack/comfy-aliases.json"
"comfy-groups.json" = "dinkster_nodes_image_pack/comfy-groups.json"
"src/dinkster_nodes_image" = "dinkster_nodes_image_pack/src/dinkster_nodes_image"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-image-document = { workspace = true }
