[project]
name = "dinkster-nodes-dev"
version = "0.0.1"
description = "Dinkster dev node pack: test/demo scaffolding, never a user surface"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_dev"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_nodes_dev_pack/dinkster-pack.toml"
"src/dinkster_nodes_dev" = "dinkster_nodes_dev_pack/src/dinkster_nodes_dev"

[tool.uv.sources]
dinkster-api = { workspace = true }
