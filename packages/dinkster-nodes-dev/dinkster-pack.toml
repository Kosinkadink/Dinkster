# Pack manifest (DESIGN 3.6): what this pack is, declared as data.
#
# Development scaffolding, deliberately separate from the first-party default
# packs. Compose this ordinary pack explicitly when its examples and probes
# are needed.

[pack]
name = "dinkster-nodes-dev"
version = "0.0.3"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dev"]
type-namespaces = ["dev"]
requires = ["numpy>=1.26"]

[pack.sandbox]
writable-mounts = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_nodes_dev:PACK_NODES"
types = "dinkster_nodes_dev:register_dev_types"
choices = "dinkster_nodes_dev:combo_choices"

# The widget/socket gallery's starter document.
[[pack.templates]]
id = "dev-gallery"
name = "Widget & Socket Gallery"
description = "Every native wire construct on one canvas: widgets, socket variants, lists, match templates - connected and unconnected."
tags = ["dev", "gallery"]
file = "src/dinkster_nodes_dev/gallery_template.json"

[pack.docs]
dir = "docs"
default_locale = "en"

[pack.settings]
schema = "settings.schema.json"

[[pack.blueprints]]
id = "node-features"
name = "Node Feature Examples"
description = "Small CPU-only examples of optional node controls and image estimates."
tags = ["dev", "features"]
file = "src/dinkster_nodes_dev/features_blueprint.json"

[[pack.templates]]
id = "node-features"
name = "Node Feature Examples"
description = "Try dynamic controls, output profiles, widget forms and image estimates."
tags = ["dev", "features"]
file = "src/dinkster_nodes_dev/features_template.json"
