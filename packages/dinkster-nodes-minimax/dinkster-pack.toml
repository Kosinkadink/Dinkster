[pack]
name = "dinkster-minimax"
version = "0.0.7"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.minimax"]
requires = ["torch", "dinkster-inference", "dinkster-pack-helpers>=0.0.2,<1"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_minimax:NODES"
types = "dinkster_minimax:register_types"
