[project]
name = "dinkster-nodes-vision-background-removal"
version = "0.0.2"
description = "ComfyUI-origin vision-background-removal nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_vision_background_removal"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_background_removal_pack/dinkster-pack.toml"
"src/dinkster_nodes_vision_background_removal" = "dinkster_vision_background_removal_pack/dinkster_nodes_vision_background_removal"
"locales" = "dinkster_vision_background_removal_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
