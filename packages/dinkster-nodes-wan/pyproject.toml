[project]
name = "dinkster-wan"
version = "0.0.6"
description = "Dinkster wan model nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference",
    "numpy",
    "scipy",
    "einops",
    "dinkster-models>=0.0.1",
    "dinkster-vision-sam3>=0.0.1",
    "dinkster-pack-helpers>=0.0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_wan"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_wan/dinkster-pack.toml"
"locales" = "dinkster_wan/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-models = { workspace = true }
dinkster-vision-sam3 = { workspace = true }
dinkster-pack-helpers = { workspace = true }
