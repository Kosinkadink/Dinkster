[project]
name = "dinkster-nodes-wan"
version = "0.0.2"
description = "Dinkster wan model nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-nodes-conditioning", "dinkster-nodes-sampling", "dinkster-inference-wire"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_wan"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_wan_pack/dinkster-pack.toml"
"src/dinkster_nodes_wan" = "dinkster_wan_pack/dinkster_nodes_wan"
"locales" = "dinkster_wan_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-nodes-conditioning = { workspace = true }
dinkster-nodes-sampling = { workspace = true }
dinkster-inference-wire = { workspace = true }
