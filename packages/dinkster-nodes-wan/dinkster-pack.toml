[pack]
name = "dinkster-wan"
version = "0.0.5"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.wan"]
requires = ["torch", "dinkster-inference", "numpy", "scipy", "einops", "dinkster-pack-helpers>=0.0.2,<1"]
type-namespaces = ["WAN_CAMERA_EMBEDDING", "TRACKS"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
"dinkster-models" = ">=0.0.1"
"dinkster-vision-sam3" = ">=0.0.1"

[pack.entry]
nodes = "dinkster_wan:NODES"
types = "dinkster_wan:register_types"
