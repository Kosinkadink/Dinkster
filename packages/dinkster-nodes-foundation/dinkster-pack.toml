# Pack manifest (DESIGN 3.6): what this pack is, declared as data.
# Loading the manifest never imports pack code.

[pack]
name = "dinkster-nodes-foundation"
# std and dinkster are reserved roots. This first-party pack receives explicit
# host trust but otherwise follows the same composition path as every pack.
namespaces = ["std", "dinkster"]

[pack.docs]
dir = "docs"
default_locale = "en"

[pack.sandbox]

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_nodes_foundation:FOUNDATION_NODES"
types = "dinkster_nodes_foundation:register_foundation_types"

[[pack.templates]]
id = "loop-map-images"
name = "Loop: Map Images"
description = "Map a real image list through an image-processing subgraph."
tags = ["loop", "map", "image"]
file = "src/dinkster_nodes_foundation/loop_map_images_template.json"

[[pack.templates]]
id = "loop-gather-image-batch"
name = "Loop: Gather Image Batch"
description = "Gather per-item images in input order and merge them into a batch."
tags = ["loop", "gather", "image", "batch"]
file = "src/dinkster_nodes_foundation/loop_gather_batch_template.json"

[[pack.templates]]
id = "loop-fold-scan-images"
name = "Loop: Fold and Scan Images"
description = "Fold image strips onto a canvas and gather every running state."
tags = ["loop", "fold", "scan", "image"]
file = "src/dinkster_nodes_foundation/loop_fold_scan_template.json"

[[pack.templates]]
id = "loop-while-until"
name = "Loop: While / Until"
description = "Repeat a state transition until its continuation becomes false."
tags = ["loop", "while", "until", "state"]
file = "src/dinkster_nodes_foundation/loop_while_until_template.json"

[[pack.templates]]
id = "loop-per-item-image-spawn"
name = "Loop: Per-item Image Spawn"
description = "Spawn independent image work for every item in a list."
tags = ["loop", "map", "spawn", "image"]
file = "src/dinkster_nodes_foundation/loop_per_item_spawn_template.json"
