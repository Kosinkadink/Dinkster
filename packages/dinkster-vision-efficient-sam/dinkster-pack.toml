[pack]
name = "dinkster-vision-efficient-sam"
namespaces = []
executes = ["dinkster.detection.segment"]
requires = [
    "numpy==2.5.1",
    "onnxruntime==1.29.0",
]

[pack.sandbox]
gpu = false
network = false
writable-mounts = false

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-nodes-image = ">=0.0.1,<1"

[[pack.vision-providers]]
choice = "dinkster.detection.segment.providers"
node = "dinkster.detection.segment"
model = "efficient-sam-ti"
devices = ["cpu"]
dtypes = ["float32"]
batching = "per-image"
artifacts = ["efficient-sam-vitt-encoder", "efficient-sam-vitt-decoder"]

[[pack.assets]]
id = "efficient-sam-vitt-encoder"
name = "EfficientSAM-Ti image encoder"
digest = "blake3:106600f3dd645019eff0d6fabe46cc1359654b03bfaec45316dabb1121cc9e6e"
kind = "model/segmenter"
size = 24799761
media_type = "application/onnx"
urls = [
    "https://raw.githubusercontent.com/yformer/EfficientSAM/d525f622e6f640acf5a0fc37c7ca1f243da5bde0/weights/efficient_sam_vitt_encoder.onnx",
]

[[pack.assets]]
id = "efficient-sam-vitt-decoder"
name = "EfficientSAM-Ti prompt decoder"
digest = "blake3:41cdd8a75918dbef651ba10a244d22084999fc6162a265b9d504faacaef14004"
kind = "model/segmenter"
size = 16565728
media_type = "application/onnx"
urls = [
    "https://raw.githubusercontent.com/yformer/EfficientSAM/d525f622e6f640acf5a0fc37c7ca1f243da5bde0/weights/efficient_sam_vitt_decoder.onnx",
]

[pack.entry]
nodes = "dinkster_vision_efficient_sam:EFFICIENT_SAM_PROVIDER_NODES"
types = "dinkster_vision_efficient_sam:register_types"
