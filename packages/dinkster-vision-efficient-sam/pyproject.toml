[project]
name = "dinkster-vision-efficient-sam"
version = "0.0.1"
description = "Dinkster EfficientSAM model-backed segmentation provider"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_efficient_sam"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_efficient_sam_pack/dinkster-pack.toml"
"src/dinkster_vision_efficient_sam" = "dinkster_vision_efficient_sam_pack/dinkster_vision_efficient_sam"

[tool.uv.sources]
dinkster-api = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv-torch"
include = ["src", "tests"]
typeCheckingMode = "standard"
