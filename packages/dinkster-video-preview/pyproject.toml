[project]
name = "dinkster-video-preview"
version = "0.0.1"
description = "VHS-style bounded video preview initialization"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_video_preview"]

[tool.uv.sources]
dinkster-api = { workspace = true }
