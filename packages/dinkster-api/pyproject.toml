[project]
name = "dinkster-api"
version = "0.0.1"
description = "The versioned extension API door: packs import dinkster_api.v1 only (DESIGN 3.6)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "alembic>=1.16,<2",
    "av==18.1.0",
    "blake3>=0.4",
    "numpy>=1.26",
    "opentimelineio==0.19.0.dev1 ; python_version == '3.14' and implementation_name == 'cpython' and ((sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
    "opentimelineio==0.18.1 ; python_version != '3.14' or implementation_name != 'cpython' or (sys_platform == 'linux' and platform_machine != 'x86_64') or (sys_platform == 'win32' and platform_machine != 'AMD64') or (sys_platform != 'linux' and sys_platform != 'win32')",
    "packaging>=24",
    "pillow>=10",
    "psd-tools>=1.14.3,<1.20",
    "psutil>=5.9",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
dinkster-doctor = "dinkster_workers.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_api"]

[tool.hatch.build.targets.wheel.force-include]
"../dinkster-values/src/dinkster_values" = "dinkster_values"
"../dinkster-schema/src/dinkster_schema" = "dinkster_schema"
"../dinkster-protocol/src/dinkster_protocol" = "dinkster_protocol"
"../dinkster-memory/src/dinkster_memory" = "dinkster_memory"
"../dinkster-assets/src/dinkster_assets" = "dinkster_assets"
"../dinkster-caches/src/dinkster_caches" = "dinkster_caches"
"../dinkster-inference-wire/src/dinkster_inference_wire" = "dinkster_inference_wire"
"../dinkster-image-document/src/dinkster_image_document" = "dinkster_image_document"
"../dinkster-video/src/dinkster_video" = "dinkster_video"
"../dinkster-video/preview/src/dinkster_video_preview" = "dinkster_video_preview"
"../dinkster-video/preview" = "dinkster_video/preview"
"../dinkster-workers/src/dinkster_workers" = "dinkster_workers"
"../dinkster-registry/src/dinkster_registry" = "dinkster_registry"
