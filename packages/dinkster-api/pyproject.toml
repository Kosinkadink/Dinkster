[project]
name = "dinkster-api"
version = "0.0.3"
description = "The versioned extension API door: packs import dinkster_api.v1 only (DESIGN 3.6)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "alembic>=1.16,<2",
    "av==18.1.0",
    "blake3>=0.4",
    "cryptography>=44",
    "dinkster-opentimelineio==0.19.0",
    "filelock>=4.2.4,<5",
    "numpy>=1.26",
    "packaging>=24",
    "pillow>=10",
    "psd-tools>=1.14.3,<1.20",
    "psutil>=5.9",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
dinkster-doctor = "dinkster_workers.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_api"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "../../hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"../dinkster-values/src/dinkster_values" = "dinkster_values"
"../dinkster-schema/src/dinkster_schema" = "dinkster_schema"
"../dinkster-protocol/src/dinkster_protocol" = "dinkster_protocol"
"../dinkster-memory/src/dinkster_memory" = "dinkster_memory"
"../dinkster-assets/src/dinkster_assets" = "dinkster_assets"
"../dinkster-caches/src/dinkster_caches" = "dinkster_caches"
"../dinkster-inference-wire/src/dinkster_inference_wire" = "dinkster_inference_wire"
"../dinkster-image-document/src/dinkster_image_document" = "dinkster_image_document"
"../dinkster-video-runtime/src/dinkster_video_runtime" = "dinkster_video_runtime"
"../dinkster-video-runtime/preview/src/dinkster_video_preview" = "dinkster_video_preview"
"../dinkster-video-runtime/preview" = "dinkster_video_runtime/preview"
"../dinkster-workers/src/dinkster_workers" = "dinkster_workers"
"../dinkster-registry/src/dinkster_registry" = "dinkster_registry"
"../dinkster-supervisor/shared/dinkster_store" = "dinkster_store"
"../dinkster-supervisor/src/dinkster_supervisor/security" = "dinkster_security"
"../dinkster-supervisor/src/dinkster_supervisor/limits.py" = "dinkster_security/limits.py"
