[project]
name = "dinkster-api"
version = "0.0.1"
description = "The versioned extension API door: packs import dinkster_api.v1 only (DESIGN 3.6)"
requires-python = ">=3.12"
dependencies = [
    "dinkster-schema",
    "dinkster-values",
    "dinkster-protocol",
    "dinkster-inference",
    "dinkster-memory",
    "dinkster-assets",
    "dinkster-video",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_api"]
