[project]
name = "dinkster-nodes-remote"
version = "0.0.1"
description = "Dinkster catalog-driven remote node client pack"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-nodes-media-io==0.0.1",
    "dinkster-workers",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_remote"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_nodes_remote_pack/dinkster-pack.toml"
"src/dinkster_nodes_remote" = "dinkster_nodes_remote_pack/src/dinkster_nodes_remote"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-nodes-media-io = { workspace = true }
dinkster-workers = { workspace = true }
