[project]
name = "dinkster-collab"
version = "0.0.1"
description = "Dinkster collaboration: server-ordered document sessions (patch relay + presence), a separate additive surface beside the job queue"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_collab"]
