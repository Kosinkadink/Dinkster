[project]
name = "dinkster-nodes-upscale"
version = "0.0.2"
description = "Dinkster single-image upscale model loading and tiled application"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_upscale"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_upscale_pack/dinkster-pack.toml"
"src/dinkster_nodes_upscale" = "dinkster_upscale_pack/dinkster_nodes_upscale"
"locales" = "dinkster_upscale_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
