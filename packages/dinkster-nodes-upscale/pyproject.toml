[project]
name = "dinkster-upscale"
version = "0.0.4"
description = "Dinkster single-image upscale model loading and tiled application"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "spandrel",
    "dinkster-inference",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_upscale"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_upscale/dinkster-pack.toml"
"locales" = "dinkster_upscale/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
