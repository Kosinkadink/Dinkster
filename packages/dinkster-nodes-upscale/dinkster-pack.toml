[pack]
name = "dinkster-upscale"
version = "0.0.2"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.upscale"]
type-namespaces = ["UPSCALE_MODEL"]
requires = ["torch", "spandrel", "dinkster-inference==0.1.1"]

[pack.inference]
imports = ["model_management", "model_patcher", "storage", "utils"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_upscale:NODES"
types = "dinkster_upscale:register_types"
