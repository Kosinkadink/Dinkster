[pack]
name = "dinkster-upscale"
version = "0.0.4"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.upscale"]
type-namespaces = ["UPSCALE_MODEL"]
requires = ["torch", "spandrel", "dinkster-inference"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_upscale:NODES"
types = "dinkster_upscale:register_types"
