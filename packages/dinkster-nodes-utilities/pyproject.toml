[project]
name = "dinkster-nodes-utilities"
version = "0.0.2"
description = "Dinkster primitive, logic, list and loop nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "simpleeval==1.0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_utilities"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_utilities_pack/dinkster-pack.toml"
"src/dinkster_nodes_utilities" = "dinkster_utilities_pack/dinkster_nodes_utilities"
"locales" = "dinkster_utilities_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
