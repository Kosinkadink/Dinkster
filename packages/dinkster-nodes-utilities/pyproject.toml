[project]
name = "dinkster-utilities"
version = "0.0.5"
description = "Dinkster primitive, logic, list and loop nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "simpleeval==1.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_utilities"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_utilities/dinkster-pack.toml"
"locales" = "dinkster_utilities/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
