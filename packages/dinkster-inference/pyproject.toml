[project]
name = "dinkster-inference"
version = "0.0.1"
description = "Torch-free inference value and wire contracts for Dinkster"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10", "dinkster-schema", "dinkster-values"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_inference"]

[tool.uv.sources]
dinkster-schema = { workspace = true }
dinkster-values = { workspace = true }
