[project]
name = "dinkster-inference"
version = "0.0.1"
description = "Dinkster native inference, torch-free half: typed contracts, checkpoint inspection and family detection, sampling math and solver catalog, tile/codec planning, KL detection, CLIP tokenization"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10", "dinkster-schema", "dinkster-protocol", "dinkster-values"]

[project.optional-dependencies]
gguf = ["gguf==0.19.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_inference"]

[tool.uv.sources]
dinkster-schema = { workspace = true }
dinkster-protocol = { workspace = true }
dinkster-values = { workspace = true }
