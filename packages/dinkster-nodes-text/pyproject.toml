[project]
name = "dinkster-text"
version = "0.0.3"
description = "Dinkster text manipulation and file output nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_text"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_text/dinkster-pack.toml"
"locales" = "dinkster_text/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
