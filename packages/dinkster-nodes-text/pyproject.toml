[project]
name = "dinkster-nodes-text"
version = "0.0.2"
description = "Dinkster text manipulation and file output nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_text"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_text_pack/dinkster-pack.toml"
"src/dinkster_nodes_text" = "dinkster_text_pack/dinkster_nodes_text"
"locales" = "dinkster_text_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
