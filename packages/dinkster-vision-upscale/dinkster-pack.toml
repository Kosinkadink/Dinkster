[pack]
name = "dinkster-vision-upscale"
namespaces = []
executes = ["dinkster.image.upscale_model"]
requires = [
    "numpy==2.5.1",
    "torch==2.13.0",
]

[pack.sandbox]
gpu = false
network = false
writable-mounts = false

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-nodes-image = ">=0.0.1,<1"

[[pack.vision-providers]]
choice = "dinkster.image.upscale_model.providers"
node = "dinkster.image.upscale_model"
devices = ["cpu"]
dtypes = ["float32"]
batching = "batch"
artifacts = []

[pack.entry]
nodes = "dinkster_vision_upscale:UPSCALE_PROVIDER_NODES"
types = "dinkster_vision_upscale:register_types"
