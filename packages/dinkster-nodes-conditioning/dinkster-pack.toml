[pack]
name = "dinkster-conditioning"
version = "0.0.3"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.conditioning"]
requires = ["torch", "safetensors", "dinkster-inference==0.1.1", "dinkster-pack-helpers>=0.0.1,<1"]

[pack.dependencies]
dinkster-latent = ">=0.0.1,<1"

[pack.inference]
imports = ["audio_encoders.audio_encoders", "hooks", "latent_formats", "utils"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_conditioning:NODES"
types = "dinkster_conditioning.types:register_types"
