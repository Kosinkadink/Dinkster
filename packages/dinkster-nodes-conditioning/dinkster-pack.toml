[pack]
name = "dinkster-conditioning"
version = "0.0.8"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.conditioning"]
requires = ["torch", "safetensors", "dinkster-inference", "dinkster-pack-helpers>=0.0.2,<1"]

[pack.dependencies]
dinkster-latent = ">=0.0.1,<1"

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
nodes = "dinkster_conditioning:NODES"
types = "dinkster_conditioning.types:register_types"
