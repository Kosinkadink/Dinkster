[project]
name = "dinkster-conditioning"
version = "0.0.5"
description = "First-party Dinkster conditioning nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "safetensors",
    "dinkster-inference==0.1.1",
    "dinkster-latent>=0.0.1,<1",
    "dinkster-pack-helpers>=0.0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_conditioning"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_conditioning/dinkster-pack.toml"
"locales" = "dinkster_conditioning/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-latent = { workspace = true }
dinkster-pack-helpers = { workspace = true }
