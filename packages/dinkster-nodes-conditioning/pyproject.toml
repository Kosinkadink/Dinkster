[project]
name = "dinkster-nodes-conditioning"
version = "0.0.2"
description = "First-party Dinkster conditioning nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-inference-wire", "dinkster-nodes-latent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_conditioning"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_conditioning_pack/dinkster-pack.toml"
"src/dinkster_nodes_conditioning" = "dinkster_conditioning_pack/dinkster_nodes_conditioning"
"locales" = "dinkster_conditioning_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-inference-wire = { workspace = true }
dinkster-nodes-latent = { workspace = true }
