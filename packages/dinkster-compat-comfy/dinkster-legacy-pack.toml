# Legacy ComfyUI custom-pack quarantine (DESIGN 3.8). Same package, second
# manifest: a worker launched with this manifest loads unmodified custom
# node packs (DINKSTER_LEGACY_PACKS) instead of the translated core surface.
# Runs on the ComfyUI install's own interpreter, like dinkster-pack.toml.
[pack]
name = "dinkster-compat-legacy"
# Quarantined legacy nodes arrive as comfy.<pack>.<v1 name>: the same
# reserved "comfy" claim the core compat worker holds - trusted workers
# may share one reserved root (the host granted it to both).
namespaces = ["comfy", "dinkster"]
executes = [
    "dinkster.load_checkpoint",
    "dinkster.load_model_patch",
    "dinkster.apply_minimax_h3_fun_controlnet",
    "dinkster.load_diffusion_model",
    "dinkster.clip_text_encode",
    "dinkster.empty_latent_image",
    "dinkster.temporal_window_plan",
    "dinkster.spatial_tile_plan",
    "dinkster.explicit_window_plan",
    "dinkster.res4lyf_rk_beta_sampler",
    "dinkster.ksampler",
    "dinkster.vae_decode",
    "dinkster.load_clip",
    "dinkster.load_vae",
    "dinkster.empty_minimax_h3_av",
    "dinkster.minimax_h3_t2va_conditioning",
    "dinkster.minimax_h3_image_to_video",
    "dinkster.separate_av_latent",
    "dinkster.vae_decode_audio",
    "dinkster.image_crop_to_mask",
    "dinkster.preview_mask",
    "dinkster.voxel_to_mesh",
    "dinkster.get_mesh_info",
    "dinkster.remesh_mesh",
    "dinkster.decimate_mesh",
    "dinkster.smooth_mesh_normals",
    "dinkster.unwrap_mesh",
    "dinkster.paint_mesh",
    "dinkster.bake_texture_from_voxel",
    "dinkster.bake_normal_map_from_mesh",
    "dinkster.bake_ambient_occlusion",
    "dinkster.render_uv_atlas",
    "dinkster.apply_texture_to_mesh",
    "dinkster.mesh_to_model3d",
]
requires = [
    "dinkster-comfy @ git+https://github.com/Kosinkadink/dinkster-comfy.git@9ef3ad6f156ea3a0d62e64d14beb5b31b979eef9",
]

[pack.sandbox]
gpu = true
writable-mounts = true

[pack.dependencies]
dinkster-nodes-generation = ">=0.0.1,<1"
dinkster-nodes-media-io = ">=0.0.1,<1"

[pack.requirements.capabilities]
"dinkster.generation.schemas" = ">=1.0.0,<2"

[pack.arms]
native = [
    "dinkster.load_checkpoint",
    "dinkster.load_model_patch",
    "dinkster.apply_minimax_h3_fun_controlnet",
    "dinkster.load_diffusion_model",
    "dinkster.clip_text_encode",
    "dinkster.empty_latent_image",
    "dinkster.temporal_window_plan",
    "dinkster.spatial_tile_plan",
    "dinkster.explicit_window_plan",
    "dinkster.res4lyf_rk_beta_sampler",
    "dinkster.ksampler",
    "dinkster.vae_decode",
    "dinkster.load_clip",
    "dinkster.load_vae",
    "dinkster.empty_minimax_h3_av",
    "dinkster.minimax_h3_t2va_conditioning",
    "dinkster.minimax_h3_image_to_video",
    "dinkster.separate_av_latent",
    "dinkster.vae_decode_audio",
]

[pack.entry]
nodes = "dinkster_compat_comfy.legacy_entry:LEGACY_NODES"
arm_nodes = "dinkster_compat_comfy.legacy_entry:ARM_NODES"
types = "dinkster_compat_comfy.legacy_entry:register_types"
reservations = "dinkster_compat_comfy.memory:plan_reservations"
consumers = "dinkster_compat_comfy.pool:memory_consumers"
telemetry = "dinkster_compat_comfy.devices:vram_telemetry_snapshot"
choices = "dinkster_compat_comfy.legacy_entry:combo_choices"
skips = "dinkster_compat_comfy.legacy_entry:translation_skips"
source_staging = "dinkster_compat_comfy.source_staging:source_staging_provider"
workgroup_handler = "dinkster_native.workgroup:create_single_job_workgroup_handler"
