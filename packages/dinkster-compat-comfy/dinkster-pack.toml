    "comfy.IMAGECOMPARE",
    "comfy.INTERP_MODEL",
    "comfy.KIMODO_POSE_DATA",
    "comfy.LATENT",
    "comfy.LATENT_OPERATION",
    "comfy.LOAD3D_CAMERA",
