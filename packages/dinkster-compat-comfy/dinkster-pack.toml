# No interpreter requirements: this pack runs on the ComfyUI install's own
# interpreter, which already has torch and every v1 dependency. Dinkster's
# pure-stdlib packages ride in via PYTHONPATH.
requires = []

[pack.sandbox]
gpu = true
writable-mounts = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"
inference = "dinkster-inference/1"

[pack.dependencies]
dinkster-nodes-generation = ">=0.0.1,<1"
dinkster-nodes-media-io = ">=0.0.1,<1"

[pack.requirements.capabilities]
