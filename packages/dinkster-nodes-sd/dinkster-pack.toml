[pack]
name = "dinkster-sd"
version = "0.0.6"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.sd"]
requires = ["dinkster-inference", "torch", "dinkster-pack-helpers>=0.0.2,<1"]
type-namespaces = ["PHOTOMAKER"]

[pack.sandbox]
gpu = true
writable-mounts = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-conditioning = ">=0.0.1,<1"
dinkster-sampling = ">=0.0.1,<1"

[pack.entry]
nodes = "dinkster_sd:NODES"
types = "dinkster_sd:register_types"
