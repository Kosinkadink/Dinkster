[pack]
name = "dinkster-sd"
version = "0.0.4"
engine = ">=0.0.2.dev0,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.sd"]
requires = ["dinkster-inference==0.1.1", "torch", "dinkster-pack-helpers>=0.0.2,<1"]
type-namespaces = ["PHOTOMAKER"]

[pack.inference]
imports = ["cli_args", "clip_model", "clip_vision", "model_base", "model_management", "model_sampling", "ops", "sd", "utils"]
tested-version = "0.1.1"

[pack.sandbox]
gpu = true
writable-mounts = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-conditioning = ">=0.0.1,<1"
dinkster-sampling = ">=0.0.1,<1"

[pack.entry]
nodes = "dinkster_sd:NODES"
types = "dinkster_sd:register_types"
