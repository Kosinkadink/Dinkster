[project]
name = "dinkster-sd"
version = "0.0.9"
description = "Dinkster sd nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-inference",
    "torch",
    "dinkster-conditioning>=0.0.1,<1",
    "dinkster-sampling>=0.0.1,<1",
    "dinkster-pack-helpers>=0.0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_sd"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_sd/dinkster-pack.toml"
"locales" = "dinkster_sd/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-conditioning = { workspace = true }
dinkster-sampling = { workspace = true }
dinkster-pack-helpers = { workspace = true }
