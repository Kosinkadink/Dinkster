[project]
name = "dinkster-kernels"
version = "0.0.1"
description = "Dinkster-owned device kernels behind torch custom operators: fused packed-domain GGUF matmul"
requires-python = ">=3.12"
dependencies = []

# torch is a REAL runtime requirement, declared as an extra on purpose
# for the same reason as dinkster-inference-torch: the workspace .venv is
# deliberately torch-free (AGENTS.md). triton is NOT declared at all:
# CUDA torch wheels ship it where the kernels can run, and every entry
# point degrades to unavailable (never an import error) without it.
[project.optional-dependencies]
torch = ["torch>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_kernels"]

# Typing gate: the root pyright excludes this package (its venv is
# torch-free, and triton only exists in CUDA environments). Check it on
# GPU machines with `.venv/bin/pyright -p packages/dinkster-kernels`,
# which resolves imports against .venv-gpu (see AGENTS.md "Validation
# gate").
[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv-gpu"
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "strict"
# torch's stubs are partially untyped and triton ships no py.typed at
# all; the unknown-propagation rules would need inline ignores on
# nearly every kernel expression, and @triton.jit parameters take
# device tensors/pointers that have no spellable type (annotations on
# them are also how triton detects constexpr, so they stay unannotated
# except for tl.constexpr). Everything else in strict stays on.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = false
