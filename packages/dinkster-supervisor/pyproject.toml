[project]
name = "dinkster-supervisor"
version = "0.0.4"
description = "Dinkster supervisor: layer-0 process that owns the public port, spawns engine hosts, and proxies to them"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "blake3>=1.0",
    "cryptography>=44",
    "packaging>=24",
    "pydantic>=2.10,<3",
    "zstandard>=0.25",
]

[dependency-groups]
environment-tools = ["uv==0.11.29"]

[project.scripts]
dinkster-env = "dinkster_supervisor.environment:main"
dinkster-installs = "dinkster_supervisor.install_manager:main"
dinkster-supervisor = "dinkster_supervisor.supervisor:main"
dinkster-station = "dinkster_supervisor.station:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_supervisor", "shared/dinkster_store"]

[tool.hatch.build.targets.wheel.force-include]
"src/dinkster_supervisor/security" = "dinkster_security"
