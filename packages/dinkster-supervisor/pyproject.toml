[project]
name = "dinkster-supervisor"
version = "0.0.15"
description = "Dinkster supervisor: layer-0 process that owns the public port, spawns engine hosts, and proxies to them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "alembic>=1.16,<2",
    "av==18.1.0",
    "blake3>=1.0",
    "cryptography>=44",
    "dinkster-opentimelineio==0.19.0",
    "filelock>=4.2.4,<5",
    "numpy>=1.26",
    "packaging>=24",
    "pillow>=10",
    "psd-tools>=1.14.3,<1.20",
    "pygit2==1.21.0",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "zstandard>=0.25",
]

[dependency-groups]
environment-tools = ["uv==0.13.6"]

[project.scripts]
dinkster-env = "dinkster_supervisor.environment:main"
dinkster-home = "dinkster_supervisor.home:main"
dinkster-installs = "dinkster_supervisor.install_manager:main"
dinkster-supervisor = "dinkster_supervisor.supervisor:main"
dinkster-station = "dinkster_supervisor.station:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_supervisor", "shared/dinkster_store"]

[tool.hatch.build.targets.wheel.force-include]
"src/dinkster_supervisor/security" = "dinkster_security"
"../dinkster-library/src/dinkster_library" = "dinkster_library"
"../dinkster-values/src/dinkster_values" = "dinkster_values"
"../dinkster-assets/src/dinkster_assets" = "dinkster_assets"
"../dinkster-image-document/src/dinkster_image_document" = "dinkster_image_document"
"../dinkster-video-runtime/src/dinkster_video_runtime" = "dinkster_video_runtime"
"../dinkster-video-runtime/preview/src/dinkster_video_preview" = "dinkster_video_preview"
"../dinkster-video-runtime/preview" = "dinkster_video_runtime/preview"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "../../hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "../../hatch_build.py"
