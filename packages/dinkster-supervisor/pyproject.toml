[project]
name = "dinkster-supervisor"
version = "0.0.1"
description = "Dinkster supervisor: layer-0 process that owns the public port, spawns engine hosts, and proxies to them"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
]

[project.scripts]
dinkster-supervisor = "dinkster_supervisor.supervisor:main"
dinkster-station = "dinkster_supervisor.station:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_supervisor"]
