[project]
name = "dinkster-vision-sam31"
version = "0.0.1"
description = "Dinkster SAM 3.1 detection, segmentation, and video tracking provider"
requires-python = ">=3.12"
license = "LicenseRef-SAM-License"
license-files = ["SAM_LICENSE", "CLIP_LICENSE"]
dependencies = [
    "dinkster-api",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_sam31"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_sam31_pack/dinkster-pack.toml"
"SAM_LICENSE" = "dinkster_vision_sam31_pack/SAM_LICENSE"
"CLIP_LICENSE" = "dinkster_vision_sam31_pack/CLIP_LICENSE"
"src/dinkster_vision_sam31" = "dinkster_vision_sam31_pack/dinkster_vision_sam31"

[tool.uv.sources]
dinkster-api = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv-torch"
include = ["src", "tests"]
typeCheckingMode = "standard"
