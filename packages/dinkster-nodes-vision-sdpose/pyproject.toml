[project]
name = "dinkster-nodes-vision-sdpose"
version = "0.0.2"
description = "ComfyUI-origin vision-sdpose nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-nodes-conditioning", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_vision_sdpose"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_sdpose_pack/dinkster-pack.toml"
"src/dinkster_nodes_vision_sdpose" = "dinkster_vision_sdpose_pack/dinkster_nodes_vision_sdpose"
"locales" = "dinkster_vision_sdpose_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-nodes-conditioning = { workspace = true }
