[project]
name = "dinkster-vision-sdpose"
version = "0.0.6"
description = "ComfyUI-origin vision-sdpose nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference",
    "numpy>=1.26",
    "dinkster-misc-models>=0.0.1,<1",
    "dinkster-pack-helpers>=0.0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_sdpose"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_sdpose/dinkster-pack.toml"
"locales" = "dinkster_vision_sdpose/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-misc-models = { workspace = true }
dinkster-pack-helpers = { workspace = true }
