[pack]
name = "dinkster-vision-sdpose"
version = "0.0.6"
engine = ">=0.0.3,<0.1"
publisher = "dinkster"
namespaces = ["dinkster.vision.sdpose"]
requires = ["torch", "dinkster-inference", "numpy>=1.26", "dinkster-pack-helpers>=0.0.2,<1"]

[pack.sandbox]
gpu = true

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-misc-models = ">=0.0.1,<1"

[pack.entry]
nodes = "dinkster_vision_sdpose:NODES"
types = "dinkster_vision_sdpose:register_types"
