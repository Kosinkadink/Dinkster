[project]
name = "dinkster-assets"
version = "0.0.1"
description = "Dinkster asset system: content-digest identity, virtual-folder catalog, asset stores"
requires-python = ">=3.12"
dependencies = ["dinkster-values", "blake3>=0.4", "sqlalchemy>=2.0,<3", "alembic>=1.16,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_assets"]

[tool.uv.sources]
dinkster-values = { workspace = true }
