[project]
name = "dinkster-vision-hed"
version = "0.0.1"
description = "Dinkster model-backed line and edge preprocessor provider"
requires-python = ">=3.12"
license-files = [
    "LINEART_LICENSE",
    "MANGA_LICENSE",
    "MLSD_LICENSE",
    "TEED_LICENSE",
    "WEIGHT_LICENSES.md",
]
dependencies = [
    "dinkster-api",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_hed"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_hed_pack/dinkster-pack.toml"
"LINEART_LICENSE" = "dinkster_vision_hed_pack/LINEART_LICENSE"
"MANGA_LICENSE" = "dinkster_vision_hed_pack/MANGA_LICENSE"
"MLSD_LICENSE" = "dinkster_vision_hed_pack/MLSD_LICENSE"
"TEED_LICENSE" = "dinkster_vision_hed_pack/TEED_LICENSE"
"WEIGHT_LICENSES.md" = "dinkster_vision_hed_pack/WEIGHT_LICENSES.md"
"src/dinkster_vision_hed" = "dinkster_vision_hed_pack/dinkster_vision_hed"

[tool.uv.sources]
dinkster-api = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv-torch"
include = ["src", "tests"]
typeCheckingMode = "standard"
