[project]
name = "dinkster-vision-mediapipe"
version = "0.0.4"
description = "ComfyUI-origin vision-mediapipe nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "torch",
    "dinkster-inference",
    "numpy>=1.26",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_mediapipe"]


[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_mediapipe/dinkster-pack.toml"
"locales" = "dinkster_vision_mediapipe/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
