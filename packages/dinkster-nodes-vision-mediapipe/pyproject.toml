[project]
name = "dinkster-nodes-vision-mediapipe"
version = "0.0.2"
description = "ComfyUI-origin vision-mediapipe nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_vision_mediapipe"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_mediapipe_pack/dinkster-pack.toml"
"src/dinkster_nodes_vision_mediapipe" = "dinkster_vision_mediapipe_pack/dinkster_nodes_vision_mediapipe"
"locales" = "dinkster_vision_mediapipe_pack/locales"

[tool.uv.sources]
dinkster-api = { workspace = true }
