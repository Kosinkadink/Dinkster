[project]
name = "dinkster-training-torch"
version = "0.0.1"
description = "Native SD1.5, SDXL, Flux, Wan, and MiniMax LoRA training runtime for Dinkster"
requires-python = ">=3.12"
dependencies = [
    "av==16.0.1",
    "dinkster-api",
    "dinkster-inference",
    "dinkster-inference-torch",
    "dinkster-nodes-training",
    "dinkster-server",
    "pillow>=10",
]

# The workspace root remains torch-free. Runtime workers install this extra in
# their dedicated torch environment.
[project.optional-dependencies]
torch = ["dinkster-inference-torch[torch]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_training_torch"]

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-inference = { workspace = true }
dinkster-inference-torch = { workspace = true }
dinkster-nodes-training = { workspace = true }
dinkster-server = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv-torch"
include = ["src", "tests"]
extraPaths = ["../dinkster-inference-torch/src"]
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
