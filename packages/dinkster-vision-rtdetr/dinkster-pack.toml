[pack]
name = "dinkster-vision-rtdetr"
namespaces = []
executes = ["dinkster.detection.detect"]
requires = [
    "numpy==2.5.1",
    "safetensors==0.8.0",
    "torch==2.13.0",
]

[pack.sandbox]
gpu = false
network = false
writable-mounts = false

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.dependencies]
dinkster-nodes-image = ">=0.0.1,<1"

[[pack.vision-providers]]
choice = "dinkster.detection.detect.providers"
node = "dinkster.detection.detect"
model = "rtdetr-v4-x-hgnet"
devices = ["cpu"]
dtypes = ["float32"]
batching = "batch"
artifacts = ["rtdetr-v4-x-hgnet-fp16"]

[[pack.assets]]
id = "rtdetr-v4-x-hgnet-fp16"
name = "RT-DETR v4 x-HGNet fp16 COCO object detector"
digest = "blake3:5eaa01a6d16d654d9a4991ab1dfe489b580acc4b939cd1963ac6d12ceb9dc7f8"
kind = "model/detector"
size = 123968978
media_type = "application/octet-stream"
urls = [
    "https://huggingface.co/Comfy-Org/SDPose/resolve/f122ac7976997885e3bfeab2bb3a537a6bc250bc/diffusion_models/rt_detr_v4-x-hgnet_fp16.safetensors",
]

[pack.entry]
nodes = "dinkster_vision_rtdetr:RTDETR_PROVIDER_NODES"
types = "dinkster_vision_rtdetr:register_types"
