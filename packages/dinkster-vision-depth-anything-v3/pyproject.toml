[project]
name = "dinkster-vision-depth-anything-v3"
version = "0.0.1"
description = "Dinkster Depth Anything 3 Mono Large depth provider"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_vision_depth_anything_v3"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_vision_depth_anything_v3_pack/dinkster-pack.toml"
"src/dinkster_vision_depth_anything_v3" = "dinkster_vision_depth_anything_v3_pack/dinkster_vision_depth_anything_v3"

[tool.uv.sources]
dinkster-api = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv-torch"
include = ["src", "tests"]
typeCheckingMode = "standard"
