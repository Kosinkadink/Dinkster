[project]
name = "dinkster-library"
version = "0.0.15"
description = "Dinkster library records over a private child-process pipe"
requires-python = ">=3.12"
dependencies = ["filelock>=4.2.4,<5"]

[project.scripts]
dinkster-library = "dinkster_library.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_library"]
