[project]
name = "dinkster-model-yue2"
version = "0.0.1"
description = "Dinkster first-party YuE2 music model pack"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-inference",
    "dinkster-inference-torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_model_yue2"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_model_yue2_pack/dinkster-pack.toml"
"src/dinkster_model_yue2" = "dinkster_model_yue2_pack/dinkster_model_yue2"

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-inference = { workspace = true }
dinkster-inference-torch = { workspace = true }
