[pack]
name = "dinkster-extension-contract-fixture"
namespaces = ["fixture"]

[pack.contracts]
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"
inference = "dinkster-inference/1"

[pack.provides.registry]
"dinkster.model-families" = ["fixture.toy-image"]

[pack.entry]
nodes = "extension_contract_pack:NODES"
types = "extension_contract_pack:register_types"

[pack.sandbox]

[pack.extension]
inference = "extension_contract_pack:register_inference"
privileges = ["schema", "server", "frontend", "inference"]
capabilities = ["model-family-registration", "routes"]

[[pack.extension.routes]]
id = "extension-contract"
method = "GET"
handler = "extension_contract_pack:route"
request = {}
response = { message = "string" }

[[pack.extension.events]]
name = "fixture.extension-contract.executed"
payload = { height = "integer", mean = "number", width = "integer" }

[[pack.extension.frontend-modules]]
id = "dinkster-extension-contract-fixture.frontend"
module = "./frontend.js"
privileges = ["app-workflow", "event-consumer", "graph-editor-canvas"]
contributions = [
  { id = "dinkster-extension-contract-fixture.event", kind = "eventConsumer", event = "fixture.extension-contract.executed" },
  { id = "dinkster-extension-contract-fixture.status", kind = "hostUi" },
  { id = "dinkster-extension-contract-fixture.canvas", kind = "canvasLayer" },
  { id = "dinkster-extension-contract-fixture.node-decoration", kind = "nodeDecoration" },
]
