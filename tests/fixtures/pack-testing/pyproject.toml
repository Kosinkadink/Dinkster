[project]
name = "example-tally"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_tally"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "example_tally/dinkster-pack.toml"
