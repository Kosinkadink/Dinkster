[project]
name = "dinkster"
version = "0.0.1"
description = "Dinkster - a clean-slate ComfyUI backend (umbrella dev package + demo CLI)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "blake3>=0.4",
    "comfy-angle==0.1.1; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "comfy-aimdo==0.6.0",
    "comfy-kitchen==0.2.40",
    "dinkster-api",
    "dinkster-inference==0.1.0",
    "dinkster-token-verifier==0.1.2",
    "dinkster-supervisor",
    "numba>=0.67",
    "opencv-contrib-python-headless>=5.0,<5.1",
    "PyOpenGL>=3.1.8,<4",
    "pyobjc-framework-Network>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=12.2.2; sys_platform == 'darwin'",
    "scipy>=1.11",
    "simpleeval==1.0.8",
    "zeroconf>=0.147",
    # The comfy compat host registration (comfy_compose.register_comfy_host_types)
    # decodes and renders comfy.IMAGE values with numpy; dinkster-values itself
    # stays dependency-free (its image codec needs numpy at call time only).
    "numpy>=1.26",
    # Image-file asset decoding (typed assets: decode_image_file) opens files
    # with Pillow, imported at call time only - same pattern as numpy above.
    "pillow>=10",
]

[project.scripts]
dinkster = "dinkster.cli:main"
dinkster-serve = "dinkster.serve:main"
dinkster-pack = "dinkster.manager:main"
dinkster-isolated = "dinkster.isolated_demo:main"
dinkster-port = "dinkster.port:main"

[project.optional-dependencies]
default = [
    "dinkster-supervisor",
]
collab = []
supervisor = ["dinkster-supervisor"]

[dependency-groups]
engine-base = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "numpy==2.5.1",
    "opencv-contrib-python-headless==5.0.0.93",
]
angle = [
    "comfy-angle==0.1.1",
    "PyOpenGL>=3.1.8,<4",
]
dev = [
    "hypothesis>=6",
    "onnxruntime==1.29.0",
    "pytest>=8",
    "pytest-cov>=6",
    "pyyaml>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "scipy-stubs>=1.18.1.0",
    "dinkster-opentimelineio==0.19.0",
    "threadpoolctl>=3.7",
]

[tool.uv]
# Model validation and pack manifests use this tokenizer/transformer combination.
constraint-dependencies = [
    "sentencepiece==0.2.1",
    "tokenizers==0.23.1",
    "transformers==5.16.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-schema = { workspace = true }
dinkster-values = { workspace = true }
dinkster-video = { workspace = true }
dinkster-graph = { workspace = true }
dinkster-inference-wire = { workspace = true }
dinkster-protocol = { workspace = true }
dinkster-engine = { workspace = true }
dinkster-workers = { workspace = true }
dinkster-caches = { workspace = true }
dinkster-assets = { workspace = true }
dinkster-image-document = { workspace = true }
dinkster-memory = { workspace = true }
dinkster-native = { workspace = true }
dinkster-compat-comfy = { workspace = true }
dinkster-nodes-remote = { workspace = true }
dinkster-nodes-comfy = { workspace = true }
dinkster-nodes-generation = { workspace = true }
dinkster-nodes-image = { workspace = true }
dinkster-server = { workspace = true }
dinkster-collab = { workspace = true }
dinkster-registry = { workspace = true }
dinkster-supervisor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/dinkster",
    "packages/dinkster-native/src/dinkster_native",
    "packages/dinkster-compat-comfy/src/dinkster_compat_comfy",
    "packages/dinkster-nodes-generation/src/dinkster_nodes_generation",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"packages/dinkster-graph/src/dinkster_graph" = "dinkster_graph"
"packages/dinkster-engine/src/dinkster_engine" = "dinkster_engine"
"packages/dinkster-server/src/dinkster_server" = "dinkster_server"
"packages/dinkster-collab/src/dinkster_collab" = "dinkster_collab"
"packages/dinkster-native/dinkster-pack.toml" = "dinkster_native_pack/dinkster-pack.toml"
"packages/dinkster-native/src/dinkster_native" = "dinkster_native_pack/dinkster_native"
"packages/dinkster-compat-comfy/dinkster-pack.toml" = "dinkster_compat_comfy_pack/dinkster-pack.toml"
"packages/dinkster-compat-comfy/src/dinkster_compat_comfy" = "dinkster_compat_comfy_pack/dinkster_compat_comfy"
"packages/dinkster-nodes-generation/dinkster-pack.toml" = "dinkster_nodes_generation_pack/dinkster-pack.toml"
"packages/dinkster-nodes-generation/src/dinkster_nodes_generation" = "dinkster_nodes_generation_pack/dinkster_nodes_generation"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP040", "UP046", "UP047"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/dinkster-nodes-remote/tests",
]
# Tests import helpers as `tests.*` / `tools.*`, which requires the repo
# root on sys.path. `python -m pytest` adds it implicitly; the `pytest`
# entrypoint (what CI's `uv run pytest` invokes) does not.
pythonpath = ["."]
# Self-identifying hangs: once any test runs this long, pytest's bundled
# faulthandler plugin dumps every thread's stack naming the stuck test
# (comfy-vibe-station#245). Diagnostic only; it never skips, fails, or
# reshapes a test.
faulthandler_timeout = 600

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["packages", "src", "tests"]
extraPaths = ["src", "../.dinkster-evidence-source", ".evidence-source"]
# Torch execution modules are checked in their isolated worker environment.
exclude = [
    "packages/dinkster-native/src/dinkster_native/model3d",
    "packages/dinkster-nodes-comfy/tests",
    "packages/dinkster-nodes-vision",
]
# The packages are the load-bearing code: strict there. Tests and the demo
# CLI stay on standard - useful checking without annotation ceremony.
strict = ["packages"]
typeCheckingMode = "standard"
