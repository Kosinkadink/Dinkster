[project]
name = "dinkster"
version = "0.0.3"
description = "Dinkster - a clean-slate ComfyUI backend (umbrella dev package + demo CLI)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "blake3>=0.4",
    "comfy-angle==0.1.1; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "comfy-aimdo==0.6.0",
    "comfy-kitchen==0.2.40",
    "dinkster-api==0.0.3",
    "dinkster-engine==0.0.3",
    "dinkster-inference==0.1.1",
    "dinkster-token-verifier==0.1.2",
    "dinkster-supervisor",
    "numba>=0.67",
    "opencv-contrib-python-headless>=5.0,<5.1",
    "PyOpenGL>=3.1.8,<4",
    "pyobjc-framework-Network>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=12.2.2; sys_platform == 'darwin'",
    "scipy>=1.11",
    "simpleeval==1.0.8",
    "zeroconf>=0.147",
    # Image codecs use numpy at call time; dinkster-values stays dependency-free.
    "numpy>=1.26",
    # Image-file asset decoding (typed assets: decode_image_file) opens files
    # with Pillow, imported at call time only - same pattern as numpy above.
    "pillow>=10",
]

[project.scripts]
dinkster = "dinkster.cli:main"
dinkster-serve = "dinkster.serve:main"
dinkster-pack = "dinkster.manager:main"
dinkster-isolated = "dinkster.isolated_demo:main"

[project.optional-dependencies]
default = [
    "dinkster-supervisor",
]
collab = []
supervisor = ["dinkster-supervisor"]

[dependency-groups]
engine-base = [
    "numpy==2.5.1",
    "opencv-contrib-python-headless==5.0.0.93",
]
angle = [
    "comfy-angle==0.1.1",
    "PyOpenGL>=3.1.8,<4",
]
release-publication = ["boto3>=1.40,<2", "dinkster-supervisor"]
dev = [
    "boto3>=1.40,<2",
    "dinkster-supervisor",
    "hypothesis>=6",
    "onnxruntime==1.29.0",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
    "pyyaml>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "scipy-stubs>=1.18.1.0",
    "dinkster-opentimelineio==0.19.0",
    "threadpoolctl>=3.7",
]

[tool.uv]
# Model validation and pack manifests use this tokenizer/transformer combination.
constraint-dependencies = [
    "sentencepiece==0.2.1",
    "tokenizers==0.23.1",
    "transformers==5.16.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dinkster-api = { workspace = true }
dinkster-schema = { workspace = true }
dinkster-values = { workspace = true }
dinkster-video-runtime = { workspace = true }
dinkster-graph = { workspace = true }
dinkster-inference-wire = { workspace = true }
dinkster-protocol = { workspace = true }
dinkster-engine = { workspace = true }
dinkster-workers = { workspace = true }
dinkster-caches = { workspace = true }
dinkster-assets = { workspace = true }
dinkster-image-document = { workspace = true }
dinkster-memory = { workspace = true }
dinkster-native = { workspace = true }
dinkster-nodes-remote = { workspace = true }
dinkster-image = { workspace = true }
dinkster-server = { workspace = true }
dinkster-collab = { workspace = true }
dinkster-registry = { workspace = true }
dinkster-supervisor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/dinkster",
    "packages/dinkster-native/src/dinkster_native",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"packages/dinkster-server/src/dinkster_server" = "dinkster_server"
"packages/dinkster-collab/src/dinkster_collab" = "dinkster_collab"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP040", "UP046", "UP047"]

[tool.pytest.ini_options]
addopts = "-n logical --maxprocesses=8 --dist=worksteal --max-worker-restart=0"
testpaths = [
    "tests",
    "packages/dinkster-nodes-remote/tests",
]
# Tests import helpers as `tests.*` / `tools.*`, which requires the repo
# root on sys.path. `python -m pytest` adds it implicitly; the `pytest`
# entrypoint (what CI's `uv run pytest` invokes) does not.
# Manifest fixtures import runtime test modules by name in both host modes,
# including when pytest collects those modules with importlib mode.
pythonpath = [".", "tests/first_party_runtime"]
timeout = 300
timeout_method = "thread"
# Self-identifying hangs: once any test runs this long, pytest's bundled
# faulthandler plugin dumps every thread's stack naming the stuck test
# (comfy-vibe-station#245). Diagnostic only; it never skips, fails, or
# reshapes a test.
faulthandler_timeout = 600

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["packages", "src", "tests"]
extraPaths = ["src", "../.dinkster-evidence-source", ".evidence-source"]
# Torch execution modules are checked in their isolated worker environment.
exclude = [
    "tests/first_party_runtime",
    "packages/dinkster-nodes-sampling/tests",
    "packages/dinkster-nodes-models/tests",
    "packages/dinkster-nodes-conditioning/tests",
    "packages/dinkster-nodes-latent/tests",
    "packages/dinkster-nodes-audio/tests",
    "packages/dinkster-nodes-video/tests",
    "packages/dinkster-nodes-sd/tests",
    "packages/dinkster-nodes-flux/tests",
    "packages/dinkster-nodes-qwen/tests",
    "packages/dinkster-nodes-hidream/tests",
    "packages/dinkster-nodes-audio-models/tests",
    "packages/dinkster-nodes-misc-models/tests",
    "packages/dinkster-nodes-llm/tests",
    "packages/dinkster-nodes-upscale/tests",
    "packages/dinkster-nodes-cosmos/tests",
    "packages/dinkster-nodes-hunyuan/tests",
    "packages/dinkster-nodes-ltx/tests",
    "packages/dinkster-nodes-minimax/tests",
    "packages/dinkster-nodes-seedvr/tests",
    "packages/dinkster-nodes-void/tests",
    "packages/dinkster-nodes-wan/tests",
    "packages/dinkster-nodes-image/tests",
    "packages/dinkster-nodes-utilities/tests",
    "packages/dinkster-nodes-3d/tests",
    "packages/dinkster-nodes-3d-models/tests",
    "packages/dinkster-nodes-vision-background-removal/tests",
    "packages/dinkster-nodes-vision-depth-anything-3/tests",
    "packages/dinkster-nodes-vision-marigold/tests",
    "packages/dinkster-nodes-vision-mediapipe/tests",
    "packages/dinkster-nodes-vision-moge/tests",
    "packages/dinkster-nodes-vision-rtdetr/tests",
    "packages/dinkster-nodes-vision-sam3/tests",
    "packages/dinkster-nodes-vision-sam3d-body/tests",
    "packages/dinkster-nodes-vision-sdpose/tests",
]
# The packages are the load-bearing code: strict there. Tests and the demo
# CLI stay on standard - useful checking without annotation ceremony.
strict = ["packages"]
typeCheckingMode = "standard"
