name: Independent official pack publication

on:
  push:
    branches: [main]
    tags: ["pack/**"]
    paths: ["packages/dinkster-nodes-*/**"]
  pull_request:
    paths:
      - .github/workflows/official-packs.yml
      - scripts/select_official_packs.py
      - scripts/build_official_packs.py
      - scripts/build_release_pack_locks.py
      - scripts/publish_official_packs.py
      - scripts/base_bundles.json
      - packages/dinkster-nodes-*/**

permissions:
  contents: read

concurrency:
  group: official-packs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packs: ${{ steps.select.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev --package dinkster-registry --package dinkster-workers
      - name: Select committed pack changes or an exact pack tag
        id: select
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PACK_TAG: ${{ startsWith(github.ref, 'refs/tags/pack/') && github.ref_name || '' }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.select_official_packs import select_packs
          tag = os.environ['PACK_TAG']
          packs = select_packs(Path.cwd(), tag=tag) if tag else select_packs(Path.cwd(), before=os.environ['BEFORE'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('packs=' + json.dumps(packs) + '\n')
          PY

  sources:
    needs: select
    if: needs.select.outputs.packs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev --package dinkster-registry --package dinkster-workers --package dinkster-supervisor
      - name: Prepare own-version sources against a published engine and every supported base
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PACKS: ${{ needs.select.outputs.packs }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from urllib.parse import quote
          from dinkster_registry import Lockfile, unpack_artifact
          from dinkster_workers import load_manifest
          from dinkster_supervisor.environment_artifacts import validate_manifest
          from dinkster_supervisor.environment_downloads import fetch_artifact
          from dinkster_supervisor.environment_state import content_digest
          from scripts.acquire_engine_bases import acquire
          from scripts.build_official_packs import build

          root = Path.cwd()
          work = root / '.official-publication'
          work.mkdir()
          selections = json.loads((root / 'scripts/base_bundles.json').read_bytes())
          bases = acquire(root, [f'base-{variant}-{identity}' for variant, identity in selections.items()], work / 'bases')
          releases = json.loads(subprocess.check_output(['gh', 'api', 'repos/Kosinkadink/Dinkster/releases?per_page=100']))
          published = [release for release in releases if not release['draft'] and release['published_at']]
          if not published:
              raise ValueError('official packs require an already-published engine')
          release = max(published, key=lambda item: item['published_at'])
          engine_dir = work / 'engine'
          subprocess.run(['gh', 'release', 'download', release['tag_name'], '--repo', 'Kosinkadink/Dinkster', '--pattern', 'release-manifest.json', '--dir', str(engine_dir)], check=True)
          metadata = engine_dir / 'release-manifest.json'
          engine = validate_manifest(metadata.read_bytes(), content_digest(metadata), None)
          if engine['repository'] != 'Kosinkadink/Dinkster' or engine['tag'] != release['tag_name']:
              raise ValueError('published engine identity mismatch')
          mirror = 'https://github.com/Kosinkadink/Dinkster/releases/download/' + quote(release['tag_name'], safe='')
          for row in engine['artifacts']:
              fetch_artifact((mirror,), row['name'], engine_dir / row['name'], row['sha256'], row['size'])
          sources = work / 'sources'
          build(root, sources, packs=json.loads(os.environ['PACKS']))
          catalog = Lockfile.from_record_json((sources / 'official-packs.lock').read_text())
          for pack in catalog.packs:
              tree = unpack_artifact(sources / f'{pack.pack}-{pack.version}.zip', work / 'admission' / pack.pack, pack.artifact_digest)
              manifest = load_manifest(tree / 'dinkster-pack.toml')
              if manifest.compatibility is None:
                  raise ValueError(f'pack {pack.pack} lacks engine compatibility')
              manifest.compatibility.require_engine(pack.pack, engine['version'])
          rows = []
          for path in bases:
              base = json.loads(path.read_bytes())
              runner = {'linux': 'ubuntu-latest', 'windows': 'windows-latest', 'macos': 'macos-latest'}[base['platform']['os']]
              rows.append({'variant': base['variant'], 'runner': runner})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': rows}) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-publication-inputs
          path: |
            .official-publication/sources/
            .official-publication/bases/
            .official-publication/engine/
          include-hidden-files: true
          if-no-files-found: error

  locks:
    needs: sources
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sources.outputs.matrix) }}
    steps:
      - name: Expose Git Bash on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bashDirectory = Join-Path $env:ProgramFiles 'Git/bin'
          if (-not (Test-Path (Join-Path $bashDirectory 'bash.exe') -PathType Leaf)) {
            throw 'Git Bash is required for the native pack lock build'
          }
          $bashDirectory >> $env:GITHUB_PATH
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-publication-inputs
          path: .official-publication
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev --package dinkster-registry --package dinkster-workers --package dinkster-supervisor
      - name: Resolve native supported-base locks without rebuilding the engine
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          uv run --no-sync python -m scripts.build_release_pack_locks \
            --release .official-publication/engine --sources .official-publication/sources \
            --base-manifest ".official-publication/bases/$VARIANT/manifest.json" \
            --output ".official-publication/locks/$VARIANT"
      - uses: actions/upload-artifact@v4
        with:
          name: publication-locks-${{ matrix.variant }}
          path: .official-publication/locks/${{ matrix.variant }}/*.pack-lock.json
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [sources, locks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-publication-inputs
          path: .official-publication
      - uses: actions/download-artifact@v4
        with:
          pattern: publication-locks-*
          merge-multiple: true
          path: .official-publication/locks
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - name: Validate the complete publication set without credentials
        shell: bash
        run: |
          arguments=()
          for base in .official-publication/bases/*/manifest.json; do arguments+=(--base-manifest "$base"); done
          for lock in .official-publication/locks/*.pack-lock.json; do arguments+=(--pack-lock "$lock"); done
          uv run --no-sync python -m scripts.publish_official_packs \
            --sources .official-publication/sources "${arguments[@]}" \
            --output .official-publication/preflight
      - name: Submit own-version packs to the official registry
        if: github.repository == 'Kosinkadink/Dinkster' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DINKSTER_REGISTRY_TOKEN: ${{ secrets.DINKSTER_REGISTRY_TOKEN }}
        run: |
          test -n "$DINKSTER_REGISTRY_TOKEN"
          arguments=()
          for base in .official-publication/bases/*/manifest.json; do arguments+=(--base-manifest "$base"); done
          for lock in .official-publication/locks/*.pack-lock.json; do arguments+=(--pack-lock "$lock"); done
          uv run --no-sync python -m scripts.publish_official_packs \
            --sources .official-publication/sources "${arguments[@]}" \
            --output .official-publication/submitted --publish
