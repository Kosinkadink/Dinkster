name: Independent official pack publication

on:
  workflow_dispatch:
    inputs:
      head:
        description: Full commit SHA on main with a successful published engine release
        required: true
        type: string
      recovery_artifact:
        description: Original official-publication-inputs artifact ID; reuse its wheels and same-run native locks
        required: false
        type: string
  workflow_run:
    workflows: ["Versioned wheel release"]
    types: [completed]
    branches: [main]
  push:
    tags: ["pack/**"]
  pull_request:
    paths:
      - .github/workflows/official-packs.yml
      - scripts/select_official_packs.py
      - scripts/prepare_official_publication.py
      - scripts/recover_official_publication.py
      - scripts/build_official_packs.py
      - scripts/build_release_pack_locks.py
      - scripts/publish_official_packs.py
      - scripts/check_disposable_publication.py
      - scripts/check_publication_controls.py
      - scripts/stage_publication_probe_index.py
      - scripts/base_bundles.json
      - packages/**/dinkster-pack.toml
      - packages/**/pyproject.toml

permissions:
  contents: read

concurrency:
  group: official-packs-${{ github.event_name == 'workflow_run' && 'main' || inputs.head || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  registry-service-image:
    name: Build disposable registry image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pinned registry service
        uses: actions/checkout@v4
        with:
          repository: Kosinkadink/dinkster-registry-service
          ref: 74cd369aec632cdd89a83732f164a8a1b8ef0000
          persist-credentials: false
          path: .disposable-registry-source
      - name: Build the unchanged service Dockerfile without publishing
        run: docker build --tag dinkster-disposable-registry:local .disposable-registry-source
      - name: Prepare publisher dependencies before isolation
        run: |
          docker build --tag dinkster-disposable-publisher:local - <<'DOCKER'
          FROM dinkster-disposable-registry:local
          USER root
          RUN uv pip install --python /app/.venv/bin/python dinkster-token-verifier==0.1.2
          DOCKER
          docker save dinkster-disposable-registry:local dinkster-disposable-publisher:local > disposable-images.tar
      - uses: actions/upload-artifact@v4
        with:
          name: disposable-registry-images
          path: disposable-images.tar
          compression-level: 0
          if-no-files-found: error

  select:
    if: (github.event_name != 'workflow_dispatch' || (github.repository == 'Kosinkadink/Dinkster' && github.ref == 'refs/heads/main')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'Kosinkadink/Dinkster'))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packs: ${{ steps.select.outputs.packs }}
      engine: ${{ steps.select.outputs.engine }}
      applicable: ${{ steps.select.outputs.applicable }}
      recovery_run: ${{ steps.continuation.outputs.recovery_run || steps.engine_release.outputs.recovery_run }}
      recovery_head: ${{ steps.continuation.outputs.recovery_head }}
      recovery_artifact: ${{ steps.continuation.outputs.recovery_artifact || inputs.recovery_artifact }}
      recovery_locks: ${{ steps.continuation.outputs.recovery_locks || steps.engine_release.outputs.recovery_locks }}
    steps:
      - name: Check whether the exact commit published an engine
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        id: engine_release
        uses: actions/github-script@v7
        with:
          script: |
            let runs = [context.payload.workflow_run];
            if (context.eventName === 'workflow_dispatch') {
              const head = context.payload.inputs.head;
              if (!/^[0-9a-f]{40}$/.test(head)) {
                throw new Error('Catch-up publication requires a full commit SHA');
              }
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${head}...main`,
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                throw new Error('Catch-up publication commit must belong to main');
              }
              runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id: 'release.yml', head_sha: head,
                branch: 'main', event: 'push', status: 'success', per_page: 100,
              });
              runs = runs.filter(run => run.head_sha === head && run.event === 'push'
                && run.head_branch === 'main' && run.conclusion === 'success'
                && run.head_repository.full_name === 'Kosinkadink/Dinkster');
            }
            let published = false;
            for (const run of runs) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, per_page: 100,
              });
              if (jobs.some(job => job.name === 'release' && job.conclusion === 'success')) {
                published = true;
                break;
              }
            }
            if (context.eventName === 'workflow_dispatch' && !published) {
              throw new Error('Catch-up publication requires a successful same-commit engine release');
            }
            const artifactId = context.payload.inputs?.recovery_artifact;
            if (context.eventName === 'workflow_dispatch' && artifactId) {
              if (!/^[1-9][0-9]*$/.test(artifactId) || !Number.isSafeInteger(Number(artifactId))) {
                throw new Error('Recovery requires an artifact ID');
              }
              const { data: artifact } = await github.rest.actions.getArtifact({
                ...context.repo, artifact_id: Number(artifactId),
              });
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: artifact.workflow_run.id,
              });
              if (artifact.name !== 'official-publication-inputs' || artifact.expired
                  || run.head_sha !== context.payload.inputs.head || run.head_branch !== 'main'
                  || run.head_repository.full_name !== 'Kosinkadink/Dinkster'
                  || run.path !== '.github/workflows/official-packs.yml'
                  || run.event !== 'workflow_run' || run.conclusion !== 'success') {
                throw new Error('Recovery requires original successful main publication inputs at head');
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: run.id, per_page: 100,
              });
              const locks = artifacts.filter(item => item.name.startsWith('publication-locks-'));
              if (!locks.length || locks.some(item => item.expired)
                  || new Set(locks.map(item => item.name)).size !== locks.length) {
                throw new Error('Recovery requires unexpired unique native lock artifacts');
              }
              core.setOutput('recovery_run', run.id);
              core.setOutput('recovery_locks', locks.map(item => item.id).join(','));
            }
            core.setOutput('published', published);
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev --package dinkster-registry --package dinkster-workers
      - name: Find validated interrupted main publication inputs
        id: continuation
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && steps.engine_release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m scripts.recover_official_publication --run "${{ github.run_id }}"
      - name: Select committed pack changes or an exact pack tag
        id: select
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PACK_TAG: ${{ startsWith(github.ref, 'refs/tags/pack/') && github.ref_name || '' }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ENGINE_PUBLISHED: ${{ steps.engine_release.outputs.published }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from scripts.select_official_packs import publication_selection, select_packs
          root = Path.cwd()
          tag = os.environ['PACK_TAG']
          event = os.environ['EVENT']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          before = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() if event == 'workflow_run' else os.environ['BEFORE']
          if event == 'workflow_run' and (os.environ['CONCLUSION'] != 'success' or os.environ['ENGINE_PUBLISHED'] != 'true'):
              print('No official packs published: same-commit engine release did not succeed')
              packs, applicable = (), False
          elif event == 'workflow_dispatch':
              packs, applicable = select_packs(root, before='0' * 40), True
          elif tag:
              packs, applicable = select_packs(root, tag=tag), True
          else:
              packs, applicable = publication_selection(root, before), True
          if event not in {'workflow_run', 'workflow_dispatch'}:
              print('Preflight uses candidate-head engine dependency pins; it does not claim a published engine release')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('packs=' + json.dumps(packs) + '\n')
              output.write('engine=' + head + '\n')
              output.write('applicable=' + str(applicable).lower() + '\n')
          PY

  sources:
    needs: select
    if: needs.select.outputs.packs != '[]' && needs.select.outputs.applicable == 'true' && !needs.select.outputs.recovery_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.engine }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev --package dinkster-registry --package dinkster-workers --package dinkster-supervisor
      - name: Prepare own-version sources and every supported base
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PACKS: ${{ needs.select.outputs.packs }}
          ENGINE_COMMIT: ${{ needs.select.outputs.engine }}
          CANDIDATE: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.prepare_official_publication import prepare_inputs
          root = Path.cwd()
          rows = prepare_inputs(root, root / '.official-publication', os.environ['ENGINE_COMMIT'], json.loads(os.environ['PACKS']), candidate=os.environ['CANDIDATE'] == 'true')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': rows}) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-publication-inputs
          path: |
            .official-publication/sources/
            .official-publication/bases/
            .official-publication/engine/
          include-hidden-files: true
          if-no-files-found: error

  recovery:
    needs: select
    if: needs.select.outputs.recovery_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.engine }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.select.outputs.recovery_artifact }}
          run-id: ${{ needs.select.outputs.recovery_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .official-publication
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.select.outputs.recovery_locks }}
          run-id: ${{ needs.select.outputs.recovery_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .official-publication/locks
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev --package dinkster-registry --package dinkster-workers
      - name: Refuse changed selected sources before continuing
        if: github.event_name == 'workflow_run'
        env:
          ORIGINAL_HEAD: ${{ needs.select.outputs.recovery_head }}
        run: uv run --no-sync python -m scripts.recover_official_publication --validate .official-publication --head "$ORIGINAL_HEAD"
      - uses: actions/upload-artifact@v4
        with:
          name: official-publication-inputs
          path: |
            .official-publication/sources/
            .official-publication/bases/
            .official-publication/engine/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: publication-locks-recovered
          path: .official-publication/locks/*.pack-lock.json
          include-hidden-files: true
          if-no-files-found: error

  locks:
    needs: [select, sources]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sources.outputs.matrix) }}
    steps:
      - name: Expose Git Bash on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bashDirectory = Join-Path $env:ProgramFiles 'Git/bin'
          if (-not (Test-Path (Join-Path $bashDirectory 'bash.exe') -PathType Leaf)) {
            throw 'Git Bash is required for the native pack lock build'
          }
          $bashDirectory >> $env:GITHUB_PATH
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.engine }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-publication-inputs
          path: .official-publication
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev --package dinkster-registry --package dinkster-workers --package dinkster-supervisor
      - name: Resolve native supported-base locks without rebuilding the engine
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          uv run --no-sync python -m scripts.build_release_pack_locks \
            --release .official-publication/engine --sources .official-publication/sources \
            --base-manifest ".official-publication/bases/$VARIANT/manifest.json" \
            --output ".official-publication/locks/$VARIANT"
      - uses: actions/upload-artifact@v4
        with:
          name: publication-locks-${{ matrix.variant }}
          path: .official-publication/locks/${{ matrix.variant }}/*.pack-lock.json
          include-hidden-files: true
          if-no-files-found: error

  probe-index:
    needs: [select, sources]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.engine }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-publication-inputs
          path: .official-publication
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev --package dinkster-registry --package dinkster-workers --package dinkster-supervisor
      - name: Stage the complete scanner dependency index
        run: uv run --no-sync python -m scripts.stage_publication_probe_index --sources .official-publication/sources --output .probe-index
      - name: Prepare publisher ordering and dependency controls before isolation
        run: uv run --no-sync python -m scripts.check_publication_controls prepare --bases .official-publication/bases --output .publication-controls
      - uses: actions/upload-artifact@v4
        with:
          name: disposable-probe-index
          path: .probe-index
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: disposable-publication-controls
          path: .publication-controls
          include-hidden-files: true
          if-no-files-found: error

  disposable-publication:
    needs: [select, sources, locks, registry-service-image, probe-index]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.engine }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-publication-inputs
          path: .official-publication
      - uses: actions/download-artifact@v4
        with:
          pattern: publication-locks-*
          merge-multiple: true
          path: .official-publication/locks
      - uses: actions/download-artifact@v4
        with:
          name: disposable-probe-index
          path: .probe-index
      - uses: actions/download-artifact@v4
        with:
          name: disposable-registry-images
          path: .disposable-images
      - uses: actions/download-artifact@v4
        with:
          name: disposable-publication-controls
          path: .publication-controls
      - name: Load prebuilt images without pulling
        run: docker load --input .disposable-images/disposable-images.tar
      - name: Check ordering, active replay and incompatible dependency refusal
        env:
          CUDA_VISIBLE_DEVICES: ""
          DINKSTER_ACCELERATOR: cpu
        run: |
          python3 -m scripts.check_publication_controls check \
            --fixtures .publication-controls \
            --service-image dinkster-disposable-registry:local \
            --publisher-image dinkster-disposable-publisher:local > disposable-controls.json
      - name: Publish selected candidates and verify active replay without external access
        env:
          CUDA_VISIBLE_DEVICES: ""
          DINKSTER_ACCELERATOR: cpu
        run: |
          python3 scripts/check_disposable_publication.py \
            --inputs .official-publication --package-index .probe-index \
            --service-image dinkster-disposable-registry:local \
            --publisher-image dinkster-disposable-publisher:local > disposable-publication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disposable-publication-result
          path: |
            disposable-controls.json
            disposable-publication.json
          if-no-files-found: error

  publish:
    needs: [select, sources, locks, recovery]
    if: always() && !cancelled() && needs.select.result == 'success' && (needs.recovery.result == 'success' || (needs.sources.result == 'success' && needs.locks.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.select.outputs.engine }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-publication-inputs
          path: .official-publication
      - uses: actions/download-artifact@v4
        with:
          pattern: publication-locks-*
          merge-multiple: true
          path: .official-publication/locks
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - name: Validate the complete publication set without credentials
        shell: bash
        env:
          CANDIDATE: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
        run: |
          arguments=()
          if [ "$CANDIDATE" != true ]; then arguments+=(--check-published); fi
          for base in .official-publication/bases/*/manifest.json; do arguments+=(--base-manifest "$base"); done
          for lock in .official-publication/locks/*.pack-lock.json; do arguments+=(--pack-lock "$lock"); done
          uv run --no-sync python -m scripts.publish_official_packs \
            --sources .official-publication/sources "${arguments[@]}" \
            --output .official-publication/preflight
      - name: Submit own-version packs to the official registry
        if: github.repository == 'Kosinkadink/Dinkster' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'Kosinkadink/Dinkster' && github.event.workflow_run.conclusion == 'success'))
        shell: bash
        env:
          DINKSTER_REGISTRY_TOKEN: ${{ secrets.DINKSTER_REGISTRY_TOKEN }}
        run: |
          if [ -z "$DINKSTER_REGISTRY_TOKEN" ]; then
            echo 'Official pack submission refused: DINKSTER_REGISTRY_TOKEN is unavailable' >&2
            exit 1
          fi
          arguments=()
          for base in .official-publication/bases/*/manifest.json; do arguments+=(--base-manifest "$base"); done
          for lock in .official-publication/locks/*.pack-lock.json; do arguments+=(--pack-lock "$lock"); done
          timeout --kill-after=30s 12m uv run --no-sync python -m scripts.publish_official_packs \
            --sources .official-publication/sources "${arguments[@]}" \
            --output .official-publication/submitted --publish
      - name: Record completed natural publication inputs
        if: github.event_name == 'workflow_run'
        run: printf '%s\n' '${{ needs.select.outputs.recovery_run || github.run_id }}' > .official-publication/completed-run
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: publication-completed-${{ needs.select.outputs.recovery_run || github.run_id }}
          path: .official-publication/completed-run
          if-no-files-found: error
