name: Registry default pack admission

on:
  workflow_run:
    workflows: ["Independent official pack publication"]
    types: [completed]
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: default-pack-admission-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  select:
    if: github.event_name == 'pull_request' || (github.repository == 'Kosinkadink/Dinkster' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'Kosinkadink/Dinkster' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      engine: ${{ steps.identity.outputs.engine }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require a successful publication job, not a skipped publication
        if: github.event_name == 'workflow_run'
        id: publication
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.payload.workflow_run.id, per_page: 100,
            });
            core.setOutput('published', jobs.some(job => job.name === 'publish' && job.conclusion === 'success'));
      - uses: actions/download-artifact@v4
        if: steps.publication.outputs.published == 'true'
        with:
          name: official-publication-inputs
          path: .publication
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select the engine bound to the publication inputs
        id: identity
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('engine', context.payload.pull_request.head.sha);
            } else if ('${{ steps.publication.outputs.published }}' === 'true') {
              const fs = require('fs');
              const engine = JSON.parse(fs.readFileSync('.publication/engine/release-manifest.json', 'utf8'));
              if (engine.repository !== 'Kosinkadink/Dinkster' || !/^[0-9a-f]{40}$/.test(engine.commit) || typeof engine.version !== 'string') {
                throw new Error('Publication must identify an exact engine commit and version');
              }
              core.setOutput('engine', engine.commit);
              core.setOutput('version', engine.version);
            }

  admission:
    needs: select
    if: needs.select.outputs.engine != ''
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ATEN_CPU_CAPABILITY: avx2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.engine }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: official-publication-inputs
          path: .publication
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Configure the same full Linux jail used by registry admission
        run: bash scripts/setup_probe_jail.sh
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install the engine under test on its published CPU base
        run: uv run --no-project python scripts/setup_envs.py --variant linux-cpu
      - name: Install the CPU software shader renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 libvulkan1 mesa-vulkan-drivers
          lvp=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$lvp"
          echo "VK_ICD_FILENAMES=$lvp" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
      - name: Resolve defaults and run the registry scanner in process
        env:
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha }}
          PUBLISHED_VERSION: ${{ needs.select.outputs.version }}
        run: |
          arguments=()
          if [ -n "$CANDIDATE_BASE" ]; then
            publication_changed=$(git diff --name-only "$CANDIDATE_BASE" HEAD -- .github/workflows/official-packs.yml)
            if [ -n "$publication_changed" ]; then
              CANDIDATE_BASE=0000000000000000000000000000000000000000
            fi
            arguments+=(--candidate-base "$CANDIDATE_BASE")
            version=$(uv run --no-sync python -c 'from pathlib import Path; from scripts.build_release import development_version; print(development_version(Path.cwd()))')
          else
            arguments+=(--published-sources .publication/sources/official-packs.lock)
            version="$PUBLISHED_VERSION"
          fi
          uv run --no-sync python -m scripts.check_default_pack_admission \
            --engine-version "$version" "${arguments[@]}"
