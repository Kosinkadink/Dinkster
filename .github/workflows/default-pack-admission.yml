name: Registry default pack admission

on:
  workflow_run:
    workflows: ["Independent official pack publication"]
    types: [completed]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/default-pack-admission.yml
      - scripts/check_default_pack_admission.py
      - scripts/prepare_admission_engine.py
      - scripts/run_selected_pack_tests.py
      - scripts/_selected_pack_test_child.py
      - scripts/setup_probe_jail.sh
      - packages/dinkster-registry/src/dinkster_registry/*admission.py
      - packages/dinkster-workers/src/dinkster_workers/pack_wheel.py
      - packages/dinkster-workers/src/dinkster_workers/sandbox*
      - packages/dinkster-workers/src/dinkster_workers/doctor*
      - tests/test_archive_admission.py
      - tests/test_pack_archive.py
      - tests/test_pack_wheel.py
      - tests/test_sandbox.py
      - tests/test_doctor.py

permissions:
  contents: read

concurrency:
  group: default-pack-admission-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.repository == 'Kosinkadink/Dinkster' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'Kosinkadink/Dinkster' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      engine: ${{ steps.identity.outputs.engine }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require a successful publication job, not a skipped publication
        if: github.event_name == 'workflow_run'
        id: publication
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.payload.workflow_run.id, per_page: 100,
            });
            core.setOutput('published', jobs.some(job => job.name === 'publish' && job.conclusion === 'success'));
      - uses: actions/download-artifact@v4
        if: steps.publication.outputs.published == 'true'
        with:
          name: official-publication-inputs
          path: .publication
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select the engine bound to the publication inputs
        id: identity
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('engine', context.payload.pull_request.head.sha);
            } else if ('${{ steps.publication.outputs.published }}' === 'true') {
              const fs = require('fs');
              const engine = JSON.parse(fs.readFileSync('.publication/engine/release-manifest.json', 'utf8'));
              if (engine.repository !== 'Kosinkadink/Dinkster' || !/^[0-9a-f]{40}$/.test(engine.commit) || typeof engine.version !== 'string') {
                throw new Error('Publication must identify an exact engine commit and version');
              }
              core.setOutput('engine', engine.commit);
              core.setOutput('version', engine.version);
            }

  prepare:
    needs: select
    if: needs.select.outputs.engine != ''
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      groups: ${{ steps.sources.outputs.groups }}
    env:
      ATEN_CPU_CAPABILITY: avx2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      CUDA_VISIBLE_DEVICES: ""
      DINKSTER_ACCELERATOR: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.engine }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: official-publication-inputs
          path: .publication
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Prepare contributor admission tooling
        run: uv run --no-project python scripts/develop.py setup --variant linux-cpu --yes
      - name: Acquire the engine's exact published CPU base manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_id=$(jq -r '.["linux-cpu"]' scripts/base_bundles.json)
          python scripts/develop.py run -- python -m scripts.acquire_engine_bases \
            --tag "base-linux-cpu-$base_id" --output .run/admission-bases
      - name: Resolve immutable default sources for every admission group
        id: sources
        env:
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha }}
          PUBLISHED_VERSION: ${{ needs.select.outputs.version }}
        run: |
          arguments=()
          if [ -n "$CANDIDATE_BASE" ]; then
            publication_changed=$(git diff --name-only "$CANDIDATE_BASE" HEAD -- .github/workflows/official-packs.yml)
            if [ -n "$publication_changed" ]; then
              CANDIDATE_BASE=0000000000000000000000000000000000000000
            fi
            arguments+=(--candidate-base "$CANDIDATE_BASE")
            version=$(python scripts/develop.py run -- python -c 'from pathlib import Path; from scripts.build_release import development_version; print(development_version(Path.cwd()))')
          else
            arguments+=(--published-sources .publication/sources/official-packs.lock)
            version="$PUBLISHED_VERSION"
          fi
          python scripts/develop.py run -- python -m scripts.prepare_admission_engine \
            --output admission-runtime --store .run/environment-store \
            --base-manifest .run/admission-bases/linux-cpu/manifest.json --engine-version "$version"
          python scripts/develop.py run -- python -m scripts.check_default_pack_admission \
            --engine-version "$version" "${arguments[@]}" \
            --runtime admission-runtime --prepare-output admission-sources | tee admission-preparation.log
          cp -r admission-runtime/engine admission-sources/engine
          cp admission-runtime/base-manifest.json admission-sources/base-manifest.json
          python scripts/develop.py run -- python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          result = json.loads(Path("admission-preparation.log").read_text().splitlines()[-1])
          groups = [
              {"group": index + 1, "packs": json.dumps(packs)}
              for index, packs in enumerate(result["groups"])
          ]
          print("groups=" + json.dumps(groups))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: default-admission-sources
          path: admission-sources
          include-hidden-files: true
          retention-days: 1

  admission:
    name: admission (group ${{ matrix.group }})
    needs: [select, prepare]
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.groups) }}
    env:
      ATEN_CPU_CAPABILITY: avx2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      CUDA_VISIBLE_DEVICES: ""
      DINKSTER_ACCELERATOR: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.engine }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: default-admission-sources
          path: admission-sources
      - name: Configure the same full Linux jail used by registry admission
        run: bash scripts/setup_probe_jail.sh
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Prepare contributor admission tooling
        run: uv run --no-project python scripts/develop.py setup --variant linux-cpu --yes
      - name: Provision the exact prepared engine on the verified pinned base
        run: |
          version=$(jq -j '.engineVersion' admission-sources/engine.json)
          python scripts/develop.py run -- python -m scripts.prepare_admission_engine \
            --output admission-runtime --store .run/environment-store \
            --base-manifest admission-sources/base-manifest.json \
            --engine-source admission-sources/engine --engine-version "$version"
      - name: Install the CPU software shader renderer
        uses: ./.github/actions/torch-cpu-suite/renderer-setup
        timeout-minutes: 5
      - name: Admit and test this group against the complete verified catalog
        env:
          TEST_PACKS: ${{ matrix.packs }}
        run: |
          arguments=()
          while IFS= read -r -d '' name; do
            arguments+=(--pack "$name")
          done < <(jq -j '.[] + "\u0000"' <<< "$TEST_PACKS")
          version=$(jq -j '.engineVersion' admission-sources/engine.json)
          python scripts/develop.py run -- python -m scripts.check_default_pack_admission \
            --engine-version "$version" --runtime admission-runtime \
            --prepared-sources admission-sources "${arguments[@]}"
