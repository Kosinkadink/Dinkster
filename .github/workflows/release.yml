name: Versioned wheel release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: wheel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/configure-private-repository
        with:
          repository: Kosinkadink/Dinkster-Frontend
          deploy-key: ${{ secrets.DINKSTER_FRONTEND_READ_KEY }}
      - name: Select the pinned frontend source
        id: frontend
        run: |
          echo "ref=$(python3 -c 'import json; print(json.load(open("scripts/release_sources.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          clean: true
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ steps.frontend.outputs.ref }}
          path: .release/frontend
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .release/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .release/frontend
      - run: pnpm --filter @dinkster/app build
        working-directory: .release/frontend
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the complete release contract
        run: |
          uv run --no-project --python 3.12 scripts/build_release.py \
            --tag "$GITHUB_REF_NAME" \
            --frontend-root .release/frontend \
            --frontend-dist .release/frontend/packages/app/dist
          uvx twine check dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-release
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            labels: [self-hosted, linux, x64]
          - os: windows
            labels: [self-hosted, windows, x64]
          - os: macos
            labels: [self-hosted, macos, arm64]
    steps:
      - name: Expose Git Bash on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bashDirectory = Join-Path $env:ProgramFiles 'Git/bin'
          if (-not (Test-Path (Join-Path $bashDirectory 'bash.exe') -PathType Leaf)) {
            throw 'Git Bash is required for the release install check'
          }
          $bashDirectory >> $env:GITHUB_PATH
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wheel-release
          path: ${{ runner.temp }}/dinkster-release
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install and launch from wheels
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/dinkster-release-venv"
          python="$RUNNER_TEMP/dinkster-release-venv/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then
            python="$RUNNER_TEMP/dinkster-release-venv/Scripts/python.exe"
          fi
          uv pip install --python "$python" \
            --no-deps \
            --require-hashes \
            --find-links "$RUNNER_TEMP/dinkster-release" \
            --requirement "$RUNNER_TEMP/dinkster-release/constraints.txt"
          "$python" -m dinkster.cli --help
          "$python" -c "from dinkster_frontend import bundle_path; assert bundle_path().joinpath('index.html').is_file()"

  release:
    needs: install
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-release
          path: dist
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: context.ref.replace('refs/tags/', '') });
              core.setFailed('Refusing to overwrite an existing release');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
