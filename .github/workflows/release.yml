name: Versioned wheel release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build_release.py
      - scripts/build_official_packs.py
      - scripts/acquire_engine_bases.py
      - scripts/base_bundles.json
      - scripts/prune_engine_prereleases.py
      - scripts/download_frontend.py
      - scripts/release_sources.json
      - scripts/verify_release_install.py
      - packages/dinkster-supervisor/**
      - src/dinkster/frontend.py
      - tests/test_environment_archives.py
      - tests/test_environment_generations.py
      - tests/test_release_install.py
      - tests/test_frontend_artifact.py

permissions:
  contents: read

concurrency:
  group: wheel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validation
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Download the pinned frontend bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 scripts/download_frontend.py --output .release/frontend.zip
      - name: Acquire the selected published base manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python 3.12 --with packaging==26.2 python - <<'PY'
          import json
          from pathlib import Path
          from scripts.acquire_engine_bases import acquire

          root = Path.cwd()
          selections = json.loads((root / 'scripts/base_bundles.json').read_text())
          acquire(root, [f'base-{variant}-{identity}' for variant, identity in selections.items()],
                  root / '.release/base-manifests')
          PY
      - name: Build the complete release contract
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          UV_PROJECT_ENVIRONMENT: .release/pack-builder
        run: |
          arguments=()
          if [ -n "$RELEASE_TAG" ]; then arguments+=(--tag "$RELEASE_TAG"); fi
          uv sync --locked --no-dev --package dinkster-registry --package dinkster-workers
          "$UV_PROJECT_ENVIRONMENT/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from scripts.build_official_packs import build
          from scripts.build_release import development_version, release_version
          root = Path.cwd()
          tag = os.environ['RELEASE_TAG']
          version = release_version(root, tag) if tag else development_version(root)
          build(root, root / '.release/official-packs', version=version.split('+', 1)[0])
          PY
          for payload in .release/official-packs/*; do arguments+=(--artifact "$payload"); done
          for manifest in .release/base-manifests/*/manifest.json; do
            arguments+=(--base-manifest "$manifest" --target-variant "$(basename "$(dirname "$manifest")")")
          done
          uv run --no-project --python 3.12 --with packaging==26.2 -m scripts.build_release \
            "${arguments[@]}" \
            --download-external-wheels \
            --frontend-artifact .release/frontend.zip
          uvx twine check dist/*.whl
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-release
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            python: "3.14.10"
          - os: windows
            runner: windows-latest
            python: "3.14.10"
          - os: macos
            runner: macos-latest
            python: "3.12"
    steps:
      - name: Expose Git Bash on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bashDirectory = Join-Path $env:ProgramFiles 'Git/bin'
          if (-not (Test-Path (Join-Path $bashDirectory 'bash.exe') -PathType Leaf)) {
            throw 'Git Bash is required for the release install check'
          }
          $bashDirectory >> $env:GITHUB_PATH
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wheel-release
          path: ${{ runner.temp }}/dinkster-release
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install and launch from wheels
        shell: bash
        env:
          RELEASE_PYTHON: ${{ matrix.python }}
        run: |
          uv venv --seed --python "$RELEASE_PYTHON" "$RUNNER_TEMP/dinkster-release-venv"
          python="$RUNNER_TEMP/dinkster-release-venv/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then
            python="$RUNNER_TEMP/dinkster-release-venv/Scripts/python.exe"
          fi
          "$python" -m pip install \
            --require-hashes \
            --find-links "$RUNNER_TEMP/dinkster-release" \
            --requirement "$RUNNER_TEMP/dinkster-release/constraints.txt"
          "$python" -m pip check
          "$python" -m dinkster.cli --help
          "$python" -c "from dinkster.frontend import discover_frontend_bundle; assert discover_frontend_bundle() is not None"
          "$python" scripts/verify_release_install.py "$GITHUB_WORKSPACE" --python "$python" --require-frontend
      - name: Verify streaming base extraction on the host filesystem
        shell: bash
        run: |
          uv sync --locked --all-packages
          uv run --locked python -m pytest -q tests/test_environment_archives.py

  release:
    needs: install
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      engine-id: ${{ steps.identity.outputs.engine-id }}
      engine-tag: ${{ steps.identity.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wheel-release
          path: dist
      - uses: actions/github-script@v7
        id: identity
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const bytes = fs.readFileSync('dist/release-manifest.json');
            const manifest = JSON.parse(bytes.toString('utf8'));
            if (manifest.commit !== context.sha) throw new Error('Release commit mismatch');
            core.setOutput('engine-id', 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex'));
            core.setOutput('tag', manifest.tag);
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: manifest.tag });
              core.setFailed('Refusing to overwrite an existing release');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.identity.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          make_latest: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
      - name: Keep the newest main prereleases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune_engine_prereleases.py

  publish:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dinkster/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-release
          path: dist
      - name: Select the engine distribution
        run: |
          mkdir publish
          cp dist/dinkster-[0-9]*.whl publish/
      - name: Publish the engine with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
          skip-existing: true

  publish-api:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi-dinkster-api
      url: https://pypi.org/project/dinkster-api/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-release
          path: dist
      - name: Select the API distribution
        run: |
          mkdir publish
          cp dist/dinkster_api-[0-9]*.whl publish/
      - name: Publish the API with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
          skip-existing: true

  publish-supervisor:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi-dinkster-supervisor
      url: https://pypi.org/project/dinkster-supervisor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-release
          path: dist
      - name: Select the supervisor distribution
        run: |
          mkdir publish
          cp dist/dinkster_supervisor-[0-9]*.whl publish/
      - name: Publish the release wheels with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
          skip-existing: true
