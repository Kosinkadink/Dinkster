name: Versioned wheel release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/release.yml
      - scripts/build_release.py
      - scripts/build_environment_tools.py
      - scripts/build_native_tools.py
      - scripts/publish_environment_channel.py
      - scripts/acquire_engine_bases.py
      - scripts/base_bundles.json
      - scripts/download_frontend.py
      - scripts/release_sources.json
      - scripts/verify_release_launch.py
      - scripts/verify_pack_testing.py
      - packages/dinkster-engine/**
      - packages/dinkster-api/**
      - tests/fixtures/pack-testing/**
      - packages/dinkster-supervisor/**
      - src/dinkster/frontend.py
      - tests/test_environment_archives.py
      - tests/test_environment_tools.py
      - tests/test_environment_generations.py
      - tests/test_release_install.py
      - tests/test_frontend_artifact.py

permissions:
  contents: read

concurrency:
  group: wheel-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.inputs.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Select engine publication inputs
        id: inputs
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          uv run --no-project --python 3.12 python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          from scripts.build_release import inputs_changed
          changed = os.environ['VERSION_TAG'] == 'true' or inputs_changed(Path.cwd(), os.environ['BEFORE'])
          print(f'engine={str(changed).lower()}')
          PY

  validation:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  build:
    needs: [changes, validation]
    if: always() && !cancelled() && needs.changes.outputs.engine == 'true' && (needs.validation.result == 'success' || (needs.validation.result == 'skipped' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))))
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Download the pinned frontend bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 scripts/download_frontend.py --output .release/frontend.zip
      - name: Acquire the selected published base manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python 3.12 --with packaging==26.2 python - <<'PY'
          import json
          from pathlib import Path
          from scripts.acquire_engine_bases import acquire

          root = Path.cwd()
          selections = json.loads((root / 'scripts/base_bundles.json').read_text())
          acquire(root, [f'base-{variant}-{identity}' for variant, identity in selections.items()],
                  root / '.release/base-manifests')
          PY
      - name: Build the complete release contract
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          arguments=()
          if [ -n "$RELEASE_TAG" ]; then arguments+=(--tag "$RELEASE_TAG"); fi
          for manifest in .release/base-manifests/*/manifest.json; do
            arguments+=(--base-manifest "$manifest")
          done
          uv run --no-project --python 3.12 --with packaging==26.2 -m scripts.build_release \
            "${arguments[@]}" \
            --frontend-artifact .release/frontend.zip
          uvx twine check dist/*.whl
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Test the public pack helper from built wheels without torch
        run: uv run --no-project --python 3.12 scripts/verify_pack_testing.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-release
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: selected-base-manifests
          path: .release/base-manifests/
          if-no-files-found: error

  finalize:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: selected-base-manifests
          path: .release/bases
      - name: Enforce finalized release contents and size
        run: |
          uv sync --locked --no-dev --package dinkster-supervisor
          uv run --no-project --python .venv python -m scripts.build_release --check --max-bytes 100000000
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: engine-release
          path: dist/
          if-no-files-found: error
      - name: Validate the channel against the finalized release
        env:
          CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'main' }}
        run: |
          arguments=()
          for manifest in .release/bases/*/manifest.json; do arguments+=(--base-manifest "$manifest"); done
          uv run --no-project --python .venv python -m dinkster_supervisor.environment_channels \
            --release dist "${arguments[@]}" --channel "$CHANNEL" \
            --output-root .release/channel --minimum-desktop-version 0.2.0
      - uses: actions/upload-artifact@v4
        with:
          name: environment-channel
          path: .release/channel/channels/*.json
          if-no-files-found: error

  install:
    needs: finalize
    if: ${{ !cancelled() && needs.finalize.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            python: "3.14.10"
          - os: windows
            runner: windows-latest
            python: "3.14.10"
          - os: macos
            runner: macos-latest
            python: "3.12"
    steps:
      - name: Expose Git Bash on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bashDirectory = Join-Path $env:ProgramFiles 'Git/bin'
          if (-not (Test-Path (Join-Path $bashDirectory 'bash.exe') -PathType Leaf)) {
            throw 'Git Bash is required for the release install check'
          }
          $bashDirectory >> $env:GITHUB_PATH
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: ${{ runner.temp }}/dinkster-release
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: ./.github/actions/windows-python
        if: runner.os == 'Windows'
      - name: Install and launch from wheels
        shell: bash
        env:
          RELEASE_PYTHON: ${{ matrix.python }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then RELEASE_PYTHON="$UV_PYTHON"; fi
          uv venv --seed --python "$RELEASE_PYTHON" "$RUNNER_TEMP/dinkster-release-venv"
          python="$RUNNER_TEMP/dinkster-release-venv/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then
            python="$RUNNER_TEMP/dinkster-release-venv/Scripts/python.exe"
          fi
          uv pip install --python "$python" \
            --require-hashes \
            --find-links "$RUNNER_TEMP/dinkster-release" \
            --requirement "$RUNNER_TEMP/dinkster-release/constraints.txt"
          "$python" -m pip check
          "$python" -m dinkster.cli --help
          "$python" -c "from dinkster.frontend import discover_frontend_bundle; assert discover_frontend_bundle() is not None"
          "$python" scripts/verify_release_launch.py "$GITHUB_WORKSPACE" --python "$python" --require-frontend
      - name: Verify streaming base extraction on the host filesystem
        shell: bash
        run: |
          uv sync --locked --all-packages
          uv run --locked python -m pytest -q tests/test_environment_archives.py

  release:
    needs: install
    if: ${{ !cancelled() && needs.install.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      engine-id: ${{ steps.identity.outputs.engine-id }}
      engine-tag: ${{ steps.identity.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: dist
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Refuse engine hash8 collisions before uploading release assets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          uv sync --locked --only-group release-publication
          uv run --no-project --python .venv python -m scripts.publish_environment_channel --release dist --preflight
      - uses: actions/github-script@v7
        id: identity
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const bytes = fs.readFileSync('dist/release-manifest.json');
            const manifest = JSON.parse(bytes.toString('utf8'));
            if (manifest.commit !== context.sha) throw new Error('Release commit mismatch');
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            const tag = manifest.label
              ? (context.ref.startsWith('refs/tags/v') ? `v${manifest.version}` : `main-${manifest.label}-${digest.slice(0, 8)}`)
              : manifest.tag;
            core.setOutput('engine-id', 'sha256:' + digest);
            core.setOutput('tag', tag);
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              throw new Error('Refusing to overwrite an existing release');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let object;
            try {
              const result = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              object = result.data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
              // Git push tags an already reachable commit without introducing workflow changes.
              require('child_process').execFileSync('git', [
                'push', 'origin', `${context.sha}:refs/tags/${tag}`,
              ], { stdio: 'inherit' });
              // A successful non-force push confirms this exact commit without a REST visibility race.
              object = { type: 'commit', sha: context.sha };
            }
            while (object.type === 'tag') {
              const result = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha });
              object = result.data.object;
            }
            if (object.type !== 'commit' || object.sha !== context.sha) {
              throw new Error('Existing release tag targets a different commit');
            }
            // An existing tag makes target_commitish unnecessary, avoiding its workflow permission check.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.identity.outputs.tag }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          make_latest: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  channel:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: environment-channel-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kosinkadink/Dinkster-Environments
          ref: 022b8234976065d0d3344a9717dd150ec6347bfa
          path: .release/retention
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: selected-base-manifests
          path: .release/bases
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Mirror payloads and publish the verified channel last
        env:
          CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'main' }}
          GITHUB_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          uv sync --locked --only-group release-publication
          arguments=()
          for manifest in .release/bases/*/manifest.json; do arguments+=(--base-manifest "$manifest"); done
          uv run --no-project --python .venv python .release/retention/retention.py \
            --command python -m scripts.publish_environment_channel \
            --release dist "${arguments[@]}" --channel "$CHANNEL" --minimum-desktop-version 0.2.0
      - name: Retain engine releases after verified channel publication
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: uv run --no-project --python .venv python .release/retention/retention.py --scope engine --old-naming --output retention-report.json
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          name: release-retention
          path: retention-report.json
          if-no-files-found: error

  publish:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dinkster/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: dist
      - name: Select the engine distribution
        run: |
          mkdir publish
          cp dist/dinkster-[0-9]*.whl publish/
      - name: Publish the engine with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
          skip-existing: true

  publish-api:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-dinkster-api
      url: https://pypi.org/project/dinkster-api/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: dist
      - name: Select the API distribution
        run: |
          mkdir publish
          cp dist/dinkster_api-[0-9]*.whl publish/
      - name: Publish the API with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
          skip-existing: true

  publish-engine:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-dinkster-engine
      url: https://pypi.org/project/dinkster-engine/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: dist
      - name: Select the execution engine distribution
        run: |
          mkdir publish
          cp dist/dinkster_engine-[0-9]*.whl publish/
      - name: Publish the execution engine with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
          skip-existing: true

  publish-supervisor:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-dinkster-supervisor
      url: https://pypi.org/project/dinkster-supervisor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-release
          path: dist
      - name: Select the supervisor distribution
        run: |
          mkdir publish
          cp dist/dinkster_supervisor-[0-9]*.whl publish/
      - name: Publish the release wheels with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/
          skip-existing: true
