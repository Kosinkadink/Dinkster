name: Versioned wheel release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build_release.py
      - scripts/download_frontend.py
      - scripts/verify_release_install.py
      - scripts/release_sources.json
      - src/dinkster/frontend.py
      - tests/test_release_install.py
      - tests/test_frontend_artifact.py

permissions:
  contents: read

concurrency:
  group: wheel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validation
    permissions:
      actions: read
      contents: read
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Download the pinned frontend bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 scripts/download_frontend.py --output .release/frontend.zip
      - name: Build the complete release contract
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          uv run --no-project --python 3.12 -m scripts.build_release \
            --tag "$RELEASE_TAG" \
            --frontend-artifact .release/frontend.zip
          uvx twine check dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-release
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[matrix.runner] }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: linux
          - os: windows
            runner: windows
          - os: macos
            runner: macos
    steps:
      - name: Expose Git Bash on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bashDirectory = Join-Path $env:ProgramFiles 'Git/bin'
          if (-not (Test-Path (Join-Path $bashDirectory 'bash.exe') -PathType Leaf)) {
            throw 'Git Bash is required for the release install check'
          }
          $bashDirectory >> $env:GITHUB_PATH
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wheel-release
          path: ${{ runner.temp }}/dinkster-release
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install and launch from wheels
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/dinkster-release-venv"
          python="$RUNNER_TEMP/dinkster-release-venv/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then
            python="$RUNNER_TEMP/dinkster-release-venv/Scripts/python.exe"
          fi
          uv pip install --python "$python" \
            --no-deps \
            --require-hashes \
            --find-links "$RUNNER_TEMP/dinkster-release" \
            --requirement "$RUNNER_TEMP/dinkster-release/constraints.txt"
          "$python" -m dinkster.cli --help
          "$python" -c "from dinkster_frontend import bundle_path; assert bundle_path().joinpath('index.html').is_file()"
          "$python" scripts/verify_release_install.py "$GITHUB_WORKSPACE" --python "$python" --require-frontend

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: install
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-release
          path: dist
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: context.ref.replace('refs/tags/', '') });
              core.setFailed('Refusing to overwrite an existing release');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
