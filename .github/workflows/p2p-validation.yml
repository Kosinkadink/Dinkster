name: optional-p2p-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2p-descriptor-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages --extra p2p
      - run: uv run --locked --extra p2p pytest --p2p -q tests/test_p2p_descriptor.py

  p2p-artifact-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra p2p
      - run: uv run --locked --extra p2p pytest --p2p -q tests/test_p2p_artifact_smoke.py

  p2p-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --extra p2p
      - run: uv run --locked --extra p2p pytest --p2p -q tests/test_*p2p*.py tests/test_seed_service*.py
