name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      simulate-fork:
        description: Run the fork pull-request policy without repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: format, lint, types and unit subset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Configure and verify the Linux probe jail
        run: bash scripts/setup_probe_jail.sh
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages
      - name: Install the pinned inference package
        run: |
          requirement=$(uv run --no-sync python tools/verify_pinned_inference.py --print-requirement)
          uv pip install --python .venv/bin/python --no-deps "$requirement"
      - name: Verify pinned inference APIs
        run: uv run --no-sync python tools/verify_pinned_inference.py
      - run: bash scripts/ci-fast.sh
