name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_call:
  workflow_dispatch:
    inputs:
      simulate-fork:
        description: Run the fork pull-request policy without repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format, lint, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      engine: ${{ steps.paths.outputs.engine }}
      packs: ${{ steps.paths.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed-path test lanes
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python tools/ci_selection.py --base "$BASE"
      - uses: astral-sh/setup-uv@v5
        if: steps.paths.outputs.docs != 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv run --no-project python scripts/develop.py setup --variant linux-cpu --yes
          python scripts/develop.py stop --yes
        if: steps.paths.outputs.docs != 'true'
      - run: bash scripts/ci-fast.sh checks
        if: steps.paths.outputs.docs != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  contributor-setup:
    needs: checks
    if: ${{ needs.checks.outputs.engine == 'true' && inputs.simulate-fork != true && (github.workflow != 'ci' || github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: main contributor setup (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "/usr/bin/python3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      DINKSTER_ACCELERATOR: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
          coverage: "false"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/prepare-contributor-generation
        with:
          python: ${{ matrix.python }}
      - name: Verify the evidence fixture and generation tools
        env:
          REQUIRE_MANAGED_MARKER: ${{ matrix.python == '/usr/bin/python3.12' }}
        run: |
          python scripts/develop.py run -- python - <<'PY'
          import os
          import pathlib
          import sys
          import sysconfig
          import dinkster_acceptance
          import torch
          assert sys.version_info[:2] == (3, 12)
          assert pathlib.Path(dinkster_acceptance.__file__).is_relative_to(sys.prefix)
          assert pathlib.Path(dinkster_acceptance.manifest_path()).is_file()
          assert torch.__version__.endswith('+cpu') and torch.version.cuda is None
          print('Generation fixture import and CPU torch passed')
          marker = pathlib.Path(sysconfig.get_path('stdlib')) / 'EXTERNALLY-MANAGED'
          if os.environ['REQUIRE_MANAGED_MARKER'] == 'true':
              assert marker.is_file()
          print('Externally managed:', marker.exists())
          PY
          python scripts/develop.py run -- ruff --version
          python scripts/develop.py run -- python -m pytest -q -n0 \
            tests/test_environment_runtime.py::test_run_uses_active_interpreter_and_preserves_command_io_and_exit \
            tests/test_environment_cli.py::test_setup_plan_labels_cached_channel_without_mutating_project_or_store \
            tests/test_environment_cli.py::test_development_plan_fingerprints_sources_and_refuses_changed_approval

  tests:
    needs: checks
    # Reusable calls retain the caller's workflow name and existing job selection.
    if: ${{ !cancelled() && (github.workflow != 'ci' || github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: tests
    runs-on: ubuntu-latest
    # Hosted pytest has taken 24m21s before catalog export and frontend decode.
    # Keep three times the exhausted 25-minute budget for the complete gate.
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Require successful path selection and checks
        run: |
          test '${{ needs.checks.result }}' = success
      - uses: actions/checkout@v4
        if: needs.checks.outputs.docs != 'true'
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        if: needs.checks.outputs.docs != 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv run --no-project python scripts/develop.py setup --variant linux-cpu --yes
          python scripts/develop.py stop --yes
        if: needs.checks.outputs.docs != 'true'
      - name: Verify the Linux generation uses CPU torch
        if: needs.checks.outputs.docs != 'true'
        run: |
          python scripts/develop.py run -- python - <<'PY'
          from importlib.metadata import distributions
          import torch
          import torchvision
          print(f"torch {torch.__version__}, CUDA {torch.version.cuda}; torchvision {torchvision.__version__}")
          assert torch.__version__.endswith('+cpu') and torch.version.cuda is None
          assert torchvision.__version__.endswith('+cpu')
          assert not any(
              distribution.metadata['Name'].lower().startswith(('nvidia-', 'triton'))
              for distribution in distributions()
          )
          PY
      - name: Provision the wheel build backend before offline validation
        if: needs.checks.outputs.engine == 'true'
        run: uv build --package dinkster-supervisor --wheel --out-dir "$RUNNER_TEMP/fast-build-setup"
      - name: Provision installed-wheel host dependencies before offline validation
        if: needs.checks.outputs.engine == 'true'
        run: |
          for package in dinkster dinkster-api dinkster-engine; do
            uv build --package "$package" --wheel --out-dir "$RUNNER_TEMP/fast-build-setup"
          done
          execution_python=$(python scripts/develop.py run -- python -c 'import sys; print(sys.executable)')
          uv venv --python "$execution_python" "$RUNNER_TEMP/fast-wheel-host"
          uv pip install --python "$RUNNER_TEMP/fast-wheel-host/bin/python" --no-sources "$RUNNER_TEMP/fast-build-setup/"*.whl
      - name: Verify pinned inference APIs
        if: needs.checks.outputs.engine == 'true'
        run: python scripts/develop.py run -- python tools/verify_pinned_inference.py
      - name: Create a disposable XFS clone-test volume
        if: needs.checks.outputs.engine == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xfsprogs
          image=$(mktemp "$RUNNER_TEMP/clone-proof-XXXXXX.img")
          volume=$(mktemp -d "$RUNNER_TEMP/clone-proof-XXXXXX")
          truncate -s 2G "$image"
          mkfs.xfs -f -m reflink=1 "$image"
          sudo mount -o loop "$image" "$volume"
          sudo chown "$(id -u):$(id -g)" "$volume"
          echo "DINKSTER_CLONE_TEST_ROOT=$volume" >> "$GITHUB_ENV"
          echo 'DINKSTER_REQUIRE_REAL_CLONES=1' >> "$GITHUB_ENV"
      - name: Install the CPU software shader renderer
        if: needs.checks.outputs.engine == 'true'
        uses: ./.github/actions/torch-cpu-suite/renderer-setup
      - run: bash scripts/ci-fast.sh tests
        if: needs.checks.outputs.engine == 'true'
        env:
          CUDA_VISIBLE_DEVICES: ""
          DINKSTER_ACCELERATOR: cpu
      - name: Export the published default catalog
        if: needs.checks.outputs.engine == 'true'
        run: python scripts/develop.py run -- python scripts/export_default_catalog.py "$RUNNER_TEMP/default-catalog.json"
        env:
          CUDA_VISIBLE_DEVICES: ""
      - name: Read the pinned frontend revision
        if: needs.checks.outputs.engine == 'true'
        id: frontend
        run: |
          python scripts/develop.py run -- python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/full-validation.yml').read_text())
          print(f"ref={workflow['env']['FRONTEND_REF']}")
          PY
      - uses: actions/checkout@v4
        if: needs.checks.outputs.engine == 'true'
        with:
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ steps.frontend.outputs.ref }}
          path: .frontend-validation
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: needs.checks.outputs.engine == 'true'
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@v4
        if: needs.checks.outputs.engine == 'true'
        with:
          package_json_file: .frontend-validation/package.json
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Decode the default catalog with the pinned frontend
        if: needs.checks.outputs.engine == 'true'
        working-directory: .frontend-validation
        run: |
          pnpm install --frozen-lockfile --filter @dinkster/core... --filter .
          node --test ../tools/validate_default_catalog.test.mjs
          pnpm exec tsx ../tools/validate_default_catalog.mjs "$CATALOG" .
        env:
          CATALOG: ${{ runner.temp }}/default-catalog.json
