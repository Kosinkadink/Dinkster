name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_call:
  workflow_dispatch:
    inputs:
      simulate-fork:
        description: Run the fork pull-request policy without repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format, lint, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      engine: ${{ steps.paths.outputs.engine }}
      runtime: ${{ steps.paths.outputs.runtime }}
      packs: ${{ steps.paths.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed-path test lanes
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python tools/ci_selection.py --base "$BASE"
      - uses: astral-sh/setup-uv@v5
        if: steps.paths.outputs.docs != 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages
        if: steps.paths.outputs.docs != 'true'
      - run: bash scripts/ci-fast.sh checks
        if: steps.paths.outputs.docs != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  torch-cpu:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    name: CPU comfy gate (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ATEN_CPU_CAPABILITY: avx2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the CPU software shader renderer
        uses: ./.github/actions/torch-cpu-suite/renderer-setup
        timeout-minutes: 5
      - uses: ./.github/actions/torch-cpu-suite
        with:
          suite: comfy
          comfy-pytest-args: -p tools.pytest_file_shard --file-shard ${{ matrix.shard }}/4

  windows-runtime:
    needs: checks
    if: (github.workflow != 'ci' || github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.checks.outputs.runtime == 'true'
    name: Windows SQLite runtime and durable delegations
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: ./.github/actions/windows-python
      - run: uv sync --locked --all-packages
      - name: Create a disposable ReFS clone-test volume
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = Join-Path $env:RUNNER_TEMP "clone-proof-$([guid]::NewGuid()).vhdx"
          $letter = 71..90 | ForEach-Object { [char]$_ } | Where-Object { -not (Test-Path "${_}:\") } | Select-Object -First 1
          if (-not $letter) { throw 'No unused drive letter for disposable clone proof' }
          @"
          create vdisk file="$image" maximum=2048 type=expandable
          select vdisk file="$image"
          attach vdisk
          create partition primary
          format fs=refs quick label=DinksterCloneProof
          assign letter=$letter
          "@ | diskpart
          $volume = Get-Volume -DriveLetter $letter -ErrorAction Stop
          if ($volume.FileSystem -ne 'ReFS') { throw 'Disposable ReFS creation failed; see diskpart output' }
          $root = "${letter}:\clone-tests"
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          Set-FileIntegrity -FileName $root -Enable $false -ErrorAction Stop
          "DINKSTER_CLONE_TEST_ROOT=$root" >> $env:GITHUB_ENV
          'DINKSTER_REQUIRE_REAL_CLONES=1' >> $env:GITHUB_ENV
      - name: Require real Windows clone allocation coverage
        run: uv run --no-sync python -m pytest -q -rA --no-cov -n0 tests/test_environment_collection.py -k real_clones
      - run: uv run --no-sync python -m pytest -q --durations=0 --durations-min=0 tests/test_durable_delegations.py tests/test_environment_archives.py tests/test_environment_collection.py tests/test_setup_envs.py tests/test_release_install.py::test_development_version_counts_commits_since_the_last_version_tag tests/test_release_install.py::test_default_admission_workflow_selects_publication_candidates
      - name: Verify published setup and bounded subprocess diagnostics
        run: uv run --no-sync python -m pytest -q tests/test_environment_cli.py::test_confirmed_offline_setup_update_rollback_and_busy_refusal tests/test_environment_history.py::test_adoption_plans_exact_pack_sources_and_refuses_unsafe_inputs tests/test_environment_history.py::test_snapshot_refuses_modified_metadata_and_linked_pack_parents tests/test_environment_runtime.py::test_start_status_idempotence_and_stop tests/test_environment_transactions.py::test_first_setup_publishes_only_a_healthy_engine_and_recovers_without_previous_generation tests/test_supervisor_subprocess.py
      - name: Verify produced assets and shared SQLite journals
        run: uv run --no-sync python -m pytest -q tests/test_produced_video_assets.py tests/test_environment_downloads.py tests/test_asset_cleanup.py

  windows-adoption:
    needs: checks
    if: (github.workflow != 'ci' || github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.checks.outputs.runtime == 'true'
    name: Windows adoption and pruned restore (${{ matrix.case }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [exact, missing-base, missing-engine, missing-engine-and-base, reacquired-source]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: ./.github/actions/windows-python
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync python -m pytest -q --durations=5 "tests/test_environment_history.py::test_adoption_materializes_pack_dependencies_and_restores_after_pruning[${{ matrix.case }}]"

  windows-imports:
    needs: checks
    if: (github.workflow != 'ci' || github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.checks.outputs.runtime == 'true'
    name: Windows legacy snapshot imports
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: ./.github/actions/windows-python
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync python -m pytest -q --durations=5 tests/test_environment_history.py::test_legacy_import_preserves_activation_selection_and_refuses_conflicting_capture tests/test_environment_history.py::test_imported_software_restores_after_pruning_without_becoming_rollback_predecessor tests/test_environment_history.py::test_restore_plan_reports_only_required_pack_wheels_without_writing

  windows-acquisition:
    needs: checks
    if: (github.workflow != 'ci' || github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.checks.outputs.runtime == 'true'
    name: Windows public setup acquisition
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: ./.github/actions/windows-python
      - run: uv sync --locked --all-packages
      - run: >-
          uv run --no-sync python -m pytest -q --durations=5
          tests/test_environment_generations.py::test_public_setup_acquires_pack_wheel_absent_from_release
          tests/test_environment_history.py::test_installed_wheel_pack_add_and_update_without_index_resolution

  tests:
    needs: [checks, torch-cpu]
    # Reusable calls retain the caller's workflow name and existing job selection.
    if: ${{ !cancelled() && (github.workflow != 'ci' || github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: tests
    runs-on: ubuntu-latest
    # Hosted pytest has taken 24m21s before catalog export and frontend decode.
    # Keep three times the exhausted 25-minute budget for the complete gate.
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Require successful path selection and checks
        run: |
          test '${{ needs.checks.result }}' = success
          if [ '${{ startsWith(github.ref, 'refs/tags/v') }}' = true ]; then
            test '${{ needs.torch-cpu.result }}' = success
          else
            test '${{ needs.torch-cpu.result }}' = skipped
          fi
      - uses: actions/checkout@v4
        if: needs.checks.outputs.docs != 'true'
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        if: needs.checks.outputs.docs != 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages
        if: needs.checks.outputs.docs != 'true'
      - name: Provision the wheel build backend before offline validation
        if: needs.checks.outputs.engine == 'true'
        run: uv build --package dinkster-supervisor --wheel --out-dir "$RUNNER_TEMP/fast-build-setup"
      - name: Verify pinned inference APIs
        if: needs.checks.outputs.engine == 'true'
        run: uv run --no-sync python tools/verify_pinned_inference.py
      - name: Create a disposable XFS clone-test volume
        if: needs.checks.outputs.engine == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xfsprogs
          image=$(mktemp "$RUNNER_TEMP/clone-proof-XXXXXX.img")
          volume=$(mktemp -d "$RUNNER_TEMP/clone-proof-XXXXXX")
          truncate -s 2G "$image"
          mkfs.xfs -f -m reflink=1 "$image"
          sudo mount -o loop "$image" "$volume"
          sudo chown "$(id -u):$(id -g)" "$volume"
          echo "DINKSTER_CLONE_TEST_ROOT=$volume" >> "$GITHUB_ENV"
          echo 'DINKSTER_REQUIRE_REAL_CLONES=1' >> "$GITHUB_ENV"
      - name: Require real Linux clone allocation coverage
        if: needs.checks.outputs.engine == 'true'
        run: uv run --no-sync python -m pytest -q -rA --no-cov -n0 tests/test_environment_collection.py -k real_clones
      - run: bash scripts/ci-fast.sh tests
        if: needs.checks.outputs.engine == 'true'
        env:
          DINKSTER_CI_RUNTIME: ${{ needs.checks.outputs.runtime }}
      - name: Install the CPU base for selected packs
        if: needs.checks.outputs.packs != '[]' && needs.checks.outputs.docs != 'true'
        run: uv run --no-project python scripts/setup_envs.py --variant linux-cpu
      - name: Install the CPU software shader renderer
        if: needs.checks.outputs.packs != '[]' && needs.checks.outputs.docs != 'true'
        uses: ./.github/actions/torch-cpu-suite/renderer-setup
      - name: Test selected packs
        if: needs.checks.outputs.packs != '[]' && needs.checks.outputs.docs != 'true'
        env:
          PACKS: ${{ needs.checks.outputs.packs }}
          DINKSTER_ACCELERATOR: cpu
        run: uv run --no-sync python -m tools.ci_selection --packs "$PACKS"
      - name: Export the published default catalog
        if: needs.checks.outputs.engine == 'true'
        run: uv run --no-sync pytest -q tests/test_serve.py::test_default_catalog_publishes_only_owned_translation_carriers
        env:
          CUDA_VISIBLE_DEVICES: ""
          DINKSTER_CATALOG_WIRE_OUTPUT: ${{ runner.temp }}/default-catalog.json
      - name: Read the pinned frontend revision
        if: needs.checks.outputs.engine == 'true'
        id: frontend
        run: |
          uv run --no-sync python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/full-validation.yml').read_text())
          print(f"ref={workflow['env']['FRONTEND_REF']}")
          PY
      - uses: actions/checkout@v4
        if: needs.checks.outputs.engine == 'true'
        with:
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ steps.frontend.outputs.ref }}
          path: .frontend-validation
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: needs.checks.outputs.engine == 'true'
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@v4
        if: needs.checks.outputs.engine == 'true'
        with:
          package_json_file: .frontend-validation/package.json
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Decode the default catalog with the pinned frontend
        if: needs.checks.outputs.engine == 'true'
        working-directory: .frontend-validation
        run: |
          pnpm install --frozen-lockfile --filter @dinkster/core... --filter .
          node --test ../tools/validate_default_catalog.test.mjs
          pnpm exec tsx ../tools/validate_default_catalog.mjs "$CATALOG" .
        env:
          CATALOG: ${{ runner.temp }}/default-catalog.json

  windows-checks:
    needs: checks
    if: (github.workflow != 'ci' || github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.checks.outputs.runtime == 'true'
    name: Windows format, lint and types
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright
      - name: Verify Windows interpreter and native extension loading
        run: >-
          uv run --locked pytest -q tests/test_interpreter_preflight.py
          tests/test_asset_selections.py
          tests/test_isolated.py::test_group_connects_all_peers_before_synchronous_hello_preparation
          tests/test_isolated.py::test_worker_hello_discovers_broken_runtime_without_importing_it
          tests/test_isolated.py::test_worker_converts_legacy_checkpoint_on_first_use
          tests/test_reload.py::test_group_worker_start_is_all_or_nothing
          tests/test_reload.py::test_group_worker_authenticates_every_tcp_endpoint
