name: ci

on:
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:
    inputs:
      simulate-fork:
        description: Run the fork pull-request policy without repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      comfy: ${{ steps.paths.outputs.comfy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the CPU comfy gate
        id: paths
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo 'comfy=true' >> "$GITHUB_OUTPUT"
          else
            paths=$(git diff --name-only "$BASE" HEAD)
            if grep -E '^(packages/dinkster-(nodes-comfy|compat-comfy)/|tests/test_comfy_|\.github/(actions/torch-cpu-suite/|workflows/ci\.yml$)|uv\.lock$)' <<< "$paths" > /dev/null; then
              echo 'comfy=true' >> "$GITHUB_OUTPUT"
            else
              echo 'comfy=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  torch-cpu:
    needs: changes
    if: needs.changes.outputs.comfy == 'true'
    name: CPU comfy gate (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ATEN_CPU_CAPABILITY: avx2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/torch-cpu-suite
        with:
          suite: comfy
          comfy-pytest-args: -p tools.pytest_file_shard --file-shard ${{ matrix.shard }}/4

  windows-runtime:
    name: Windows SQLite runtime and durable delegations
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: ./.github/actions/windows-python
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync python -m pytest -q tests/test_durable_delegations.py tests/test_environment_archives.py tests/test_setup_envs.py

  fast:
    needs: [changes, torch-cpu]
    if: always()
    name: format, lint, types and unit subset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Require the selected CPU gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMFY: ${{ needs.changes.outputs.comfy }}
          CPU_RESULT: ${{ needs.torch-cpu.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$COMFY" = true ]; then
            test "$CPU_RESULT" = success
          else
            test "$CPU_RESULT" = skipped
          fi
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages
      - name: Verify pinned inference APIs
        run: uv run --no-sync python tools/verify_pinned_inference.py
      - run: bash scripts/ci-fast.sh
      - name: Export the published default catalog
        run: uv run --locked pytest -q tests/test_serve.py::test_default_catalog_publishes_only_owned_translation_carriers
        env:
          CUDA_VISIBLE_DEVICES: ""
          DINKSTER_CATALOG_WIRE_OUTPUT: ${{ runner.temp }}/default-catalog.json
      - name: Read the pinned frontend revision
        id: frontend
        run: |
          uv run --no-sync python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/full-validation.yml').read_text())
          print(f"ref={workflow['env']['FRONTEND_REF']}")
          PY
      - uses: actions/checkout@v4
        with:
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ steps.frontend.outputs.ref }}
          path: .frontend-validation
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .frontend-validation/package.json
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Decode the default catalog with the pinned frontend
        working-directory: .frontend-validation
        run: |
          pnpm install --frozen-lockfile --filter @dinkster/core... --filter .
          pnpm exec tsx ../tools/validate_default_catalog.mjs "$CATALOG" .
        env:
          CATALOG: ${{ runner.temp }}/default-catalog.json

  windows-checks:
    name: Windows format, lint and types
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright
      - name: Verify Windows interpreter and native extension loading
        run: >-
          uv run --locked pytest -q tests/test_interpreter_preflight.py
          tests/test_isolated.py::test_group_connects_all_peers_before_synchronous_hello_preparation
          tests/test_reload.py::test_group_worker_start_is_all_or_nothing
          tests/test_reload.py::test_group_worker_authenticates_every_tcp_endpoint
