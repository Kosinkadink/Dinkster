name: ci
run-name: ci with private training access

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: format, lint, types and unit subset
    runs-on: ${{ fromJSON(vars.DINKSTER_PR_RUNNER || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
          coverage: "false"
      - uses: ./.github/actions/configure-dinkster-identity
        with:
          deploy-key: ${{ secrets.DINKSTER_IDENTITY_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - run: bash scripts/ci-fast.sh

  default-training-pack:
    name: default install exposes training nodes
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.DINKSTER_PR_RUNNER || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/configure-dinkster-identity
        with:
          repository: Kosinkadink/dinkster-training
          deploy-key: ${{ secrets.DINKSTER_TRAINING_READ_KEY }}
      - name: Configure private identity access
        shell: bash
        env:
          IDENTITY_DEPLOY_KEY: ${{ secrets.DINKSTER_IDENTITY_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          training_socket="$SSH_AUTH_SOCK"
          training_public="$RUNNER_TEMP/training-deploy-key.pub"
          ssh-add -L > "$training_public"
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$IDENTITY_DEPLOY_KEY" | ssh-add - >/dev/null
          identity_public="$RUNNER_TEMP/identity-deploy-key.pub"
          ssh-add -L > "$identity_public"
          identity_config="$RUNNER_TEMP/private-dependencies-ssh-config"
          cat > "$identity_config" <<EOF
          Host github-training
            HostName github.com
            User git
            IdentityAgent $training_socket
            IdentityFile $training_public
            IdentitiesOnly yes
            HostKeyAlias github.com
            UserKnownHostsFile $RUNNER_TEMP/identity-known-hosts
          Host github-identity
            HostName github.com
            User git
            IdentityAgent $SSH_AUTH_SOCK
            IdentityFile $identity_public
            IdentitiesOnly yes
            HostKeyAlias github.com
            UserKnownHostsFile $RUNNER_TEMP/identity-known-hosts
          EOF
          {
            echo "IDENTITY_AGENT_PID=$SSH_AGENT_PID"
            echo "IDENTITY_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo 'GIT_CONFIG_COUNT=3'
            echo 'GIT_CONFIG_KEY_0=url.ssh://git@github-training/Kosinkadink/dinkster-training.insteadOf'
            echo 'GIT_CONFIG_VALUE_0=https://github.com/Kosinkadink/dinkster-training'
            echo 'GIT_CONFIG_KEY_1=url.ssh://git@github-identity/Kosinkadink/dinkster-identity.insteadOf'
            echo 'GIT_CONFIG_VALUE_1=https://github.com/Kosinkadink/dinkster-identity'
            echo 'GIT_CONFIG_KEY_2=core.sshCommand'
            echo "GIT_CONFIG_VALUE_2=ssh -F $identity_config"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install the default backend and training pack
        env:
          GIT_CONFIG_COUNT: "4"
          GIT_CONFIG_KEY_3: url.https://x-access-token:${{ github.token }}@github.com/Kosinkadink/Dinkster.insteadOf
          GIT_CONFIG_VALUE_3: https://github.com/Kosinkadink/Dinkster
        run: uv run --no-project --python 3.12 scripts/install.py
      - name: Verify the default node catalog
        shell: bash
        run: |
          set -euo pipefail
          library="$RUNNER_TEMP/default-training-library"
          mkdir -p "$library"
          port="$(.venv/bin/python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          .venv/bin/dinkster-serve --host 127.0.0.1 --port "$port" --library-root "$library" --prepare-stale-catalogs --disable-p2p > "$RUNNER_TEMP/default-training.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          .venv/bin/python - "$port" <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          url = f"http://127.0.0.1:{sys.argv[1]}/api/nodes"
          expected = {
              "training.advance",
              "training.complete_session",
              "training.create_session",
              "training.dry_run",
              "training.export_lora",
          }
          deadline = time.monotonic() + 180
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      nodes = set(json.load(response)["nodes"])
                  if expected <= nodes:
                      break
              except (OSError, urllib.error.URLError):
                  pass
              time.sleep(0.25)
          else:
              raise SystemExit(f"training nodes absent from {url}")
          PY
      - name: Stop private identity agent
        if: always() && env.IDENTITY_AGENT_PID != ''
        shell: bash
        run: ssh-agent -k >/dev/null
        env:
          SSH_AGENT_PID: ${{ env.IDENTITY_AGENT_PID }}
          SSH_AUTH_SOCK: ${{ env.IDENTITY_AUTH_SOCK }}
