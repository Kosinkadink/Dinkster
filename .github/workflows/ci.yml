name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      simulate-fork:
        description: Run the fork pull-request policy without repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: format, lint, types and unit subset
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || inputs.simulate-fork) && 'forkLinux' || 'linux'] }}
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Check private dependency access
        id: private-dependencies
        uses: ./.github/actions/check-private-dependencies
        with:
          secret-name-1: DINKSTER_EVIDENCE_READ_KEY
          secret-value-1: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
          force-not-run: ${{ inputs.simulate-fork }}
      - uses: ./.github/actions/prepare-validation-inputs
        if: steps.private-dependencies.outputs.available == 'true'
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
          coverage: "false"
      - uses: astral-sh/setup-uv@v5
        if: steps.private-dependencies.outputs.available == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - if: steps.private-dependencies.outputs.available == 'true'
        run: uv sync --locked --all-packages
      - if: steps.private-dependencies.outputs.available == 'true'
        run: bash scripts/ci-fast.sh
      - name: Refuse green validation without private inputs
        if: always() && steps.private-dependencies.outputs.available != 'true'
        run: |
          echo "Required private inputs were unavailable; pull request validation did not run." >> "$GITHUB_STEP_SUMMARY"
          exit 1
