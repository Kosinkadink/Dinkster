name: Windows worker pipes

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/windows-worker-pipes.yml
      - packages/dinkster-workers/src/dinkster_workers/_windows_loop.py
      - packages/dinkster-workers/src/dinkster_workers/_pipe_stream.py
      - packages/dinkster-workers/src/dinkster_workers/_pipe_transport.py
      - packages/dinkster-workers/src/dinkster_workers/transport.py
      - packages/dinkster-workers/src/dinkster_workers/windows_sandbox.py
      - tests/test_transport.py
      - tests/test_sandbox.py
      - src/dinkster/compose.py
      - packages/dinkster-workers/src/dinkster_workers/host.py
      - packages/dinkster-assets/src/dinkster_assets/scratch.py
      - uv.lock

permissions:
  contents: read

jobs:
  pipes:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14.10"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      DINKSTER_ACCELERATOR: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: ./.github/actions/prepare-contributor-generation
        with:
          python: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: Kosinkadink/Dinkster-Desktop
          ref: 083b112a8c8210e35fb58d12b00533d92be8a3be
          path: .run/mxc-desktop
          sparse-checkout: packages/desktop/scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - name: Build the pinned Desktop MXC executor without telemetry
        shell: pwsh
        run: |
          node .run/mxc-desktop/packages/desktop/scripts/prepare-mxc.mjs
          if ($LASTEXITCODE -ne 0) { throw 'MXC executor build failed' }
          $executor = Join-Path $env:GITHUB_WORKSPACE '.run/mxc-desktop/packages/desktop/resources/sandbox/wxc-exec.exe'
          if (-not (Test-Path $executor)) { throw 'MXC executor is missing' }
          "DINKSTER_MXC_EXECUTABLE=$executor" >> $env:GITHUB_ENV
      - name: Exercise worker pipes and the contained produced-vault lease
        shell: bash
        run: |
          python scripts/develop.py run -- python -m pytest -n0 -q -rs \
            tests/test_sandbox.py tests/test_transport.py -k 'windows or pipe'
