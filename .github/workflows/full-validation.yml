name: full-validation

on:
  push:
    branches: [main, windows-sqlite-runtime-570]
  schedule:
    - cron: '0 6-22/2 * * *'
      timezone: America/Los_Angeles
    - cron: '23 10 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read

env:
  # Pin the frontend decoder; decoder changes bump this in a companion Dinkster PR before landing.
  FRONTEND_REF: 34a761fb0b7f83b56ccd36e9155ace51e0ba85f9

# Pushes batch behind the active run while scheduled and release validation always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || 'durable' }}
  cancel-in-progress: false

jobs:
  validation-plan:
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 2
    outputs:
      run-heavy: ${{ steps.plan.outputs.run-heavy }}
      run-torch: ${{ steps.plan.outputs.run-torch }}
    steps:
      - name: Skip an unchanged scheduled commit
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            let runTorch = true;
            if (context.eventName === 'push' && !/^0+$/.test(context.payload.before)) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${context.payload.before}...${context.sha}`,
              });
              const files = comparison.data.files || [];
              // The compare API caps files at 300. A capped response must run everything.
              const relevant = /^(packages\/dinkster-(nodes-(comfy|vision)|inference[^/]*|compat-comfy)\/|tests\/test_(comfy_|vision_)|\.github\/(actions\/torch-cpu-suite\/|workflows\/full-validation\.yml$)|uv\.lock$)/;
              runTorch = files.length >= 300 || files.some(file => relevant.test(file.filename) || relevant.test(file.previous_filename || ''));
            }
            core.setOutput('run-torch', String(runTorch));
            if (context.eventName !== 'schedule') {
              core.setOutput('run-heavy', 'true');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'full-validation.yml',
              branch: 'main',
              status: 'success',
              event: 'schedule',
              per_page: 1,
            });
            core.setOutput('run-heavy', runs.data.workflow_runs[0]?.head_sha === context.sha ? 'false' : 'true');

  test:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}${{ matrix.shard_name }})
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[matrix.runner] }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        # Windows keeps the tcp boundary transport and the shm
        # handle-lifetime rules honest (DESIGN 3.11) - it is the dominant
        # user OS, not a nice-to-have.
        # Whole-file shards keep each complete lane within its main-validation
        # budget. Checks and generated-contract validation run once per OS;
        # every root test file still runs in exactly one shard.
        include:
          - os: linux
            runner: linux
            python-version: "3.12"
            shard: 1
            shard_name: ", shard 1"
            pytest_args: "-p tools.pytest_file_shard --file-shard 1/4"
            run_checks: true
            timeout-minutes: 30
          - os: linux
            runner: linux
            python-version: "3.12"
            shard: 2
            shard_name: ", shard 2"
            pytest_args: "-p tools.pytest_file_shard --file-shard 2/4"
            run_checks: false
            timeout-minutes: 30
          - os: linux
            runner: linux
            python-version: "3.12"
            shard: 3
            shard_name: ", shard 3"
            pytest_args: "-p tools.pytest_file_shard --file-shard 3/4"
            run_checks: false
            timeout-minutes: 30
          - os: linux
            runner: linux
            python-version: "3.12"
            shard: 4
            shard_name: ", shard 4"
            pytest_args: "-p tools.pytest_file_shard --file-shard 4/4"
            run_checks: false
            timeout-minutes: 30
          - os: windows
            runner: windows
            python-version: "3.14.10"
            shard_name: ", shard 1"
            pytest_args: "-p tools.pytest_file_shard --file-shard 1/4 --durations=20"
            run_checks: true
            timeout-minutes: 45
          - os: windows
            runner: windows
            python-version: "3.14.10"
            shard_name: ", shard 2"
            pytest_args: "-p tools.pytest_file_shard --file-shard 2/4"
            run_checks: false
            timeout-minutes: 30
          - os: windows
            runner: windows
            python-version: "3.14.10"
            shard_name: ", shard 3"
            pytest_args: "-p tools.pytest_file_shard --file-shard 3/4"
            run_checks: false
            timeout-minutes: 30
          - os: windows
            runner: windows
            python-version: "3.14.10"
            shard_name: ", shard 4"
            pytest_args: "-p tools.pytest_file_shard --file-shard 4/4"
            run_checks: false
            timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh tracked files with current attributes
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          git rm -r --cached -q .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git reset --hard -q HEAD
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: ./.github/actions/windows-python
        if: matrix.os == 'windows'
      - run: uv sync --all-packages
      - name: Install and verify published Windows engine dependencies
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $python = uv run --no-sync python -c "import sys; print(sys.executable)"
          uv pip install --python $python --no-deps --index-url https://pypi.org/simple `
            "comfy-kitchen==0.2.40" "comfy-aimdo==0.6.0"
          & $python -c "from importlib.metadata import version; from importlib.util import find_spec; assert find_spec('comfy_kitchen') is not None; assert find_spec('comfy_aimdo') is not None; assert version('comfy-kitchen') == '0.2.40'; assert version('comfy-aimdo') == '0.6.0'; print('comfy-kitchen', version('comfy-kitchen')); print('comfy-aimdo', version('comfy-aimdo'))"
      - run: uv run --locked ruff format --check .
        if: matrix.run_checks
      - run: uv run ruff check .
        if: matrix.run_checks
      - run: uv run pyright
        if: matrix.run_checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify bounded VIDEO save memory
        if: matrix.os == 'linux' && matrix.run_checks
        run: uv run --locked python tools/video_conformance.py --rss
      - name: Verify bounded AUDIO trim and save memory
        if: matrix.os == 'linux' && matrix.run_checks
        run: |
          mkdir -p "$RUNNER_TEMP/dinkster-audio-rss"
          uv run --locked python tools/audio_conformance.py --rss --directory "$RUNNER_TEMP/dinkster-audio-rss"
      - run: >
          uv run python -m pytest -q ${{ matrix.pytest_args }}
          --ignore-glob=tests/test_environment_*.py
          --ignore=tests/test_installer.py
          --ignore=tests/test_release_install.py
          --ignore-glob=tests/test_supervisor*.py
          --deselect=tests/test_sandbox.py::TestLiveJail
          --deselect=tests/test_doctor.py::TestLiveJailedProbe
        if: runner.os == 'Windows'
        env:
          DINKSTER_SLOW_TESTS: "1"
      - run: >
          uv run python -m pytest -q ${{ matrix.pytest_args }}
          --deselect=tests/test_sandbox.py::TestLiveJail
          --deselect=tests/test_doctor.py::TestLiveJailedProbe
          --cov=dinkster_api --cov=dinkster_assets
          --cov=dinkster_caches --cov=dinkster_compat_comfy --cov=dinkster_engine
          --cov=dinkster_graph --cov=dinkster_memory --cov=dinkster_nodes_foundation
          --cov=dinkster_nodes_image --cov=dinkster_nodes_media_io
          --cov=dinkster_schema --cov=dinkster_server --cov=dinkster_values
          --cov=dinkster_workers --cov-branch --cov-report=
        if: runner.os == 'Linux'
        env:
          DINKSTER_SLOW_TESTS: "1"
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
      - run: uv run dinkster demo
        if: matrix.run_checks
      - run: uv run dinkster-isolated
        if: matrix.run_checks
      - name: Export the published default catalog
        if: matrix.os == 'linux' && matrix.run_checks
        run: uv run --locked pytest -q tests/test_serve.py::test_default_catalog_publishes_only_owned_translation_carriers
        env:
          DINKSTER_CATALOG_WIRE_OUTPUT: ${{ runner.temp }}/default-catalog.json
      - uses: actions/checkout@v4
        if: matrix.os == 'linux' && matrix.run_checks
        with:
          clean: true
          repository: Kosinkadink/Dinkster-Frontend
          ref: ${{ env.FRONTEND_REF }}
          path: .frontend-validation
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: matrix.os == 'linux' && matrix.run_checks
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        if: matrix.os == 'linux' && matrix.run_checks
        with:
          node-version: 22
      - name: Decode real registries with pinned frontend
        if: matrix.os == 'linux' && matrix.run_checks
        working-directory: .frontend-validation
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsx ../tools/validate_default_catalog.mjs "$CATALOG" .
        env:
          CATALOG: ${{ runner.temp }}/default-catalog.json

  torch-cpu:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true' && needs.validation-plan.outputs.run-torch == 'true'
    name: torch-cpu (${{ matrix.suite }}${{ matrix.shard }})
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: comfy
            shard: ", shard 1"
            pytest-args: "-p tools.pytest_file_shard --file-shard 1/4"
          - suite: comfy
            shard: ", shard 2"
            pytest-args: "-p tools.pytest_file_shard --file-shard 2/4"
          - suite: comfy
            shard: ", shard 3"
            pytest-args: "-p tools.pytest_file_shard --file-shard 3/4"
          - suite: comfy
            shard: ", shard 4"
            pytest-args: "-p tools.pytest_file_shard --file-shard 4/4"
          - suite: vision
            shard: ""
            pytest-args: ""
    env:
      ATEN_CPU_CAPABILITY: avx2
      ONEDNN_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/torch-cpu-suite
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
          suite: ${{ matrix.suite }}
          comfy-pytest-args: ${{ matrix.pytest-args }}

  windows-runtime:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    name: Windows environment and supervisor runtime (shard ${{ matrix.shard }})
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).windows }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Windows runtime environment
        run: uv sync --locked --all-packages
      - name: Install and verify published Windows engine dependencies
        shell: pwsh
        run: |
          $python = uv run --no-sync python -c "import sys; print(sys.executable)"
          uv pip install --python $python --no-deps --index-url https://pypi.org/simple `
            "comfy-kitchen==0.2.40" "comfy-aimdo==0.6.0"
          & $python -c "from importlib.metadata import version; from importlib.util import find_spec; assert find_spec('comfy_kitchen') is not None; assert find_spec('comfy_aimdo') is not None; assert version('comfy-kitchen') == '0.2.40'; assert version('comfy-aimdo') == '0.6.0'; print('comfy-kitchen', version('comfy-kitchen')); print('comfy-aimdo', version('comfy-aimdo'))"
      - name: Test Windows runtime contracts
        shell: pwsh
        env:
          DINKSTER_SLOW_TESTS: "1"
          COVERAGE_FILE: .coverage.windows-runtime-${{ matrix.shard }}
        run: |
          $files = Get-ChildItem tests -File | Where-Object {
            $_.Name -like 'test_environment_*.py' -or
            $_.Name -eq 'test_installer.py' -or
            $_.Name -eq 'test_release_install.py' -or
            $_.Name -like 'test_supervisor*.py'
          } | ForEach-Object { $_.FullName }
          if (-not $files) { throw 'No Windows runtime tests selected' }
          uv run --no-sync python -m pytest -q @files `
            -p tools.pytest_file_shard --file-shard ${{ matrix.shard }}/3 --durations=0 `
            --case-shard-file tests/test_environment_generations.py `
            --cov=dinkster_api --cov=dinkster_assets `
            --cov=dinkster_caches --cov=dinkster_compat_comfy --cov=dinkster_engine `
            --cov=dinkster_graph --cov=dinkster_memory --cov=dinkster_nodes_foundation `
            --cov=dinkster_nodes_image --cov=dinkster_nodes_media_io `
            --cov=dinkster_schema --cov=dinkster_server --cov=dinkster_values `
            --cov=dinkster_workers --cov-branch --cov-report=
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-shard-windows-runtime-${{ matrix.shard }}
          path: .coverage.windows-runtime-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  coverage-gate:
    # Branch-coverage floor (docs/testing.md): a ratchet, not a target.
    # Raise --cov-fail-under when real coverage rises; never lower it.
    needs: [validation-plan, test, windows-runtime]
    if: always() && needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 5
    steps:
      - name: Require every coverage shard to pass
        run: |
          test '${{ needs.test.result }}' = success
          test '${{ needs.windows-runtime.result }}' = success
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage and enforce the unchanged branch floor
        run: |
          for shard in 1 2 3 4; do
            test -f "coverage-data/.coverage.$shard"
          done
          for shard in 1 2 3; do
            test -f "coverage-data/.coverage.windows-runtime-$shard"
          done
          printf '[paths]\npackages =\n    packages/\n    */packages/\n' > "$RUNNER_TEMP/coverage-paths.ini"
          uv run coverage combine --rcfile="$RUNNER_TEMP/coverage-paths.ini" coverage-data
          uv run coverage report --fail-under=80

  video-template-replay:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - name: Replay VIDEO template shapes
        run: uv run --locked pytest -q tests/test_video_alias_templates.py

  main-status:
    name: main validation status
    if: always()
    needs:
      - validation-plan
      - test
      - torch-cpu
      - windows-runtime
      - coverage-gate
      - video-template-replay
      - registry-install
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 2
    steps:
      - name: Record every lane result
        env:
          RUN_HEAVY: ${{ needs.validation-plan.outputs.run-heavy }}
          TEST_RESULT: ${{ needs.test.result }}
          TORCH_RESULT: ${{ needs.torch-cpu.result }}
          RUNTIME_RESULT: ${{ needs.windows-runtime.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
        run: |
          printf '{"commit":"%s","runHeavy":"%s","lanes":{"test":"%s","torchCpu":"%s","windowsRuntime":"%s","coverage":"%s"}}\n' \
            "$GITHUB_SHA" "$RUN_HEAVY" "$TEST_RESULT" \
            "$TORCH_RESULT" "$RUNTIME_RESULT" "$COVERAGE_RESULT" \
            > main-validation-status.json
          cat main-validation-status.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-validation-status
          path: main-validation-status.json
          retention-days: 30
          if-no-files-found: error
      - name: Require every selected lane to pass
        env:
          RUN_HEAVY: ${{ needs.validation-plan.outputs.run-heavy }}
          RUN_TORCH: ${{ needs.validation-plan.outputs.run-torch }}
          TEST_RESULT: ${{ needs.test.result }}
          TORCH_RESULT: ${{ needs.torch-cpu.result }}
          RUNTIME_RESULT: ${{ needs.windows-runtime.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
          REGISTRY_RESULT: ${{ needs.registry-install.result }}
          VIDEO_RESULT: ${{ needs.video-template-replay.result }}
        run: |
          if [ "$RUN_HEAVY" = false ]; then exit 0; fi
          test "$TEST_RESULT" = success
          if [ "$RUN_TORCH" = true ]; then
            test "$TORCH_RESULT" = success
          else
            test "$TORCH_RESULT" = skipped
          fi
          test "$RUNTIME_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$REGISTRY_RESULT" = success
          test "$VIDEO_RESULT" = success

  registry-install:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-private-repository
        with:
          repository: Kosinkadink/dinkster-registry
          deploy-key: ${{ secrets.DINKSTER_REGISTRY_READ_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: Kosinkadink/dinkster-registry
          ref: 5d844ae53616f88756a98eb6dc3aa73fefb92622
          path: registry
          persist-credentials: false
      - name: Configure and verify the Linux probe jail
        run: bash scripts/setup_probe_jail.sh
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: |
          uv sync --locked --all-packages
          uv sync --project registry --frozen
          uv run --no-sync python -m pytest -v \
            tests/test_sandbox.py::TestLiveJail tests/test_doctor.py::TestLiveJailedProbe
          uv run --no-sync python scripts/verify_release_install.py "$GITHUB_WORKSPACE" \
            --state "$RUNNER_TEMP/registry-install-state" \
            --registry-command "$GITHUB_WORKSPACE/registry/.venv/bin/dinkster-registry"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-install-state
          path: ${{ runner.temp }}/registry-install-state
          retention-days: 7
