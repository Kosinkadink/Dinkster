name: full-validation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6-22/2 * * *'
      timezone: America/Los_Angeles
    - cron: '23 10 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read

# Pushes batch behind the active run while scheduled and release validation always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || 'durable' }}
  cancel-in-progress: false

jobs:
  validation-plan:
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 2
    outputs:
      run-heavy: ${{ steps.plan.outputs.run-heavy }}
    steps:
      - name: Skip an unchanged scheduled commit
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'schedule') {
              core.setOutput('run-heavy', 'true');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'full-validation.yml',
              branch: 'main',
              status: 'success',
              per_page: 1,
            });
            core.setOutput('run-heavy', runs.data.workflow_runs[0]?.head_sha === context.sha ? 'false' : 'true');

  test:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}${{ matrix.shard_name }})
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[matrix.runner] }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        # Windows keeps the tcp boundary transport and the shm
        # handle-lifetime rules honest (DESIGN 3.11) - it is the dominant
        # user OS, not a nice-to-have.
        # Whole-file shards keep each complete lane within its main-validation
        # budget. Checks and generated-contract validation run once per OS;
        # every root test file still runs in exactly one shard.
        include:
          - os: linux
            runner: linux
            python-version: "3.12"
            shard_name: ", shard 1"
            pytest_args: "-p tools.pytest_file_shard --file-shard 1/4"
            run_checks: true
            timeout-minutes: 20
          - os: linux
            runner: linux
            python-version: "3.12"
            shard_name: ", shard 2"
            pytest_args: "-p tools.pytest_file_shard --file-shard 2/4"
            run_checks: false
            timeout-minutes: 20
          - os: linux
            runner: linux
            python-version: "3.12"
            shard_name: ", shard 3"
            pytest_args: "-p tools.pytest_file_shard --file-shard 3/4"
            run_checks: false
            timeout-minutes: 20
          - os: linux
            runner: linux
            python-version: "3.12"
            shard_name: ", shard 4"
            pytest_args: "-p tools.pytest_file_shard --file-shard 4/4"
            run_checks: false
            timeout-minutes: 20
          - os: windows
            runner: windows
            python-version: "3.12"
            shard_name: ", shard 1"
            pytest_args: "-p tools.pytest_file_shard --file-shard 1/2"
            run_checks: true
            timeout-minutes: 30
          - os: windows
            runner: windows
            python-version: "3.12"
            shard_name: ", shard 2"
            pytest_args: "-p tools.pytest_file_shard --file-shard 2/2"
            run_checks: false
            timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh tracked files with current attributes
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          git rm -r --cached -q .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git reset --hard -q HEAD
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - name: Install and verify published Windows engine dependencies
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $python = uv run --no-sync python -c "import sys; print(sys.executable)"
          uv pip install --python $python --no-deps --index-url https://pypi.org/simple `
            "dinkster-kitchen==0.2.35.post1" "dinkster-aimdo==0.5.5.post2"
          & $python -c "from importlib.metadata import version; from importlib.util import find_spec; assert find_spec('dinkster_kitchen') is not None; assert find_spec('dinkster_aimdo') is not None; assert version('dinkster-kitchen') == '0.2.35.post1'; assert version('dinkster-aimdo') == '0.5.5.post2'; print('dinkster-kitchen', version('dinkster-kitchen')); print('dinkster-aimdo', version('dinkster-aimdo'))"
      - run: uv run --locked ruff format --check .
        if: matrix.run_checks
      - run: uv run ruff check .
        if: matrix.run_checks
      - run: uv run pyright
        if: matrix.run_checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify bounded VIDEO save memory
        if: matrix.os == 'linux' && matrix.run_checks
        run: uv run --locked python tools/video_conformance.py --rss
      - name: Verify bounded AUDIO trim and save memory
        if: matrix.os == 'linux' && matrix.run_checks
        run: |
          mkdir -p "$RUNNER_TEMP/dinkster-audio-rss"
          uv run --locked python tools/audio_conformance.py --rss --directory "$RUNNER_TEMP/dinkster-audio-rss"
      - run: uv run python -m pytest -q ${{ matrix.pytest_args }}
        if: runner.os == 'Windows'
      - run: uv run python -m pytest -q ${{ matrix.pytest_args }}
        if: runner.os == 'Linux'
      - run: uv run dinkster demo
        if: matrix.run_checks
      - run: uv run dinkster-isolated
        if: matrix.run_checks
      - name: Export the published default catalog
        if: matrix.os == 'linux' && matrix.run_checks
        run: uv run --locked pytest -q tests/test_serve.py::test_default_catalog_publishes_only_owned_translation_carriers
        env:
          DINKSTER_CATALOG_WIRE_OUTPUT: ${{ runner.temp }}/default-catalog.json
      - uses: actions/checkout@v4
        if: matrix.os == 'linux' && matrix.run_checks
        with:
          clean: true
          repository: Kosinkadink/Dinkster-Frontend
          ref: main
          path: .frontend-validation
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: matrix.os == 'linux' && matrix.run_checks
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        if: matrix.os == 'linux' && matrix.run_checks
        with:
          node-version: 22
      - name: Decode real registries with frontend main
        if: matrix.os == 'linux' && matrix.run_checks
        working-directory: .frontend-validation
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsx ../tools/validate_default_catalog.mjs "$CATALOG" .
        env:
          CATALOG: ${{ runner.temp }}/default-catalog.json

  p2p-descriptor-macos:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).macos }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - run: uv run --locked pytest -q tests/test_p2p_descriptor.py

  p2p-artifact-smoke:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[matrix.runner] }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, macos]
        python-version: ["3.12"]
        include:
          - os: linux
            runner: linux
          - os: windows
            runner: windows
          - os: macos
            runner: macos
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run --locked pytest -q tests/test_p2p_artifact_smoke.py

  torch-cpu:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 20
    env:
      ATEN_CPU_CAPABILITY: avx2
      ONEDNN_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/torch-cpu-suite
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
          run-model-tests: "false"

  model-tests:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true' && github.repository == 'Kosinkadink/Dinkster'
    name: model-tests (${{ matrix.name }})
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inference and IPAdapter, shard 1 of 8
            group: inference
            suites: inference-torch,model-ipadapter
            pytest-args: -p tools.pytest_file_shard --file-shard 1/8
          - name: inference and IPAdapter, shard 2 of 8
            group: inference
            suites: inference-torch,model-ipadapter
            pytest-args: -p tools.pytest_file_shard --file-shard 2/8
          - name: inference and IPAdapter, shard 3 of 8
            group: inference
            suites: inference-torch,model-ipadapter
            pytest-args: -p tools.pytest_file_shard --file-shard 3/8
          - name: inference and IPAdapter, shard 4 of 8
            group: inference
            suites: inference-torch,model-ipadapter
            pytest-args: -p tools.pytest_file_shard --file-shard 4/8
          - name: inference and IPAdapter, shard 5 of 8
            group: inference
            suites: inference-torch,model-ipadapter
            pytest-args: -p tools.pytest_file_shard --file-shard 5/8
          - name: inference and IPAdapter, shard 6 of 8
            group: inference
            suites: inference-torch,model-ipadapter
            pytest-args: -p tools.pytest_file_shard --file-shard 6/8
          - name: inference and IPAdapter, shard 7 of 8
            group: inference
            suites: inference-torch,model-ipadapter
            pytest-args: -p tools.pytest_file_shard --file-shard 7/8
          - name: inference and IPAdapter, shard 8 of 8
            group: inference
            suites: inference-torch,model-ipadapter
            pytest-args: -p tools.pytest_file_shard --file-shard 8/8
          - name: acceptance and benchmark
            group: acceptance
            suites: acceptance-sampling,benchmark-loader
            pytest-args: ""
          - name: HED, upscale and EfficientSAM
            group: vision-fast
            suites: hed,upscale,efficient-sam
            pytest-args: ""
          - name: Depth Anything V2, DETR and RT-DETR
            group: vision-detection
            suites: depth-anything-v2,detr,rtdetr
            pytest-args: ""
          - name: BiRefNet and Depth Anything V3
            group: vision-large
            suites: birefnet,depth-anything-v3
            pytest-args: ""
          - name: SAM 3.1
            group: vision-sam
            suites: sam31
            pytest-args: ""
    env:
      ATEN_CPU_CAPABILITY: avx2
      MKL_CBWR: COMPATIBLE
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      DINKSTER_MODEL_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/torch-cpu-suite
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
          run-model-tests: "true"
          pytest-args: ${{ matrix.pytest-args }}

  model-tests-gate:
    needs: [validation-plan, model-tests]
    if: always() && needs.validation-plan.outputs.run-heavy == 'true' && github.repository == 'Kosinkadink/Dinkster'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 2
    steps:
      - name: Verify every model-test group passed
        run: test '${{ needs.model-tests.result }}' = success

  coverage:
    # Branch-coverage floor (docs/testing.md): a ratchet, not a target.
    # Raise --cov-fail-under when real coverage rises; never lower it.
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    name: coverage (shard ${{ matrix.shard }})
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - run: >
          uv run pytest -q -p tools.pytest_file_shard
          --file-shard=${{ matrix.shard }}/4
          --cov=dinkster_api --cov=dinkster_assets
          --cov=dinkster_caches --cov=dinkster_compat_comfy --cov=dinkster_engine
          --cov=dinkster_graph --cov=dinkster_memory --cov=dinkster_nodes_foundation
          --cov=dinkster_nodes_image --cov=dinkster_nodes_media_io
          --cov=dinkster_schema --cov=dinkster_server --cov=dinkster_values
          --cov=dinkster_workers --cov-branch --cov-report=
        env:
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  coverage-gate:
    needs: [validation-plan, coverage]
    if: always() && needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 5
    steps:
      - name: Require every coverage shard to pass
        run: test '${{ needs.coverage.result }}' = success
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage and enforce the unchanged branch floor
        run: |
          uv run coverage combine coverage-data
          uv run coverage report --fail-under=80

  translation-coverage:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages
      - name: Verify translation, capability, and source-parity evidence
        run: |
          uv run --locked python tools/comfy_coverage.py \
            --templates "$WORKFLOW_TEMPLATES_ROOT/templates" --comfyui "$COMFYUI_ROOT" \
            --supported docs/supported
          uv run --locked python tools/comfy_coverage.py \
            --templates "$WORKFLOW_TEMPLATES_ROOT/templates" --comfyui "$COMFYUI_ROOT" \
            --supported docs/supported --check
          git diff --exit-code -- docs/comfy-translation-coverage.md docs/comfy-capability-evidence.md
      - name: Replay VIDEO template shapes
        run: uv run --locked pytest -q tests/test_video_alias_templates.py

  main-status:
    name: main validation status
    if: always()
    needs:
      - validation-plan
      - test
      - p2p-descriptor-macos
      - p2p-artifact-smoke
      - torch-cpu
      - model-tests-gate
      - coverage-gate
      - translation-coverage
    runs-on: ${{ fromJSON(vars.CI_RUNNERS).linux }}
    timeout-minutes: 2
    steps:
      - name: Record every lane result
        env:
          RUN_HEAVY: ${{ needs.validation-plan.outputs.run-heavy }}
          TEST_RESULT: ${{ needs.test.result }}
          MACOS_RESULT: ${{ needs.p2p-descriptor-macos.result }}
          ARTIFACT_RESULT: ${{ needs.p2p-artifact-smoke.result }}
          TORCH_RESULT: ${{ needs.torch-cpu.result }}
          MODEL_RESULT: ${{ needs.model-tests-gate.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
          TRANSLATION_RESULT: ${{ needs.translation-coverage.result }}
        run: |
          printf '{"commit":"%s","runHeavy":"%s","lanes":{"test":"%s","p2pDescriptorMacos":"%s","p2pArtifactSmoke":"%s","torchCpu":"%s","modelTests":"%s","coverage":"%s","translationCoverage":"%s"}}\n' \
            "$GITHUB_SHA" "$RUN_HEAVY" "$TEST_RESULT" "$MACOS_RESULT" "$ARTIFACT_RESULT" \
            "$TORCH_RESULT" "$MODEL_RESULT" "$COVERAGE_RESULT" "$TRANSLATION_RESULT" \
            > main-validation-status.json
          cat main-validation-status.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-validation-status
          path: main-validation-status.json
          retention-days: 30
          if-no-files-found: error
      - name: Require every selected lane to pass
        env:
          RUN_HEAVY: ${{ needs.validation-plan.outputs.run-heavy }}
          TEST_RESULT: ${{ needs.test.result }}
          MACOS_RESULT: ${{ needs.p2p-descriptor-macos.result }}
          ARTIFACT_RESULT: ${{ needs.p2p-artifact-smoke.result }}
          TORCH_RESULT: ${{ needs.torch-cpu.result }}
          MODEL_RESULT: ${{ needs.model-tests-gate.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
          TRANSLATION_RESULT: ${{ needs.translation-coverage.result }}
        run: |
          if [ "$RUN_HEAVY" = false ]; then exit 0; fi
          test "$TEST_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$ARTIFACT_RESULT" = success
          test "$TORCH_RESULT" = success
          test "$MODEL_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$TRANSLATION_RESULT" = success
