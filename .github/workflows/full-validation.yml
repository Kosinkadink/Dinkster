name: full-validation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6-22/2 * * *'
      timezone: America/Los_Angeles
    - cron: '23 10 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read

# Pushes batch behind the active run while scheduled and release validation always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || 'durable' }}
  cancel-in-progress: false

jobs:
  validation-plan:
    runs-on: [self-hosted, linux, x64]
    outputs:
      run-heavy: ${{ steps.plan.outputs.run-heavy }}
    steps:
      - name: Skip an unchanged scheduled commit
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'schedule') {
              core.setOutput('run-heavy', 'true');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'full-validation.yml',
              branch: 'main',
              status: 'success',
              per_page: 1,
            });
            core.setOutput('run-heavy', runs.data.workflow_runs[0]?.head_sha === context.sha ? 'false' : 'true');

  test:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}${{ matrix.shard_name }})
    runs-on: ${{ matrix.labels }}
    strategy:
      fail-fast: false
      matrix:
        # Windows keeps the tcp boundary transport and the shm
        # handle-lifetime rules honest (DESIGN 3.11) - it is the dominant
        # user OS, not a nice-to-have.
        include:
          - os: linux
            labels: [self-hosted, linux, x64]
            python-version: "3.12"
            shard_name: ""
            pytest_args: ""
            run_checks: true
          - os: windows
            labels: [self-hosted, windows, x64]
            python-version: "3.12"
            shard_name: ", shard 1"
            pytest_args: "-p tools.pytest_file_shard --file-shard 1/2"
            run_checks: true
          - os: windows
            labels: [self-hosted, windows, x64]
            python-version: "3.12"
            shard_name: ", shard 2"
            pytest_args: "-p tools.pytest_file_shard --file-shard 2/2"
            run_checks: false
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh tracked files with current attributes
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          git rm -r --cached -q .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git reset --hard -q HEAD
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
      - uses: ./.github/actions/configure-dinkster-identity
        with:
          deploy-key: ${{ secrets.DINKSTER_IDENTITY_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-packages
      - name: Install and verify published Windows engine dependencies
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $python = uv run --no-sync python -c "import sys; print(sys.executable)"
          uv pip install --python $python --no-deps --index-url https://pypi.org/simple `
            "dinkster-kitchen==0.2.35.post1" "dinkster-aimdo==0.5.5.post2"
          & $python -c "from importlib.metadata import version; from importlib.util import find_spec; assert find_spec('dinkster_kitchen') is not None; assert find_spec('dinkster_aimdo') is not None; assert version('dinkster-kitchen') == '0.2.35.post1'; assert version('dinkster-aimdo') == '0.5.5.post2'; print('dinkster-kitchen', version('dinkster-kitchen')); print('dinkster-aimdo', version('dinkster-aimdo'))"
      - run: uv run --locked ruff format --check .
        if: matrix.run_checks
      - run: uv run ruff check .
        if: matrix.run_checks
      - run: uv run pyright
        if: matrix.run_checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify bounded VIDEO save memory
        if: matrix.os == 'linux' && matrix.python-version == '3.12'
        run: uv run --locked python tools/video_conformance.py --rss
      - name: Verify bounded AUDIO trim and save memory
        if: matrix.os == 'linux' && matrix.python-version == '3.12'
        run: |
          mkdir -p "$RUNNER_TEMP/dinkster-audio-rss"
          uv run --locked python tools/audio_conformance.py --rss --directory "$RUNNER_TEMP/dinkster-audio-rss"
      - run: uv run python -m pytest -q ${{ matrix.pytest_args }}
        if: runner.os == 'Windows'
      - run: '"$HOME/comfy-vibe-station/run_counted_suite.sh" uv run python -m pytest -q ${{ matrix.pytest_args }}'
        if: runner.os == 'Linux'
      - run: uv run dinkster demo
        if: matrix.run_checks
      - run: uv run dinkster-isolated
        if: matrix.run_checks
      - name: Export the published default catalog
        if: matrix.os == 'linux' && matrix.python-version == '3.12'
        run: uv run --locked pytest -q tests/test_serve.py::test_default_catalog_publishes_only_owned_translation_carriers
        env:
          DINKSTER_CATALOG_WIRE_OUTPUT: ${{ runner.temp }}/default-catalog.json
      - uses: ./.github/actions/configure-dinkster-identity
        if: matrix.os == 'linux' && matrix.python-version == '3.12'
        with:
          repository: Kosinkadink/Dinkster-Frontend
          deploy-key: ${{ secrets.DINKSTER_FRONTEND_READ_KEY }}
      - uses: actions/checkout@v4
        if: matrix.os == 'linux' && matrix.python-version == '3.12'
        with:
          clean: true
          repository: Kosinkadink/Dinkster-Frontend
          ref: main
          path: .frontend-validation
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: matrix.os == 'linux' && matrix.python-version == '3.12'
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        if: matrix.os == 'linux' && matrix.python-version == '3.12'
        with:
          node-version: 22
      - name: Decode real registries with frontend main
        if: matrix.os == 'linux' && matrix.python-version == '3.12'
        working-directory: .frontend-validation
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsx ../tools/validate_default_catalog.mjs "$CATALOG" .
        env:
          CATALOG: ${{ runner.temp }}/default-catalog.json

  p2p-descriptor-macos:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/configure-dinkster-identity
        with:
          deploy-key: ${{ secrets.DINKSTER_IDENTITY_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run --locked pytest -q tests/test_p2p_descriptor.py

  p2p-artifact-smoke:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: ${{ matrix.labels }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, macos]
        python-version: ["3.12"]
        include:
          - os: linux
            labels: [self-hosted, linux, x64]
          - os: windows
            labels: [self-hosted, windows, x64]
          - os: macos
            labels: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --package dinkster-p2p
      - run: uv run --locked --package dinkster-p2p pytest -q tests/test_p2p_artifact_smoke.py

  # Intel oneMKL and AMD AVX-512 MLAS dispatch differ from the CPU goldens.
  # Require the golden CPU contract before installing or running the suite.
  torch-cpu:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: [self-hosted, Linux, X64, cpu-golden-avx2]
    env:
      ATEN_CPU_CAPABILITY: avx2
      ONEDNN_MAX_CPU_ISA: AVX2
    steps:
      - name: Require the CPU golden contract
        run: |
          grep -m1 'model name' /proc/cpuinfo
          vendor="$(grep -m1 '^vendor_id' /proc/cpuinfo | awk '{print $3}')"
          if [ "$vendor" != "AuthenticAMD" ] || ! grep -qw avx2 /proc/cpuinfo || grep -qw avx512f /proc/cpuinfo; then
            echo "CPU golden contract requires AuthenticAMD with AVX2 and without AVX-512; found vendor $vendor." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/torch-cpu-suite
        with:
          identity-deploy-key: ${{ secrets.DINKSTER_IDENTITY_DEPLOY_KEY }}
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
          run-model-tests: "false"

  model-tests:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true' && github.repository == 'Kosinkadink/Dinkster'
    name: model-tests (${{ matrix.name }})
    runs-on: [self-hosted, Linux, X64, cpu-golden-avx2]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inference and IPAdapter
            group: inference
            suites: inference-torch,model-ipadapter
          - name: acceptance and benchmark
            group: acceptance
            suites: acceptance-sampling,benchmark-loader
          - name: HED, upscale and EfficientSAM
            group: vision-fast
            suites: hed,upscale,efficient-sam
          - name: Depth Anything V2, DETR and RT-DETR
            group: vision-detection
            suites: depth-anything-v2,detr,rtdetr
          - name: BiRefNet and Depth Anything V3
            group: vision-large
            suites: birefnet,depth-anything-v3
          - name: SAM 3.1
            group: vision-sam
            suites: sam31
    env:
      ATEN_CPU_CAPABILITY: avx2
      ONEDNN_MAX_CPU_ISA: AVX2
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      DINKSTER_MODEL_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/torch-cpu-suite
        with:
          identity-deploy-key: ${{ secrets.DINKSTER_IDENTITY_DEPLOY_KEY }}
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
          run-model-tests: "true"

  model-tests-gate:
    needs: [validation-plan, model-tests]
    if: always() && needs.validation-plan.outputs.run-heavy == 'true' && github.repository == 'Kosinkadink/Dinkster'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Verify every model-test group passed
        run: test '${{ needs.model-tests.result }}' = success

  coverage:
    # Branch-coverage floor (docs/testing.md): a ratchet, not a target.
    # Raise --cov-fail-under when real coverage rises; never lower it.
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
      - uses: ./.github/actions/configure-dinkster-identity
        with:
          deploy-key: ${{ secrets.DINKSTER_IDENTITY_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: >
          "$HOME/comfy-vibe-station/run_counted_suite.sh"
          uv run pytest -q --cov=dinkster_api --cov=dinkster_assets
          --cov=dinkster_caches --cov=dinkster_compat_comfy --cov=dinkster_engine
          --cov=dinkster_graph --cov=dinkster_memory --cov=dinkster_nodes_foundation
          --cov=dinkster_nodes_image --cov=dinkster_nodes_media_io
          --cov=dinkster_schema --cov=dinkster_server --cov=dinkster_values
          --cov=dinkster_workers --cov-branch --cov-fail-under=80

  translation-coverage:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-validation-inputs
        with:
          evidence-deploy-key: ${{ secrets.DINKSTER_EVIDENCE_READ_KEY }}
      - uses: ./.github/actions/configure-dinkster-identity
        with:
          deploy-key: ${{ secrets.DINKSTER_IDENTITY_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Verify translation, capability, and source-parity evidence
        run: |
          uv run --locked python tools/comfy_coverage.py \
            --templates "$WORKFLOW_TEMPLATES_ROOT/templates" --comfyui "$COMFYUI_ROOT" \
            --supported docs/supported
          uv run --locked python tools/comfy_coverage.py \
            --templates "$WORKFLOW_TEMPLATES_ROOT/templates" --comfyui "$COMFYUI_ROOT" \
            --supported docs/supported --check
          git diff --exit-code -- docs/comfy-translation-coverage.md docs/comfy-capability-evidence.md
      - name: Replay VIDEO template shapes
        run: uv run --locked pytest -q tests/test_video_alias_templates.py
