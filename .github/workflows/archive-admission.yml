name: Public archive admission contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/archive-admission.yml
      - scripts/check_default_pack_admission.py
      - scripts/run_selected_pack_tests.py
      - scripts/_selected_pack_test_child.py
      - scripts/setup_probe_jail.sh
      - packages/dinkster-registry/src/dinkster_registry/*admission.py
      - packages/dinkster-workers/src/dinkster_workers/pack_wheel.py
      - packages/dinkster-workers/src/dinkster_workers/sandbox*
      - packages/dinkster-workers/src/dinkster_workers/doctor*
      - tests/test_archive_admission.py
      - tests/test_pack_archive.py
      - tests/test_pack_wheel.py
      - tests/test_sandbox.py
      - tests/test_doctor.py
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure the full Linux admission jail
        run: bash scripts/setup_probe_jail.sh
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - name: Verify archive fixture admission with full isolation
        env:
          DINKSTER_TEST_FULL_PROBE: "1"
        run: >-
          uv run --locked --all-packages pytest -q tests/test_archive_admission.py
          tests/test_pack_archive.py -k 'service_fixture or registry_'
