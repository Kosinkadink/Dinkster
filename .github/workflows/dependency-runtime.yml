name: Dependency runtime checks

on:
  pull_request:
    paths:
      - .github/workflows/dependency-runtime.yml
      - .github/actions/torch-cpu-suite/action.yml
      - scripts/setup_envs.sh
      - scripts/setup_envs.ps1
      - tools/minimax_h3_multigpu_receipt.py
      - tests/test_minimax_h3_multigpu_receipt.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  receipt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages
      - name: Test receipt generation on the native platform
        run: uv run --locked python -m pytest -q tests/test_minimax_h3_multigpu_receipt.py
      - name: Resolve and install the constrained Linux CPU runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv export --locked --all-packages --no-emit-project --no-emit-workspace \
            --output-file "$RUNNER_TEMP/torch-constraints.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/cpu-runtime"
          uv pip install --python "$RUNNER_TEMP/cpu-runtime/bin/python" \
            --constraint "$RUNNER_TEMP/torch-constraints.txt" --torch-backend cpu \
            torch==2.14.1+cpu torchvision==0.29.1+cpu
          uv pip check --python "$RUNNER_TEMP/cpu-runtime/bin/python"
          "$RUNNER_TEMP/cpu-runtime/bin/python" - <<'PY'
          import torch
          import torchvision

          assert torch.__version__ == '2.14.1+cpu', torch.__version__
          assert torchvision.__version__ == '0.29.1+cpu', torchvision.__version__
          boxes = torch.tensor([[0., 0., 2., 2.], [0., 0., 1., 1.], [3., 3., 4., 4.]])
          scores = torch.tensor([0.9, 0.8, 0.7])
          assert torchvision.ops.nms(boxes, scores, 0.2).tolist() == [0, 2]
          print('Constrained CPU torch/torchvision imports and NMS passed')
          PY
