name: OpenTimelineIO Python 3.14 wheels

on:
  pull_request:
    paths:
      - .github/workflows/opentimelineio-wheels.yml
      - scripts/opentimelineio_source.json
      - scripts/record_opentimelineio_wheels.py
  push:
    tags:
      - "opentimelineio-wheels-*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Read the pinned upstream commit
        id: source
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          pin = json.loads(Path('scripts/opentimelineio_source.json').read_text())
          print(f"repository={pin['repository']}")
          print(f"commit={pin['commit']}")
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          submodules: recursive
          path: upstream
          persist-credentials: false
      - name: Build and test the repaired binary wheel
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae
        with:
          package-dir: upstream
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp314-*
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_BEFORE_BUILD_LINUX: yum install -y zlib-devel
          CIBW_BEFORE_BUILD_WINDOWS: vcpkg install zlib:x64-windows && python -m pip install delvewheel
          CIBW_ENVIRONMENT_WINDOWS: 'CMAKE_PREFIX_PATH=C:/vcpkg/installed/x64-windows PATH="C:/vcpkg/installed/x64-windows/bin;$PATH"'
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: python -m delvewheel repair --add-path C:/vcpkg/installed/x64-windows/bin -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: urllib3
          CIBW_TEST_COMMAND: python -m unittest discover -s {project}/tests
      - name: Record source and binary provenance
        shell: bash
        run: |
          python -m pip install packaging twine
          python -m twine check wheelhouse/*.whl
          python scripts/record_opentimelineio_wheels.py \
            --source upstream --wheels wheelhouse --output wheelhouse --target "${{ matrix.target }}"
          cp upstream/LICENSE.txt wheelhouse/OpenTimelineIO-LICENSE-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: opentimelineio-${{ matrix.target }}
          path: wheelhouse/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/opentimelineio-wheels-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opentimelineio-*
          merge-multiple: true
          path: wheelhouse
      - name: Assemble release notes
        run: cat wheelhouse/*.md > release-notes.md
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: context.ref.replace('refs/tags/', '') });
              core.setFailed('Refusing to replace an existing wheel release');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          make_latest: false
          fail_on_unmatched_files: true
          files: wheelhouse/*
