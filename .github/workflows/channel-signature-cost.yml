name: Channel signature cost

on:
  pull_request:
    paths:
      - .github/workflows/channel-signature-cost.yml

permissions:
  contents: read

jobs:
  measure:
    name: Channel signature cost (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CUDA_VISIBLE_DEVICES: ""
      DINKSTER_ACCELERATOR: cpu
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Measure actual channel signer and reader
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 https://releases.dinkster.org/channels/stable.json -o "$RUNNER_TEMP/channel-cost-input.json"
          export CHANNEL_COST_INPUT="$RUNNER_TEMP/channel-cost-input.json"
          uv run --no-project --python 3.12 --with ./packages/dinkster-supervisor --with cryptography==50.0.1 python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          import statistics
          import sys
          import time
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, NoEncryption, PrivateFormat, load_pem_private_key
          from dinkster_supervisor.environment_channel_signatures import sign_channel, verify_channel

          document = json.loads(Path(os.environ['CHANNEL_COST_INPUT']).read_bytes())
          payload = document.get('signed', document)
          payload.pop('channel', None)
          key = Ed25519PrivateKey.generate()
          public = key.public_key().public_bytes_raw()
          keys = {'sha256:' + hashlib.sha256(public).hexdigest(): public}
          pem = key.private_bytes(Encoding.PEM, PrivateFormat.PKCS8, NoEncryption())
          envelope = sign_channel(payload, 'nightly', key)
          assert verify_channel(envelope, 'nightly', keys=keys)['channel'] == 'nightly'
          for refused, channel in [(envelope, 'stable'), (envelope.replace(b'"nightly"', b'"stable"'), 'stable')]:
              try:
                  verify_channel(refused, channel, keys=keys)
              except Exception:
                  pass
              else:
                  raise AssertionError('signature refusal control failed')

          def measure(operation):
              for _ in range(100):
                  operation()
              batches = []
              for _ in range(7):
                  start = time.perf_counter_ns()
                  for _ in range(10000):
                      operation()
                  batches.append((time.perf_counter_ns() - start) / 10000 / 1e6)
              return {'median_ms': statistics.median(batches), 'slowest_batch_mean_ms': max(batches), 'batch_means_ms': batches}

          print(json.dumps({
              'head': os.environ['SOURCE_HEAD'], 'os': platform.platform(),
              'cpu': platform.processor(), 'python': sys.version,
              'cryptography': importlib.metadata.version('cryptography'),
              'envelope_bytes': len(envelope), 'warmups': 100, 'batches': 7, 'checks_per_batch': 10000,
              'sign_channel_including_pem_load': measure(lambda: sign_channel(payload, 'nightly', load_pem_private_key(pem, None))),
              'verify_channel_full_reader': measure(lambda: verify_channel(envelope, 'nightly', keys=keys)),
          }, indent=2))
          PY
