name: Windows Git fixture

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/windows-git-fixture.yml
      - tests/fixtures/git_sources.py
      - tests/test_git_sources.py

permissions:
  contents: read

jobs:
  https:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      DINKSTER_ACCELERATOR: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: ./.github/actions/prepare-contributor-generation
        with:
          python: "3.14.10"
      - name: Verify local HTTPS acquisition, refusal and certificate teardown
        shell: bash
        run: python scripts/develop.py run -- python -m pytest -n0 -q tests/test_git_sources.py
