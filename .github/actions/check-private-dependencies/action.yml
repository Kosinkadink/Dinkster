name: Check private dependency access
description: Record a successful not-run result when required repository secrets are unavailable
inputs:
  secret-name-1:
    description: First required repository secret name
    required: true
  secret-value-1:
    description: First required repository secret value
    required: true
  secret-name-2:
    description: Second required repository secret name
    default: ""
  secret-value-2:
    description: Second required repository secret value
    default: ""
  force-not-run:
    description: Simulate unavailable secrets for fork-policy verification
    default: "false"
outputs:
  available:
    description: Whether every required repository secret is available
    value: ${{ steps.check.outputs.available }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        FORCE_NOT_RUN: ${{ inputs.force-not-run }}
        SECRET_NAME_1: ${{ inputs.secret-name-1 }}
        SECRET_VALUE_1: ${{ inputs.secret-value-1 }}
        SECRET_NAME_2: ${{ inputs.secret-name-2 }}
        SECRET_VALUE_2: ${{ inputs.secret-value-2 }}
      run: |
        missing=()
        if [ "${FORCE_NOT_RUN,,}" = "true" ] || [ -z "$SECRET_VALUE_1" ]; then
          missing+=("$SECRET_NAME_1")
        fi
        if [ -n "$SECRET_NAME_2" ] && { [ "${FORCE_NOT_RUN,,}" = "true" ] || [ -z "$SECRET_VALUE_2" ]; }; then
          missing+=("$SECRET_NAME_2")
        fi
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        for name in "${missing[@]}"; do
          echo "not run: requires repository secret $name" >> "$GITHUB_STEP_SUMMARY"
        done
        echo "available=false" >> "$GITHUB_OUTPUT"
