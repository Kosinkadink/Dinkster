name: Configure private dependency access
description: Configure read-only SSH access without writing a private key to disk
inputs:
  deploy-key:
    description: Read-only repository deploy key
    required: true
  repository:
    description: Repository the deploy key can read
    default: Kosinkadink/dinkster-identity
runs:
  using: node20
  main: agent.cjs
  post: agent.cjs
  post-if: always()
