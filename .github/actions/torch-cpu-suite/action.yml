name: torch-cpu suite
description: Set up CPU-only dependencies and run the comfy or no-model vision suite
inputs:
  suite:
    description: Non-model suites to run (all, comfy, or vision)
    default: "all"
  comfy-pytest-args:
    description: Additional pytest arguments for the comfy suite
    default: ""
  evidence-deploy-key:
    description: Read-only dinkster-evidence deploy key for vision root contracts
    required: false
runs:
  using: composite
  steps:
    - uses: ./.github/actions/prepare-validation-inputs
      if: inputs.suite != 'comfy'
      with:
        evidence-deploy-key: ${{ inputs.evidence-deploy-key }}
        coverage: "false"
    - uses: astral-sh/setup-uv@v5
    - name: Prepare the CPU contributor generation
      shell: bash
      run: |
        arguments=()
        if [ -n "${DINKSTER_EVIDENCE_ROOT:-}" ]; then
          arguments+=(--library-source "$DINKSTER_EVIDENCE_ROOT/packages/dinkster-acceptance")
        fi
        uv run --no-project python scripts/develop.py setup --variant linux-cpu --yes "${arguments[@]}"
    - name: Assert pinned AVX2 dispatch
      shell: bash
      run: |
        grep -m1 'model name' /proc/cpuinfo
        python scripts/develop.py run -- python - <<'PY'
        import torch
        capability = torch.backends.cpu.get_cpu_capability()
        print(f"torch {torch.__version__} ATen CPU capability: {capability}")
        assert capability == "AVX2", capability
        PY
    - name: Test CPU node pack contracts
      if: inputs.suite != 'vision'
      shell: bash
      run: |
        for package in packages/dinkster-nodes-*; do
          case "$package" in
            *-vision-*|*-dev|*-remote) continue ;;
          esac
          if [ -d "$package/tests" ]; then
            python scripts/develop.py run -- python -m pytest -q "$package/tests" ${{ inputs.comfy-pytest-args }}
          fi
        done
        python scripts/develop.py run -- python -m pytest --import-mode=importlib -q tests/first_party_runtime tests/test_comfy_vae_nodes.py ${{ inputs.comfy-pytest-args }}
    - name: Check vision types
      if: inputs.suite != 'comfy'
      shell: bash
      run: python scripts/develop.py run -- pyright packages/dinkster-nodes-vision-*/src
    - name: Test CPU vision and root contracts
      if: inputs.suite != 'comfy'
      shell: bash
      env:
        DINKSTER_ACCELERATOR: cpu
      run: |
        for package in packages/dinkster-nodes-vision-*; do
          if [ -d "$package/tests" ]; then
            python scripts/develop.py run -- python -m pytest -q "$package/tests"
          fi
        done
        python scripts/develop.py run -- python -m pytest -v \
          tests/test_audio_materializer.py \
          tests/test_cpu_pack_composition.py \
          tests/workers/test_attention.py \
          tests/test_fork_loader_torch.py \
          tests/workers/test_legacy_sources.py \
          tests/test_compose.py::test_full_free_releases_tensors_held_by_memory_execution_cache
        python scripts/develop.py run -- python -m pytest -v \
          .evidence-source/h3-parity/test_run_comparison.py \
          .evidence-source/model-family-comparison/test_validate.py
