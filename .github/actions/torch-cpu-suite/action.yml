name: torch-cpu suite
description: >
  Set up the torch environment and run the torch-dependent test suites
  under the pinned CPU dispatch (job env must set ATEN_CPU_CAPABILITY
  and ONEDNN_MAX_CPU_ISA). Model lanes require explicit opt-in;
  setup, source receipts, and typechecks always run.
inputs:
  run-model-tests:
    description: Run complete inference, IPAdapter, vision, and benchmark model-loader lanes
    default: "false"
  identity-deploy-key:
    description: Read-only dinkster-identity deploy key
    required: true
  evidence-deploy-key:
    description: Read-only dinkster-evidence deploy key
    required: true
runs:
  using: composite
  steps:
    - name: Reclaim runner disk
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        df -h /
    - uses: ./.github/actions/configure-dinkster-identity
      with:
        deploy-key: ${{ inputs.identity-deploy-key }}
    - uses: ./.github/actions/prepare-validation-inputs
      with:
        evidence-deploy-key: ${{ inputs.evidence-deploy-key }}
        coverage: "false"
    - uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: >
        uv export --locked --all-packages
        --no-emit-project --no-emit-workspace
        --output-file /tmp/torch-constraints.txt
    - shell: bash
      run: UV_CONSTRAINT=/tmp/torch-constraints.txt ./scripts/setup_envs.sh
    - shell: bash
      run: >
        uv pip install --python .venv-torch/bin/python
        --constraint /tmp/torch-constraints.txt
        --index-url https://download.pytorch.org/whl/cpu
        torch==2.13.0+cpu
    - name: Checkout pinned ComfyUI source
      shell: bash
      run: |
        git init --quiet /tmp/comfyui-source
        git -C /tmp/comfyui-source remote add origin https://github.com/Comfy-Org/ComfyUI.git
        git -C /tmp/comfyui-source fetch --quiet --depth=1 --filter=blob:none origin \
          b78cec879b9460d5cb25228a83a942fb78d2cd24 \
          c67885b14556cf3e4e061862925282d403d09862 \
          15eb748b3ec5f8a0a2d470b7fb280e2d7579f916 \
          8a33128f2f8c5585c57486c07de481241e70a39c
        git -C /tmp/comfyui-source checkout --quiet --detach b78cec879b9460d5cb25228a83a942fb78d2cd24
    - name: Checkout pinned workflow templates
      shell: bash
      run: |
        git init --quiet /tmp/workflow-templates-source
        git -C /tmp/workflow-templates-source remote add origin https://github.com/Comfy-Org/workflow_templates.git
        git -C /tmp/workflow-templates-source fetch --quiet --depth=1 --filter=blob:none origin d3b4a9e89573162b005961865164c18c8ae2206b
        git -C /tmp/workflow-templates-source checkout --quiet --detach FETCH_HEAD
    - name: Acquire pinned Impact Pack source
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output /tmp/impact-special-samplers.py \
          https://raw.githubusercontent.com/ltdrdata/ComfyUI-Impact-Pack/429d0159ad429e64d2b3916e6e7be9c22d025c3c/modules/impact/special_samplers.py
        curl --fail --location --retry 3 \
          --output /tmp/impact-core.py \
          https://raw.githubusercontent.com/ltdrdata/ComfyUI-Impact-Pack/429d0159ad429e64d2b3916e6e7be9c22d025c3c/modules/impact/core.py
        curl --fail --location --retry 3 \
          --output /tmp/inspire-sampler-nodes.py \
          https://raw.githubusercontent.com/ltdrdata/ComfyUI-Inspire-Pack/6b2ca017a168bcdba5f22c258b3b86c5c76470ca/inspire/sampler_nodes.py
        echo "32647b60dd169f953b04ebdacf9e2a59c3870ecf442f01f3f76d96906283989c  /tmp/impact-special-samplers.py" | sha256sum --check
        echo "7989de178999904cacf440bd6c9fd6d250ff5f8df8a4a2dad7abe33d2dfacdd5  /tmp/impact-core.py" | sha256sum --check
        echo "153c5cbf334ca67176569625d10feac924bb289a8c18321bcaee0d9a99d18c51  /tmp/inspire-sampler-nodes.py" | sha256sum --check
    - name: Verify source-generated parity receipts
      shell: bash
      env:
        COMFYUI_ROOT: /tmp/comfyui-source
        WORKFLOW_TEMPLATES_ROOT: /tmp/workflow-templates-source
        IMPACT_PACK_SOURCE: /tmp/impact-special-samplers.py
        IMPACT_PACK_CORE_SOURCE: /tmp/impact-core.py
        INSPIRE_PACK_SOURCE: /tmp/inspire-sampler-nodes.py
      run: .venv-torch/bin/python tools/gen_comfy_source_parity_receipts.py --check
    - name: Test source-parity receipt generation
      shell: bash
      env:
        COMFYUI_ROOT: /tmp/comfyui-source
        WORKFLOW_TEMPLATES_ROOT: /tmp/workflow-templates-source
        IMPACT_PACK_SOURCE: /tmp/impact-special-samplers.py
        IMPACT_PACK_CORE_SOURCE: /tmp/impact-core.py
        INSPIRE_PACK_SOURCE: /tmp/inspire-sampler-nodes.py
      run: .venv-torch/bin/python -m pytest -q tests/test_gen_comfy_source_parity_receipts.py
    # Typecheck the torch-side pyright projects before the test suites:
    # the root pyright project excludes every package that imports torch,
    # so these are the only hosted runs that see them (#981). They resolve
    # against the .venv-torch built above. The vision provider packages
    # are checked further down next to their suites.
    # dinkster-kernels stays a local GPU-machine gate: its project resolves
    # against .venv-gpu (CUDA torch + triton), which CPU-only hosted
    # runners cannot build.
    - shell: bash
      run: .venv/bin/pyright -p .evidence-source/packages/dinkster-acceptance --pythonpath .venv-torch/bin/python
    - shell: bash
      run: >
        .venv-torch/bin/python -m pytest -q
        .evidence-source/packages/dinkster-acceptance/tests/test_acceptance_closure.py
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-inference-torch
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-training-torch
    - name: Assert pinned CPU dispatch
      shell: bash
      run: |
        grep -m1 'model name' /proc/cpuinfo
        vendor="$(grep -m1 '^vendor_id' /proc/cpuinfo | awk '{print $3}')"
        echo "vendor_id: $vendor"
        if [ "$vendor" != "AuthenticAMD" ] || ! grep -qw avx2 /proc/cpuinfo || grep -qw avx512f /proc/cpuinfo; then
          echo "Exact CPU vectors require an AMD host without AVX-512 (#900, #1045)."
          exit 1
        fi
        echo "no avx512f"
        .venv-torch/bin/python - <<'EOF'
        import torch
        capability = torch.backends.cpu.get_cpu_capability()
        print(f"torch {torch.__version__} ATen CPU capability: {capability}")
        assert capability == "AVX2", capability
        EOF
        # Log the oneMKL CNR state actually engaged for GEMM. oneMKL is
        # deliberately unpinned (MKL_CBWR unset), so CNR:OFF is expected;
        # the engaged state is recorded for divergence forensics, not
        # asserted. The probe itself must succeed - only the grep is
        # non-asserting, so a probe failure fails the step instead of
        # being masked.
        MKL_VERBOSE=1 .venv-torch/bin/python -c "import torch; a = torch.randn(512, 512); b = a @ a" > /tmp/mkl-verbose.log 2>&1
        grep -m1 -o 'CNR:[A-Z0-9_,]*' /tmp/mkl-verbose.log || echo 'no MKL verbose GEMM line'
    - name: Test training runtime
      shell: bash
      env:
        OMP_NUM_THREADS: "4"
        MKL_NUM_THREADS: "4"
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-training-torch/tests
    - name: Test inference and IPAdapter
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: >
        .venv-torch/bin/python -m pytest -q
        packages/dinkster-inference-torch/tests
        packages/dinkster-model-ipadapter/tests
    - name: Test acceptance sampling
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: >
        .venv-torch/bin/python -m pytest -q
        .evidence-source/packages/dinkster-acceptance/tests/test_acceptance_sampling.py
    - name: Acquire pinned line and edge parity artifacts
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output /tmp/ControlNetHED.pth \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/ControlNetHED.pth
        curl --fail --location --retry 3 \
          --output /tmp/sk_model.pth \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/sk_model.pth
        curl --fail --location --retry 3 \
          --output /tmp/sk_model2.pth \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/sk_model2.pth
        curl --fail --location --retry 3 \
          --output /tmp/netG.pth \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/netG.pth
        curl --fail --location --retry 3 \
          --output /tmp/erika.pth \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/erika.pth
        curl --fail --location --retry 3 \
          --output /tmp/mlsd_large_512_fp32.pth \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/mlsd_large_512_fp32.pth
        curl --fail --location --retry 3 \
          --output /tmp/7_model.pth \
          https://huggingface.co/bdsqlsz/qinglong_controlnet-lllite/resolve/67006a35a5955437d118490bfec822402eff09f5/Annotators/7_model.pth
        curl --fail --location --retry 3 \
          --output /tmp/MTEED.pth \
          https://huggingface.co/TheMistoAI/MistoLine/resolve/1d9d0b3d48b295cf70d80a0f839a3055672f8393/Anyline/MTEED.pth
        sha256sum --check <<'EOF'
        5ca93762ffd68a29fee1af9d495bf6aab80ae86f08905fb35472a083a4c7a8fa  /tmp/ControlNetHED.pth
        c686ced2a666b4850b4bb6ccf0748031c3eda9f822de73a34b8979970d90f0c6  /tmp/sk_model.pth
        30a534781061f34e83bb9406b4335da4ff2616c95d22a585c1245aa8363e74e0  /tmp/sk_model2.pth
        ccabdcc3f5cf3c07cf65d58776acb21df7dfda825cdc70c9766a93fd62bfc488  /tmp/netG.pth
        badbd6baf013cefbd98993307b02cc14a26c770d067416e4fdecc8720b88feeb  /tmp/erika.pth
        5696f168eb2c30d4374bbfd45436f7415bb4d88da29bea97eea0101520fba082  /tmp/mlsd_large_512_fp32.pth
        b9037964149c55156c6adbffdfbd7e8ca7d2ef2a4d90573520efa7f3a1aacf06  /tmp/7_model.pth
        a3c2d8a8ce9422555c787160bd46362d761325a565333c0e3f6a53e0bae2abdb  /tmp/MTEED.pth
        EOF
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-vision-hed
    - shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-hed/tests
    - if: inputs.run-model-tests == 'true'
      shell: bash
      env:
        DINKSTER_HED_TEST_MODEL: /tmp/ControlNetHED.pth
        DINKSTER_LINEART_REALISTIC_TEST_MODEL: /tmp/sk_model.pth
        DINKSTER_LINEART_REALISTIC_COARSE_TEST_MODEL: /tmp/sk_model2.pth
        DINKSTER_LINEART_ANIME_TEST_MODEL: /tmp/netG.pth
        DINKSTER_LINEART_MANGA_TEST_MODEL: /tmp/erika.pth
        DINKSTER_MLSD_TEST_MODEL: /tmp/mlsd_large_512_fp32.pth
        DINKSTER_TEED_TEST_MODEL: /tmp/7_model.pth
        DINKSTER_MTEED_TEST_MODEL: /tmp/MTEED.pth
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-hed/tests
    - name: Acquire pinned upscale parity artifacts
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output /tmp/RealESRGAN_x4plus_anime_6B.pth \
          https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
        curl --fail --location --retry 3 \
          --output /tmp/realesr-general-x4v3.pth \
          https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
        sha256sum --check <<'EOF'
        f872d837d3c90ed2e05227bed711af5671a6fd1c9f7d7e91c911a61f155e99da  /tmp/RealESRGAN_x4plus_anime_6B.pth
        8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292  /tmp/realesr-general-x4v3.pth
        EOF
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-vision-upscale
    - shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-upscale/tests
    - if: inputs.run-model-tests == 'true'
      shell: bash
      env:
        DINKSTER_UPSCALE_TEST_ANIME6B: /tmp/RealESRGAN_x4plus_anime_6B.pth
        DINKSTER_UPSCALE_TEST_GENERAL: /tmp/realesr-general-x4v3.pth
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-upscale/tests
    - name: Acquire pinned Depth Anything V2 parity artifact
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output /tmp/depth-anything-v2-large.safetensors \
          https://huggingface.co/depth-anything/Depth-Anything-V2-Large-hf/resolve/7581137eff8d4e94f6e796d3baea0e9fa79b22d2/model.safetensors
        echo "4e01e34ed5549b529b70b92d53226bc370f03041977b390d3dde45d47f516cf9  /tmp/depth-anything-v2-large.safetensors" | sha256sum --check
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-vision-depth-anything-v2
    - shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-depth-anything-v2/tests
    - if: inputs.run-model-tests == 'true'
      shell: bash
      env:
        DINKSTER_DEPTH_ANYTHING_V2_TEST_MODEL: /tmp/depth-anything-v2-large.safetensors
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-depth-anything-v2/tests
    - name: Acquire pinned DETR parity artifact
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output /tmp/detr-r50-e632da11.pth \
          https://dl.fbaipublicfiles.com/detr/detr-r50-e632da11.pth
        echo "e632da11ec76ae67bac2f8579fbed3724e08dead7d200ca13e019b197784eadc  /tmp/detr-r50-e632da11.pth" | sha256sum --check
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-vision-detr
    - shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-detr/tests
    - if: inputs.run-model-tests == 'true'
      shell: bash
      env:
        DINKSTER_DETR_TEST_MODEL: /tmp/detr-r50-e632da11.pth
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-detr/tests
    - name: Acquire pinned RT-DETR parity artifact
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output /tmp/rt_detr_v4-x-hgnet_fp16.safetensors \
          https://huggingface.co/Comfy-Org/SDPose/resolve/f122ac7976997885e3bfeab2bb3a537a6bc250bc/diffusion_models/rt_detr_v4-x-hgnet_fp16.safetensors
        echo "581f9af9bbabb664d1891cbccd823308b176ecd409146f954dfa39af3bec2476  /tmp/rt_detr_v4-x-hgnet_fp16.safetensors" | sha256sum --check
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-vision-rtdetr
    - shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-rtdetr/tests
    - if: inputs.run-model-tests == 'true'
      shell: bash
      env:
        DINKSTER_RTDETR_TEST_MODEL: /tmp/rt_detr_v4-x-hgnet_fp16.safetensors
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-rtdetr/tests
    - name: Acquire pinned EfficientSAM parity artifacts
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output /tmp/efficient-sam-vitt-encoder-d525f622.onnx \
          https://github.com/yformer/EfficientSAM/raw/d525f622e6f640acf5a0fc37c7ca1f243da5bde0/weights/efficient_sam_vitt_encoder.onnx
        curl --fail --location --retry 3 \
          --output /tmp/efficient-sam-vitt-decoder-d525f622.onnx \
          https://github.com/yformer/EfficientSAM/raw/d525f622e6f640acf5a0fc37c7ca1f243da5bde0/weights/efficient_sam_vitt_decoder.onnx
        sha256sum --check <<'EOF'
        84ed466ffcc5c1f8d08409bc34a23bb364ab2c15e402cb12d4335a42be0e0951  /tmp/efficient-sam-vitt-encoder-d525f622.onnx
        a62f8fa5ea080447c0689418d69e58f1e83e0b7adf9c142e2bd9bcc8045c0b11  /tmp/efficient-sam-vitt-decoder-d525f622.onnx
        EOF
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-vision-efficient-sam
    - shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-efficient-sam/tests
    - if: inputs.run-model-tests == 'true'
      shell: bash
      env:
        DINKSTER_EFFICIENT_SAM_TEST_ENCODER: /tmp/efficient-sam-vitt-encoder-d525f622.onnx
        DINKSTER_EFFICIENT_SAM_TEST_DECODER: /tmp/efficient-sam-vitt-decoder-d525f622.onnx
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-efficient-sam/tests
    - name: Acquire pinned BiRefNet parity artifact
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output /tmp/birefnet.safetensors \
          https://huggingface.co/Comfy-Org/BiRefNet/resolve/35767b272f2846752a3aee1259abdd4586f735c8/background_removal/birefnet.safetensors
        echo "9ab37426bf4de0567af6b5d21b16151357149139362e6e8992021b8ce356a154  /tmp/birefnet.safetensors" | sha256sum --check
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-vision-birefnet
    - shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-birefnet/tests
    - if: inputs.run-model-tests == 'true'
      shell: bash
      env:
        DINKSTER_BIREFNET_TEST_MODEL: /tmp/birefnet.safetensors
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-birefnet/tests
    - name: Acquire pinned Depth Anything 3 Mono Large parity artifact
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output /tmp/depth-anything-3-mono-large.safetensors \
          https://huggingface.co/Comfy-Org/Depth-Anything-3/resolve/913d1a7ab58ddbfbf94a33bf536c4fc2ff25465d/geometry_estimation/depth_anything_3_mono_large.safetensors
        echo "9b44eda5bedba5b4e125686fdb79d1db309c1b9785277576eb930f885b008f96  /tmp/depth-anything-3-mono-large.safetensors" | sha256sum --check
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-vision-depth-anything-v3
    - shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-depth-anything-v3/tests
    - if: inputs.run-model-tests == 'true'
      shell: bash
      env:
        DINKSTER_DEPTH_ANYTHING_V3_TEST_MODEL: /tmp/depth-anything-3-mono-large.safetensors
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-depth-anything-v3/tests
    - name: Acquire pinned SAM 3.1 parity artifact
      if: inputs.run-model-tests == 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output /tmp/sam3.1_multiplex_fp16.safetensors \
          https://huggingface.co/Comfy-Org/sam3.1/resolve/f38cd62b71494b53ac2b56ca36e24f3c8d565581/checkpoints/sam3.1_multiplex_fp16.safetensors
        echo "9ba99c92703c2e8b4f47de2d34a539bb8e18923049e238b780d70dbe6368eb03  /tmp/sam3.1_multiplex_fp16.safetensors" | sha256sum --check
    - shell: bash
      run: .venv/bin/pyright -p packages/dinkster-vision-sam31
    - shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-sam31/tests
    - if: inputs.run-model-tests == 'true'
      shell: bash
      env:
        DINKSTER_SAM31_TEST_MODEL: /tmp/sam3.1_multiplex_fp16.safetensors
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-vision-sam31/tests
    # Torch-dependent benchmark-harness tests skip in the torch-free
    # root suite; this is the lane that actually executes them.
    - if: inputs.run-model-tests == 'true'
      shell: bash
      run: >
        .venv-torch/bin/python -m pytest -q
        "tests/test_benchmark_inference.py::test_minimax_h3_identities_are_accepted_by_the_production_dit_loader"
