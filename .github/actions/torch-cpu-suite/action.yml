name: torch-cpu suite
description: Set up CPU-only dependencies and run the comfy or no-model vision suite
inputs:
  suite:
    description: Non-model suites to run (all, comfy, or vision)
    default: "all"
  comfy-pytest-args:
    description: Additional pytest arguments for the comfy suite
    default: ""
  evidence-deploy-key:
    description: Read-only dinkster-evidence deploy key for vision root contracts
    required: false
runs:
  using: composite
  steps:
    - uses: ./.github/actions/prepare-validation-inputs
      if: inputs.suite != 'comfy'
      with:
        evidence-deploy-key: ${{ inputs.evidence-deploy-key }}
        coverage: "false"
    - uses: astral-sh/setup-uv@v5
    - name: Install the published CPU base and locked workspace
      shell: bash
      run: uv run --no-project python scripts/setup_envs.py --variant linux-cpu
    - name: Restore CPU software shader renderer packages
      id: renderer-apt-cache
      if: inputs.suite != 'vision'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ${{ runner.temp }}/renderer-apt-cache/archives
          ${{ runner.temp }}/renderer-apt-cache/lists
        key: ${{ runner.os }}-renderer-apt-${{ hashFiles('.github/actions/torch-cpu-suite/action.yml') }}
    - name: Install the CPU software shader renderer
      if: inputs.suite != 'vision'
      timeout-minutes: 2
      shell: bash
      env:
        RENDERER_APT_CACHE: ${{ runner.temp }}/renderer-apt-cache
        RENDERER_APT_CACHE_HIT: ${{ steps.renderer-apt-cache.outputs.cache-hit }}
      run: |
        echo "Install the CPU software shader renderer: preparing package archive"
        mkdir -p "$RENDERER_APT_CACHE/archives/partial" "$RENDERER_APT_CACHE/lists/partial"
        apt_options=(
          -o "Dir::Cache::archives=$RENDERER_APT_CACHE/archives"
          -o "Dir::State::lists=$RENDERER_APT_CACHE/lists"
          -o Acquire::http::Timeout=30
          -o Acquire::Retries=3
        )
        if [ "$RENDERER_APT_CACHE_HIT" != "true" ]; then
          echo "Install the CPU software shader renderer: downloading packages"
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" --download-only install -y --no-install-recommends libegl1 libgles2 libvulkan1 mesa-vulkan-drivers
        else
          echo "Install the CPU software shader renderer: cached packages restored"
        fi
        sudo apt-get "${apt_options[@]}" --no-download install -y --no-install-recommends libegl1 libgles2 libvulkan1 mesa-vulkan-drivers
        lvp=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
        test -n "$lvp"
        echo "VK_ICD_FILENAMES=$lvp" >> "$GITHUB_ENV"
        echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
    - name: Assert pinned AVX2 dispatch
      shell: bash
      run: |
        grep -m1 'model name' /proc/cpuinfo
        .venv/bin/python - <<'PY'
        import torch
        capability = torch.backends.cpu.get_cpu_capability()
        print(f"torch {torch.__version__} ATen CPU capability: {capability}")
        assert capability == "AVX2", capability
        PY
    - name: Test CPU comfy contracts
      if: inputs.suite != 'vision'
      shell: bash
      run: .venv/bin/python -m pytest -q packages/dinkster-nodes-comfy/tests ${{ inputs.comfy-pytest-args }}
    - name: Check vision types
      if: inputs.suite != 'comfy'
      shell: bash
      run: .venv/bin/pyright -p packages/dinkster-nodes-vision
    - name: Test CPU vision and root contracts
      if: inputs.suite != 'comfy'
      shell: bash
      env:
        DINKSTER_ACCELERATOR: cpu
      run: |
        .venv/bin/python -m pytest -q packages/dinkster-nodes-vision/tests
        .venv/bin/python -m pytest -v \
          tests/test_audio_materializer.py \
          tests/test_cpu_pack_composition.py \
          tests/test_minimax_h3_multigpu_receipt.py \
          tests/test_multigpu_modes.py \
          tests/test_fork_attention.py \
          tests/test_fork_loader_torch.py \
          tests/test_legacy_sources.py \
          tests/test_compose.py::test_full_free_releases_tensors_held_by_memory_execution_cache
        .venv/bin/python -m pytest -v \
          .evidence-source/h3-parity/test_run_comparison.py \
          .evidence-source/model-family-comparison/test_validate.py
