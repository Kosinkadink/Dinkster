name: torch-cpu suite
description: >
  Set up the torch environment and run the torch-dependent test suites
  under the pinned CPU dispatch (job env must set ATEN_CPU_CAPABILITY
  and ONEDNN_MAX_CPU_ISA). Model lanes require explicit opt-in;
  setup, source receipts, and typechecks always run.
inputs:
  run-model-tests:
    description: Run complete inference, IPAdapter, vision, and benchmark model-loader lanes
    default: "false"
  pytest-args:
    description: Additional pytest arguments for the inference and IPAdapter suites
    default: ""
  identity-deploy-key:
    description: Read-only dinkster-identity deploy key
    required: true
  evidence-deploy-key:
    description: Read-only dinkster-evidence deploy key
    required: true
runs:
  using: composite
  steps:
    - name: Reclaim runner disk
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        df -h /
    - uses: ./.github/actions/prepare-validation-inputs
      with:
        evidence-deploy-key: ${{ inputs.evidence-deploy-key }}
        coverage: "false"
    - uses: ./.github/actions/configure-dinkster-identity
      with:
        deploy-key: ${{ inputs.identity-deploy-key }}
    - uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: >
        uv export --locked --all-packages
        --no-emit-project --no-emit-workspace
        --output-file "${{ runner.temp }}/torch-constraints.txt"
    - shell: bash
      run: UV_CONSTRAINT="$RUNNER_TEMP/torch-constraints.txt" ./scripts/setup_envs.sh
    - shell: bash
      run: >
        uv pip install --python .venv-torch/bin/python
        --constraint "${{ runner.temp }}/torch-constraints.txt"
        --index-url https://download.pytorch.org/whl/cpu
        torch==2.13.0+cpu
    - name: Checkout pinned ComfyUI source
      if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: |
        git init --quiet "$RUNNER_TEMP/comfyui-source"
        git -C "$RUNNER_TEMP/comfyui-source" remote add origin https://github.com/Comfy-Org/ComfyUI.git
        git -C "$RUNNER_TEMP/comfyui-source" fetch --quiet --depth=1 --filter=blob:none origin \
          b78cec879b9460d5cb25228a83a942fb78d2cd24 \
          c67885b14556cf3e4e061862925282d403d09862 \
          15eb748b3ec5f8a0a2d470b7fb280e2d7579f916 \
          8a33128f2f8c5585c57486c07de481241e70a39c
        git -C "$RUNNER_TEMP/comfyui-source" checkout --quiet --detach b78cec879b9460d5cb25228a83a942fb78d2cd24
    - name: Checkout pinned workflow templates
      if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: |
        git init --quiet "$RUNNER_TEMP/workflow-templates-source"
        git -C "$RUNNER_TEMP/workflow-templates-source" remote add origin https://github.com/Comfy-Org/workflow_templates.git
        git -C "$RUNNER_TEMP/workflow-templates-source" fetch --quiet --depth=1 --filter=blob:none origin d3b4a9e89573162b005961865164c18c8ae2206b
        git -C "$RUNNER_TEMP/workflow-templates-source" checkout --quiet --detach FETCH_HEAD
    - name: Acquire pinned Impact Pack source
      if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/impact-special-samplers.py" \
          https://raw.githubusercontent.com/ltdrdata/ComfyUI-Impact-Pack/429d0159ad429e64d2b3916e6e7be9c22d025c3c/modules/impact/special_samplers.py
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/impact-core.py" \
          https://raw.githubusercontent.com/ltdrdata/ComfyUI-Impact-Pack/429d0159ad429e64d2b3916e6e7be9c22d025c3c/modules/impact/core.py
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/inspire-sampler-nodes.py" \
          https://raw.githubusercontent.com/ltdrdata/ComfyUI-Inspire-Pack/6b2ca017a168bcdba5f22c258b3b86c5c76470ca/inspire/sampler_nodes.py
        echo "32647b60dd169f953b04ebdacf9e2a59c3870ecf442f01f3f76d96906283989c  $RUNNER_TEMP/impact-special-samplers.py" | sha256sum --check
        echo "7989de178999904cacf440bd6c9fd6d250ff5f8df8a4a2dad7abe33d2dfacdd5  $RUNNER_TEMP/impact-core.py" | sha256sum --check
        echo "153c5cbf334ca67176569625d10feac924bb289a8c18321bcaee0d9a99d18c51  $RUNNER_TEMP/inspire-sampler-nodes.py" | sha256sum --check
    - name: Verify source-generated parity receipts
      if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      env:
        DINKSTER_INFERENCE_PARITY_RECORDS: ${{ github.workspace }}/.evidence-source/inference-parity/records
        COMFYUI_ROOT: ${{ runner.temp }}/comfyui-source
        WORKFLOW_TEMPLATES_ROOT: ${{ runner.temp }}/workflow-templates-source
        IMPACT_PACK_SOURCE: ${{ runner.temp }}/impact-special-samplers.py
        IMPACT_PACK_CORE_SOURCE: ${{ runner.temp }}/impact-core.py
        INSPIRE_PACK_SOURCE: ${{ runner.temp }}/inspire-sampler-nodes.py
      run: .venv-torch/bin/python tools/gen_comfy_source_parity_receipts.py --check
    - name: Test source-parity receipt generation
      if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      env:
        DINKSTER_INFERENCE_PARITY_RECORDS: ${{ github.workspace }}/.evidence-source/inference-parity/records
        COMFYUI_ROOT: ${{ runner.temp }}/comfyui-source
        WORKFLOW_TEMPLATES_ROOT: ${{ runner.temp }}/workflow-templates-source
        IMPACT_PACK_SOURCE: ${{ runner.temp }}/impact-special-samplers.py
        IMPACT_PACK_CORE_SOURCE: ${{ runner.temp }}/impact-core.py
        INSPIRE_PACK_SOURCE: ${{ runner.temp }}/inspire-sampler-nodes.py
      run: .venv-torch/bin/python -m pytest -q tests/test_gen_comfy_source_parity_receipts.py
    # Typecheck the torch-side pyright projects before the test suites:
    # the root pyright project excludes every package that imports torch,
    # so these are the only hosted runs that see them (#981). They resolve
    # against the .venv-torch built above. The vision provider packages
    # are checked further down next to their suites.
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv/bin/pyright -p .evidence-source/packages/dinkster-acceptance --pythonpath .venv-torch/bin/python
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: >
        .venv-torch/bin/python -m pytest -q
        .evidence-source/packages/dinkster-acceptance/tests/test_acceptance_closure.py
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv/bin/pyright -p packages/dinkster-inference-torch
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv/bin/pyright -p packages/dinkster-training-torch
    - name: Assert pinned CPU dispatch
      shell: bash
      run: |
        grep -m1 'model name' /proc/cpuinfo
        vendor="$(grep -m1 '^vendor_id' /proc/cpuinfo | awk '{print $3}')"
        echo "vendor_id: $vendor"
        if [ "$vendor" != "AuthenticAMD" ] || ! grep -qw avx2 /proc/cpuinfo || grep -qw avx512f /proc/cpuinfo; then
          echo "Exact CPU vectors require an AMD host without AVX-512 (#900, #1045)."
          exit 1
        fi
        echo "no avx512f"
        .venv-torch/bin/python - <<'EOF'
        import torch
        capability = torch.backends.cpu.get_cpu_capability()
        print(f"torch {torch.__version__} ATen CPU capability: {capability}")
        assert capability == "AVX2", capability
        EOF
        # Log the oneMKL CNR state actually engaged for GEMM. oneMKL is
        # deliberately unpinned (MKL_CBWR unset), so CNR:OFF is expected;
        # the engaged state is recorded for divergence forensics, not
        # asserted. The probe itself must succeed - only the grep is
        # non-asserting, so a probe failure fails the step instead of
        # being masked.
        MKL_VERBOSE=1 .venv-torch/bin/python -c "import torch; a = torch.randn(512, 512); b = a @ a" > "$RUNNER_TEMP/mkl-verbose.log" 2>&1
        grep -m1 -o 'CNR:[A-Z0-9_,]*' "$RUNNER_TEMP/mkl-verbose.log" || echo 'no MKL verbose GEMM line'
    - name: Test training runtime
      if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      env:
        OMP_NUM_THREADS: "4"
        MKL_NUM_THREADS: "4"
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-training-torch/tests
    - name: Test inference and IPAdapter
      if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'inference'
      shell: bash
      env:
        DINKSTER_MODEL_PYTEST_ARGS: ${{ inputs.pytest-args }}
      run: >
        "$HOME/comfy-vibe-station/run_counted_suite.sh"
        .venv-torch/bin/python -m pytest -q
        $DINKSTER_MODEL_PYTEST_ARGS
        packages/dinkster-inference-torch/tests
        packages/dinkster-model-ipadapter/tests
    - name: Test acceptance sampling
      if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'acceptance'
      shell: bash
      run: >
        "$HOME/comfy-vibe-station/run_counted_suite.sh"
        .venv-torch/bin/python -m pytest -q
        .evidence-source/packages/dinkster-acceptance/tests/test_acceptance_sampling.py
    - name: Acquire pinned line and edge parity artifacts
      if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-fast'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/ControlNetHED.pth" \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/ControlNetHED.pth
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/sk_model.pth" \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/sk_model.pth
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/sk_model2.pth" \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/sk_model2.pth
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/netG.pth" \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/netG.pth
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/erika.pth" \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/erika.pth
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/mlsd_large_512_fp32.pth" \
          https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/mlsd_large_512_fp32.pth
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/7_model.pth" \
          https://huggingface.co/bdsqlsz/qinglong_controlnet-lllite/resolve/67006a35a5955437d118490bfec822402eff09f5/Annotators/7_model.pth
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/MTEED.pth" \
          https://huggingface.co/TheMistoAI/MistoLine/resolve/1d9d0b3d48b295cf70d80a0f839a3055672f8393/Anyline/MTEED.pth
        sha256sum --check <<EOF
        5ca93762ffd68a29fee1af9d495bf6aab80ae86f08905fb35472a083a4c7a8fa  $RUNNER_TEMP/ControlNetHED.pth
        c686ced2a666b4850b4bb6ccf0748031c3eda9f822de73a34b8979970d90f0c6  $RUNNER_TEMP/sk_model.pth
        30a534781061f34e83bb9406b4335da4ff2616c95d22a585c1245aa8363e74e0  $RUNNER_TEMP/sk_model2.pth
        ccabdcc3f5cf3c07cf65d58776acb21df7dfda825cdc70c9766a93fd62bfc488  $RUNNER_TEMP/netG.pth
        badbd6baf013cefbd98993307b02cc14a26c770d067416e4fdecc8720b88feeb  $RUNNER_TEMP/erika.pth
        5696f168eb2c30d4374bbfd45436f7415bb4d88da29bea97eea0101520fba082  $RUNNER_TEMP/mlsd_large_512_fp32.pth
        b9037964149c55156c6adbffdfbd7e8ca7d2ef2a4d90573520efa7f3a1aacf06  $RUNNER_TEMP/7_model.pth
        a3c2d8a8ce9422555c787160bd46362d761325a565333c0e3f6a53e0bae2abdb  $RUNNER_TEMP/MTEED.pth
        EOF
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv/bin/pyright -p packages/dinkster-nodes-vision
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_hed.py
    - if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-fast'
      shell: bash
      env:
        DINKSTER_HED_TEST_MODEL: ${{ runner.temp }}/ControlNetHED.pth
        DINKSTER_LINEART_REALISTIC_TEST_MODEL: ${{ runner.temp }}/sk_model.pth
        DINKSTER_LINEART_REALISTIC_COARSE_TEST_MODEL: ${{ runner.temp }}/sk_model2.pth
        DINKSTER_LINEART_ANIME_TEST_MODEL: ${{ runner.temp }}/netG.pth
        DINKSTER_LINEART_MANGA_TEST_MODEL: ${{ runner.temp }}/erika.pth
        DINKSTER_MLSD_TEST_MODEL: ${{ runner.temp }}/mlsd_large_512_fp32.pth
        DINKSTER_TEED_TEST_MODEL: ${{ runner.temp }}/7_model.pth
        DINKSTER_MTEED_TEST_MODEL: ${{ runner.temp }}/MTEED.pth
      run: >
        "$HOME/comfy-vibe-station/run_counted_suite.sh"
        .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_hed.py
    - name: Acquire pinned upscale parity artifacts
      if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-fast'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/RealESRGAN_x4plus_anime_6B.pth" \
          https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/realesr-general-x4v3.pth" \
          https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
        sha256sum --check <<EOF
        f872d837d3c90ed2e05227bed711af5671a6fd1c9f7d7e91c911a61f155e99da  $RUNNER_TEMP/RealESRGAN_x4plus_anime_6B.pth
        8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292  $RUNNER_TEMP/realesr-general-x4v3.pth
        EOF
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_upscale.py
    - if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-fast'
      shell: bash
      env:
        DINKSTER_UPSCALE_TEST_ANIME6B: ${{ runner.temp }}/RealESRGAN_x4plus_anime_6B.pth
        DINKSTER_UPSCALE_TEST_GENERAL: ${{ runner.temp }}/realesr-general-x4v3.pth
      run: >
        "$HOME/comfy-vibe-station/run_counted_suite.sh"
        .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_upscale.py
    - name: Acquire pinned Depth Anything V2 parity artifact
      if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-detection'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/depth-anything-v2-large.safetensors" \
          https://huggingface.co/depth-anything/Depth-Anything-V2-Large-hf/resolve/7581137eff8d4e94f6e796d3baea0e9fa79b22d2/model.safetensors
        echo "4e01e34ed5549b529b70b92d53226bc370f03041977b390d3dde45d47f516cf9  $RUNNER_TEMP/depth-anything-v2-large.safetensors" | sha256sum --check
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_depth_anything_v2.py
    - if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-detection'
      shell: bash
      env:
        DINKSTER_DEPTH_ANYTHING_V2_TEST_MODEL: ${{ runner.temp }}/depth-anything-v2-large.safetensors
      run: >
        "$HOME/comfy-vibe-station/run_counted_suite.sh"
        .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_depth_anything_v2.py
    - name: Acquire pinned DETR parity artifact
      if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-detection'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/detr-r50-e632da11.pth" \
          https://dl.fbaipublicfiles.com/detr/detr-r50-e632da11.pth
        echo "e632da11ec76ae67bac2f8579fbed3724e08dead7d200ca13e019b197784eadc  $RUNNER_TEMP/detr-r50-e632da11.pth" | sha256sum --check
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_detr.py
    - if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-detection'
      shell: bash
      env:
        DINKSTER_DETR_TEST_MODEL: ${{ runner.temp }}/detr-r50-e632da11.pth
      run: >
        "$HOME/comfy-vibe-station/run_counted_suite.sh"
        .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_detr.py
    - name: Acquire pinned RT-DETR parity artifact
      if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-detection'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/rt_detr_v4-x-hgnet_fp16.safetensors" \
          https://huggingface.co/Comfy-Org/SDPose/resolve/f122ac7976997885e3bfeab2bb3a537a6bc250bc/diffusion_models/rt_detr_v4-x-hgnet_fp16.safetensors
        echo "581f9af9bbabb664d1891cbccd823308b176ecd409146f954dfa39af3bec2476  $RUNNER_TEMP/rt_detr_v4-x-hgnet_fp16.safetensors" | sha256sum --check
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_rtdetr.py
    - if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-detection'
      shell: bash
      env:
        DINKSTER_RTDETR_TEST_MODEL: ${{ runner.temp }}/rt_detr_v4-x-hgnet_fp16.safetensors
      run: >
        "$HOME/comfy-vibe-station/run_counted_suite.sh"
        .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_rtdetr.py
    - name: Acquire pinned EfficientSAM parity artifacts
      if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-fast'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/efficient-sam-vitt-encoder-d525f622.onnx" \
          https://github.com/yformer/EfficientSAM/raw/d525f622e6f640acf5a0fc37c7ca1f243da5bde0/weights/efficient_sam_vitt_encoder.onnx
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/efficient-sam-vitt-decoder-d525f622.onnx" \
          https://github.com/yformer/EfficientSAM/raw/d525f622e6f640acf5a0fc37c7ca1f243da5bde0/weights/efficient_sam_vitt_decoder.onnx
        sha256sum --check <<EOF
        84ed466ffcc5c1f8d08409bc34a23bb364ab2c15e402cb12d4335a42be0e0951  $RUNNER_TEMP/efficient-sam-vitt-encoder-d525f622.onnx
        a62f8fa5ea080447c0689418d69e58f1e83e0b7adf9c142e2bd9bcc8045c0b11  $RUNNER_TEMP/efficient-sam-vitt-decoder-d525f622.onnx
        EOF
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_efficient_sam.py
    - if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-fast'
      shell: bash
      env:
        DINKSTER_EFFICIENT_SAM_TEST_ENCODER: ${{ runner.temp }}/efficient-sam-vitt-encoder-d525f622.onnx
        DINKSTER_EFFICIENT_SAM_TEST_DECODER: ${{ runner.temp }}/efficient-sam-vitt-decoder-d525f622.onnx
      run: >
        "$HOME/comfy-vibe-station/run_counted_suite.sh"
        .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_efficient_sam.py
    - name: Acquire pinned BiRefNet parity artifact
      if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-large'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/birefnet.safetensors" \
          https://huggingface.co/Comfy-Org/BiRefNet/resolve/35767b272f2846752a3aee1259abdd4586f735c8/background_removal/birefnet.safetensors
        echo "9ab37426bf4de0567af6b5d21b16151357149139362e6e8992021b8ce356a154  $RUNNER_TEMP/birefnet.safetensors" | sha256sum --check
    - if: env.DINKSTER_MODEL_TEST_GROUP == ''
      shell: bash
      run: .venv-torch/bin/python -m pytest -q packages/dinkster-nodes-vision/tests/test_birefnet.py
    - if: inputs.run-model-tests == 'true' && env.DINKSTER_MODEL_TEST_GROUP == 'vision-large'
      shell: bash
      env:
        DINKSTER_BIREFNET_TEST_MODEL: ${{ runner.temp }}/birefnet.safetensors
      run: >
        "$HOME/comfy-vibe-station/run_counted_suite.sh"
