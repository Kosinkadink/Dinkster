name: torch-cpu suite
description: Set up CPU-only dependencies and run the comfy or no-model vision suite
inputs:
  suite:
    description: Non-model suites to run (all, comfy, or vision)
    default: "all"
  comfy-pytest-args:
    description: Additional pytest arguments for the comfy suite
    default: ""
  evidence-deploy-key:
    description: Read-only dinkster-evidence deploy key for vision root contracts
    required: false
runs:
  using: composite
  steps:
    - uses: ./.github/actions/prepare-validation-inputs
      if: inputs.suite != 'comfy'
      with:
        evidence-deploy-key: ${{ inputs.evidence-deploy-key }}
        coverage: "false"
    - uses: astral-sh/setup-uv@v5
    - name: Install the published CPU base and locked workspace
      shell: bash
      run: uv run --no-project python scripts/setup_envs.py --variant linux-cpu
    - name: Assert pinned AVX2 dispatch
      shell: bash
      run: |
        grep -m1 'model name' /proc/cpuinfo
        .venv/bin/python - <<'PY'
        import torch
        capability = torch.backends.cpu.get_cpu_capability()
        print(f"torch {torch.__version__} ATen CPU capability: {capability}")
        assert capability == "AVX2", capability
        PY
    - name: Test CPU comfy contracts
      if: inputs.suite != 'vision'
      shell: bash
      run: .venv/bin/python -m pytest -q packages/dinkster-nodes-comfy/tests ${{ inputs.comfy-pytest-args }}
    - name: Check vision types
      if: inputs.suite != 'comfy'
      shell: bash
      run: .venv/bin/pyright -p packages/dinkster-nodes-vision
    - name: Test CPU vision and root contracts
      if: inputs.suite != 'comfy'
      shell: bash
      env:
        DINKSTER_ACCELERATOR: cpu
      run: |
        .venv/bin/python -m pytest -q packages/dinkster-nodes-vision/tests
        .venv/bin/python -m pytest -v \
          tests/test_audio_materializer.py \
          tests/test_cpu_pack_composition.py \
          tests/test_minimax_h3_multigpu_receipt.py \
          tests/test_multigpu_modes.py \
          tests/test_fork_attention.py \
          tests/test_fork_loader_torch.py \
          tests/test_legacy_sources.py \
          tests/test_compose.py::test_full_free_releases_tensors_held_by_memory_execution_cache
        .venv/bin/python -m pytest -v \
          .evidence-source/h3-parity/test_run_comparison.py \
          .evidence-source/model-family-comparison/test_validate.py
